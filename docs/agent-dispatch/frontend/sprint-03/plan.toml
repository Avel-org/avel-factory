# frontend/sprint-03: the sprint's plan. Zero writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Fenn's tests, Fantem's build, Fenn's review.
# Check it:   scripts/render.py --check frontend/sprint-03
# Render it:  scripts/render.py frontend/sprint-03   (after approval), then commit the folder.
#
# Javaris (Nov 17): the web recreates his prototype, and the sidebar comes whole. Two tickets
# (C2): T-F5 the main and Factory groups with their placeholder pages, T-F6 (sprint-04) the
# Projects group with its rows. Javaris (Nov 17): the sidebar first, then T-F3 (sheet, sprint-05)
# and T-F4 (collapse and badge, sprint-06).

lane = "frontend"
sprint = "sprint-03"
step = 1
title = "The sidebar's pages: Live, Business, Clients, Library, Agents and Settings"
goals = [
  "Every entry in the sidebar's main and Factory groups opens its page, titled as in the prototype",
]
done_when = [
  "shell-layout.md revision 3, section 4: the unlabelled main group and the small Factory group, each entry with its placeholder page",
  "Every new page passes the WCAG 2.2 AA check (E17), carries no money (E15), and / stays within 150 KB of JavaScript (E16)",
]
sources = [
  { path = "docs/ui-contracts/shell-layout.md", why = "revision 3 of section 4: the prototype's groups, the placeholders, S17" },
  { path = "docs/ui-reference/control-room-prototype.html", why = "the prototype (a bundler page): NAV, NAV_LABEL and PAGES in its template, read as data" },
]

[commands]
build = "pnpm --filter @avel/web exec vite build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm --filter @avel/web exec vitest run && pnpm --filter @avel/web exec playwright test"

[analysis]
stack = "TanStack Start on Vite 8, React 19, Tailwind v4, the oRPC client over @avel/contract, contract-mock in dev and tests. Vitest 5 (node, react-dom/server) and Playwright with axe-core. No jsdom"
layout = "apps/web after T-F1 and T-F2: src/kit (AppShell, Icon, kit.css), src/modules/system/nav.ts (navFromRoutes), src/routes/_shell.tsx with / at routes/_shell/index.tsx, src/home, src/data/client.ts, src/styles. Earlier tickets' locked tests stay on main and must keep passing"
conventions = [
  "AGENTS.md and Build rules E4: strict TypeScript, Biome with no warnings, no console.log",
  "E15: no money anywhere, no '$'; agent, client and Canon text is plain text",
  "shell-layout.md section 0: nothing moves at hydration, every width is a media query",
]
notes = [
  "Reading the prototype: it's a bundler page, never run. Its app is the JSON string in <script type=\"__bundler/template\">. Extract it as data, for example `python3 -I -c 'import json,re,sys; h=open(sys.argv[1]).read(); print(json.loads(re.search(r\"<script type=\\\"__bundler/template\\\"[^>]*>([\\s\\S]*?)</script>\", h).group(1)))' docs/ui-reference/control-room-prototype.html > <your scratch file>`, then read NAV, NAV_LABEL and PAGES in it",
  "Out of T-F5, for T-F6: the Projects group (its head, the All link, project rows), /missions and /missions/$missionId, the --cr-id colours. Still out: the pages' real content, New project, the Project tab and avel-project; the sheet and More (T-F3), the collapse and the badge (T-F4)",
]

[[ticket]]
id = "T-F5"
slug = "sidebar-pages"
title = "The sidebar's main and Factory groups, with placeholder pages from the prototype"
goal = "The sidebar shows the prototype's main group (Decisions, Live, Business, Clients) and its small Factory group (Library, Agents, Settings), and each entry opens a page titled as in the prototype that says plainly what's there."
refs = [
  "shell-layout.md revision 3, section 4; S17",
  "control-room-prototype.html: NAV, NAV_LABEL, PAGES (live, business, clients, library, roster, settings)",
]
depends_on = ["T-F2"]
may_change = [
  "apps/web/src/kit/**",
  "apps/web/src/modules/system/**",
  "apps/web/src/routes/**",
  "apps/web/src/routeTree.gen.ts",
]
must_not_change = [
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/src/styles/tokens.css",
  "apps/web/src/home/**",
  "apps/web/src/data/**",
  "apps/web/test/foundation.test.ts",
  "apps/web/test/gitignore.test.ts",
  "apps/web/test/home-loader.test.ts",
  "apps/web/test/home-loader-states.test.ts",
  "apps/web/test/home-view.test.ts",
  "apps/web/test/hygiene.test.ts",
  "apps/web/e2e/budget.spec.ts",
  "apps/web/e2e/home.spec.ts",
  "apps/web/e2e/states.spec.ts",
  "apps/web/e2e/support/page.ts",
  "apps/web/e2e/support/ports.ts",
  "apps/web/vitest.config.ts",
  "apps/web/playwright.config.ts",
  "apps/web/test/shell/app-shell.test.tsx",
  "apps/web/test/shell/kit-css.test.ts",
  "apps/web/test/shell/support.tsx",
  "apps/web/e2e/shell/a11y.spec.ts",
  "apps/web/e2e/shell/frame.spec.ts",
  "apps/web/e2e/shell/hydration.spec.ts",
  "apps/web/e2e/shell/support.ts",
  "apps/web/test/shell-sheet/**",
  "apps/web/e2e/shell-sheet/**",
  "apps/web/test/shell-rail/**",
  "apps/web/e2e/shell-rail/**",
]
context = [
  { path = "docs/ui-contracts/shell-layout.md", why = "revision 3 under section 4: the groups, entries, labels, icons, placeholders and titles; section 3's ScreenHeader; S17" },
  { path = "docs/ui-reference/control-room-prototype.html", why = "PAGES' eyebrow, title, lead and empty state for live, business, clients, library, roster and settings; NAV's small Factory rows; its .cr-nav and .scr-head and widget-state rules; its Lucide nodes for bot and settings-2" },
  { path = "docs/design/AVEL Enclosure Grid · Design library v1.9.html", why = "ScreenHeader (.scr-head, its ea function), WidgetState (OT) and the Lucide nodes it has (activity, wallet, building, swatch-book, radio, blocks)" },
  { path = "apps/web/src/modules/system/nav.ts", why = "navFromRoutes, which gains unlabelled and small groups" },
  { path = "apps/web/src/routes/_shell/index.tsx", why = "Decisions' staticData.nav moves from the Decide group to the unlabelled main group" },
]
verify = [
  "pnpm --filter @avel/web exec vitest run",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm --filter @avel/web exec vite build",
  "pnpm --filter @avel/web exec tsc -p tsconfig.json --noEmit",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "No new dependency and no API call: the six pages read nothing. Icons are inline Lucide nodes in Icon.tsx, from the DL's registry or, for bot and settings-2, the prototype's, with Lucide's ISC notice kept",
  "The seams the tests use: apps/web/src/kit/ScreenHeader.tsx exports ScreenHeader({ eyebrow?, title, lead? }) with the title as the page's h1 (section 3). apps/web/src/kit/WidgetState.tsx exports WidgetState({ icon, title, message? }), the DL's empty state, its icon aria-hidden. staticData.nav gains group: '' for the unlabelled main group and size: 'sm' for the Factory group's rows; navFromRoutes keeps groups in section 4 revision 3's order and draws no label for ''",
  "The routes, all under _shell, ssr: true, each with staticData.nav = { group, order, label, icon } and the document title '{title} · AVEL'. Main group (group ''): Decisions / (order 1, moved from Decide), Live /live (2, label 'Live', icon activity, title 'Factory live', eyebrow 'Watch'), Business /business (3, wallet), Clients /clients (4, building). Factory group (group 'Factory', size sm): Library /library/skills (1, swatch-book), Agents /roster (2, bot), Settings /settings (3, settings-2)",
  "Each page is ScreenHeader then WidgetState. Live, Library and Agents use the prototype's eyebrow, title, lead and empty state word for word (Library's {kind} is 'skills'), without the empty state's actions, whose targets don't exist. Clients and Settings use the prototype's eyebrow, title and lead, and WidgetState '{title} isn't built yet': the mock has clients, so 'No clients yet' would be false, and Settings has no empty state. Business uses eyebrow 'Business' and title 'Business', no lead, and WidgetState 'Business isn't built yet': the prototype's lead and empty state are about margin and dollars, which E15 forbids",
  "The sidebar: the main group has no label; the Factory group's rows are the prototype's small rows (15px icons). The current row has aria-current=\"page\" on every page, and the crumb is the page's title. Moving between pages is a client navigation (no reload)",
  "The tests check what this ticket draws, never the absence of what T-F6, T-F3 and T-F4 add (the Projects group, /missions, project rows, the sheet, More, the collapse, badges) or of routes later tickets add. Count only what this ticket owns",
  "If a locked T-F1 or T-F2 test conflicts with shell-layout.md revision 3 (other than T-F2's nav.test.ts, which Fenn updates in this ticket), stop with test-dispute (F2); don't work around it",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/test/sidebar-pages/**", "apps/web/e2e/sidebar-pages/**", "apps/web/test/shell/nav.test.ts"]
behaviours = [
  "unit (T-F2's nav.test.ts, updated): with the real route tree, the first group is unlabelled and holds Decisions at / with inbox, Live, Business and Clients in that order with their icons, and Decisions is still a tab",
  "unit: navFromRoutes gives a Factory group with Library, Agents and Settings in that order, each marked small, after the main group; a group label '' draws no label",
  "unit: ScreenHeader renders the eyebrow, the title as the only h1, and the lead; WidgetState renders its icon aria-hidden, its title and its message",
  "e2e: at 1280x800, each of /live, /business, /clients, /library/skills, /roster and /settings is server-rendered inside the shell with its row aria-current, its h1, eyebrow and lead as the plan's table says, its state's title, and the document title '{title} · AVEL'",
  "e2e: clicking each main and Factory row from / reaches its page with no full reload, and the current row follows",
  "e2e: no page has '$' in its text, and /business has none of the words margin, revenue, payment or price",
  "e2e: the Factory group's rows are shorter than the main group's rows, and the main group shows no group label",
  "e2e: WCAG 2.2 AA with no violation on all six pages at 1280 and 390, in light and night",
]
