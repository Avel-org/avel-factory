# frontend/sprint-04: the sprint's plan. Zero writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Fenn's tests, Fantem's build, Fenn's review.
# Check it:   scripts/render.py --check frontend/sprint-04
# Render it:  scripts/render.py frontend/sprint-04   (after approval), then commit the folder.
#
# The sidebar's second half (Javaris, Nov 17: the whole sidebar, from his prototype): the
# Projects group. After T-F5 (sprint-03), because both change the shell's kit, nav and routes;
# then T-F3 (sprint-05) and T-F4 (sprint-06).

lane = "frontend"
sprint = "sprint-04"
step = 1
title = "The sidebar's Projects group: All projects and a row per project"
goals = [
  "The sidebar lists the open projects from the contract, each with its colour dot, and opens each one's page",
]
done_when = [
  "shell-layout.md revision 3, section 4: the Projects group's head with its All link, and one row per open project from routes 19 and 8 (S6's label, the --cr-id dot), each linked to Progress",
  "Every new page passes the WCAG 2.2 AA check (E17), and / stays within 150 KB of JavaScript (E16)",
]
sources = [
  { path = "docs/ui-contracts/shell-layout.md", why = "revision 3 of section 4: the Projects group; section 2: project rows (S6's label, leaving out closed and cancelled), _shell's loader; S17" },
  { path = "docs/ui-reference/control-room-prototype.html", why = "the prototype: the Projects group's head (.cr-nav-head), its rows (missionRow, missionDot, DOTS) and the --cr-id colours, read as data" },
]

[commands]
build = "pnpm --filter @avel/web exec vite build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm --filter @avel/web exec vitest run && pnpm --filter @avel/web exec playwright test"

[analysis]
stack = "TanStack Start on Vite 8, React 19, Tailwind v4, the oRPC client over @avel/contract, contract-mock in dev and tests (routes 8 and 19 with the sample world's missions and clients). Vitest 5 (node, react-dom/server) and Playwright with axe-core. No jsdom"
layout = "apps/web after T-F1, T-F2 and T-F5: src/kit (AppShell, ScreenHeader, WidgetState, Icon, kit.css), src/modules/system/nav.ts, src/routes/_shell.tsx and its pages, src/home, src/data/client.ts (route 52 only, narrowed for the budget), src/styles. Earlier tickets' locked tests stay on main and must keep passing"
conventions = [
  "AGENTS.md and Build rules E4: strict TypeScript, Biome with no warnings, no console.log",
  "E15: no money, no '$'; client names and package keys are plain text, never HTML",
  "shell-layout.md section 0: nothing moves at hydration, every width is a media query",
]
notes = [
  "Reading the prototype: a bundler page, never run. Extract the JSON string in <script type=\"__bundler/template\"> as data (T-F5's plan shows one way) and read NAV, PAGES, missionRow, missionDot and DOTS, and the --cr-id rules",
  "Out of T-F6: New project and its + link (no /missions/new route yet, S17), project badges, Step N of 5 (S7), project page trees, the Project tab and avel-project, the real All projects and Progress content",
]

[[ticket]]
id = "T-F6"
slug = "sidebar-projects"
title = "The sidebar's Projects group: the All link, project rows from routes 19 and 8, and their pages"
goal = "The sidebar's Projects group lists every open project as '{client} · {package}' with its colour dot, and its All link and each row open their page."
refs = [
  "shell-layout.md revision 3, section 4; section 2's project rows and S6; S17",
  "control-room-prototype.html: NAV's projects group, .cr-nav-head, missionRow, missionDot, DOTS, PAGES.projects and PAGES.progress",
]
depends_on = ["T-F5"]
may_change = [
  "apps/web/src/kit/**",
  "apps/web/src/modules/system/**",
  "apps/web/src/routes/**",
  "apps/web/src/routeTree.gen.ts",
  "apps/web/src/styles/project-identity.css",
  "apps/web/src/styles/app.css",
]
must_not_change = [
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/src/styles/tokens.css",
  "apps/web/src/home/**",
  "apps/web/src/data/**",
  "apps/web/test/foundation.test.ts",
  "apps/web/test/gitignore.test.ts",
  "apps/web/test/home-loader.test.ts",
  "apps/web/test/home-loader-states.test.ts",
  "apps/web/test/home-view.test.ts",
  "apps/web/test/hygiene.test.ts",
  "apps/web/e2e/budget.spec.ts",
  "apps/web/e2e/home.spec.ts",
  "apps/web/e2e/states.spec.ts",
  "apps/web/e2e/support/page.ts",
  "apps/web/e2e/support/ports.ts",
  "apps/web/vitest.config.ts",
  "apps/web/playwright.config.ts",
  "apps/web/test/shell/**",
  "apps/web/e2e/shell/**",
  "apps/web/test/shell-sheet/**",
  "apps/web/e2e/shell-sheet/**",
  "apps/web/test/shell-rail/**",
  "apps/web/e2e/shell-rail/**",
  "apps/web/test/sidebar-pages/**",
  "apps/web/e2e/sidebar-pages/**",
]
context = [
  { path = "docs/ui-contracts/shell-layout.md", why = "revision 3 under section 4; section 2: project rows (route 19's first page in order, leaving out closed and cancelled; S6's label: '{client name} · {package}', the package key read as capitalised words, the fallbacks 'Project' and the client or package alone), _shell's loader (a failure is swallowed and that part isn't drawn)" },
  { path = "docs/ui-reference/control-room-prototype.html", why = "the Projects group's head (label, the All link to /missions with aria-current on All projects), the row's dot (DOTS by the project's place in the list), the --cr-id-1 to --cr-id-5 colours for light and night, and PAGES.projects' and PAGES.progress' eyebrow, title and lead" },
  { path = "packages/contract/src/routes/missions.ts", why = "route 19, missions.list: a Page of MissionListRowDto (state, clientId, package)" },
  { path = "packages/contract/src/routes/clients.ts", why = "route 8, clients.list: a Page of ClientDto (the client's name)" },
  { path = "packages/contract-mock/src/mock.ts", why = "createMock({ world: true }) serves routes 19 and 8 with the sample world; failNext(19) and failNext(8) for the failure cases" },
]
verify = [
  "pnpm --filter @avel/web exec vitest run",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm --filter @avel/web exec vite build",
  "pnpm --filter @avel/web exec tsc -p tsconfig.json --noEmit",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "No new dependency. src/data stays as it is: the shell reads routes 19 and 8 through a server function (createServerFn) in src/modules/system, so their schemas never ship to the browser and the 150 KB budget holds. If the budget breaks anyway, stop and report; don't trim other code to fit",
  "The seams the tests use: apps/web/src/modules/system/projects.ts exports projectRows(missions, clients): { id, label, href, dot }[] — open projects only (not closed or cancelled), in route 19's order, label by S6, href /missions/{id}, dot 'var(--cr-id-N)' with N the row's place counted from 1, repeating after 5 — and projectLabel(mission, clients) for S6 alone",
  "_shell's loader reads routes 19 (the first page) and 8 on the server. A failure of either is swallowed: the Projects group still draws its head, with no rows. The rows come after the head in the Projects group, which sits between the main group and the Factory group",
  "The Projects group's head: the 'Projects' label and an 'All' link to /missions, aria-current=\"page\" on /missions. No + link: /missions/new doesn't exist (S17). A row: the dot (aria-hidden), the label as plain text, linked to Progress, aria-current=\"page\" on that project's page.",
  "apps/web/src/styles/project-identity.css holds the prototype's --cr-id-1 to --cr-id-5 rules for light and night, word for word; app.css imports it after tokens.css and changes nothing else. tokens.css is untouched",
  "/missions (All projects): ScreenHeader with the prototype's eyebrow 'Projects', title 'All projects' and lead, then WidgetState 'All projects isn't built yet' (the world has projects, so the prototype's 'No projects yet' would be false). /missions/$missionId (Progress): eyebrow 'Project', the S6 label as title and crumb, the prototype's lead, then WidgetState 'Progress isn't built yet'; an id not in route 19's first page shows WidgetState 'Not found' with a link back to All projects. Titles '{title} · AVEL'",
  "Every empty state here is ReUI's Empty (Javaris, Nov 17), through T-F5's WidgetState, which composes apps/web/src/components/ui/empty.tsx. Use WidgetState; don't install, copy or restyle Empty. Not found's link back goes in EmptyContent: WidgetState may gain an optional children prop rendered there, nothing more. The tests check [data-slot=empty] on /missions, Progress and Not found",
  "The tests check what this ticket draws, never the absence of what later tickets add (New project, badges, project page trees, the Project tab, T-F3's sheet and More, T-F4's collapse). Count only what this ticket owns",
  "If a locked T-F1, T-F2 or T-F5 test conflicts with shell-layout.md revision 3, stop with test-dispute (F2); don't work around it",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/test/sidebar-projects/**", "apps/web/e2e/sidebar-projects/**"]
behaviours = [
  "unit: projectLabel follows S6: '{client} · {Package words}', the client alone with no package, the package alone with no client found, 'Project' with neither, and an unknown package key as it is",
  "unit: projectRows leaves out closed and cancelled projects, keeps route 19's order, links each to /missions/{id}, and gives dots var(--cr-id-1) to var(--cr-id-5) by place, the sixth open project getting var(--cr-id-1) again",
  "unit: project-identity.css, read as text, defines --cr-id-1 to --cr-id-5 for light and for night, and app.css imports it after tokens.css",
  "e2e: under AVEL_API=mock at 1280x800, the server's HTML for / shows the Projects group's head with its All link, then one row per open world project in route 19's order, each with the S6 label and a dot in its --cr-id colour",
  "e2e: All goes to /missions with All projects' h1 and the link aria-current; a project row goes to its Progress page with the S6 label as h1 and the row aria-current; both are client navigations",
  "e2e: /missions/<an unknown id> shows Not found with a link back to All projects",
  "e2e: on the dev server with no mock, the Projects group shows its head and no rows, and the rest of the shell still draws",
  "e2e: WCAG 2.2 AA with no violation on /, /missions and a Progress page at 1280 and 390, in light and night, and no '$' in any page's text",
]
