# frontend/sprint-13: the sprint's plan. Zero writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Fenn's tests, Fantem's build, Fenn's review.
# Check it:   scripts/render.py --check frontend/sprint-13
# Render it:  scripts/render.py frontend/sprint-13   (after approval), then commit the folder.
#
# Javaris's build order (Nov 17, to OSA): the typed API client with the first screens it moves to
# real routes, then sign-in and session handling (T-F12), then the CLI login approval with step-up,
# paired with the backend's step-up and CLI login (backend sprint-03). One ticket, per his "fewer,
# bigger tickets". Settings is the first live screen because its routes (4 to 7) are the ones the
# backend ships next. Decisions (routes 52 and 54) moves to Step 6 or 7 (CR-31), and its client
# wouldn't fit /'s budget today.
# Renders only when: T-F12 is merged; CR-W30 B, C and D are on main; Zero has written
# docs/ui-contracts/cli-approval.md on CR-W30 B's wire; Javaris has ruled on the session limit
# (this ticket asks for 90 minutes and 120 turns).

lane = "frontend"
sprint = "sprint-13"
step = 1
title = "The control room talks to the API: Settings live, and the CLI login approved with step-up"
goals = [
  "Settings shows the real CLI sessions and health, and you approve an `avel login` from the web app with your password again",
]
done_when = [
  "Step 0 and Step 1 plan, test 9 as the web shows it (approval needs step-up; a wrong password gets no grant), against the mock, then against the real API once the backend's CLI login is on main",
]
sources = [
  { path = "docs/ui-contracts/cli-approval.md", why = "the approval page and the step-up dialog (Zero writes it on CR-W30 B)" },
  { path = "docs/ui-contracts/login.md", why = "section 2: the 401 handling this ticket finishes" },
  { path = "docs/design/CR-W30 The web's auth wire and a minified contract.md", why = "B (the step-up wire), C (routes 1 to 7 in the mock), D (the minified contract)" },
  { path = "docs/ui-reference/control-room-handoff/screens.md", why = "Settings: routes 4 to 7, its states" },
  { path = "docs/design/Step 0 and Step 1 plan.md", why = "items 6 and 7 (step-up grants, CLI login), tests 8 and 9" },
]

[commands]
build = "pnpm build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm --filter @avel/web exec vitest run && pnpm --filter @avel/web exec playwright test"

[analysis]
stack = "As sprint-12, plus @orpc/client 1.16.2 and @orpc/openapi-client 1.16.2 (already in apps/web), over @avel/contract's minified router (CR-W30 D)"
layout = "apps/web/src/data (the client and the error map), apps/web/src/auth (T-F12's session and the step-up call), apps/web/control-room (the export: Settings), apps/web/src/routes (the approval page)"
conventions = [
  "AGENTS.md; CR-W29 E4; no new dependency; screens never call fetch, the data layer does",
]
notes = [
  "Measured Nov 17 with esbuild: the client over the full contract is about 24 KB gzipped, over a minified router about 9 KB. It loads with Settings and the approval page, never in /'s first load",
]

[[ticket]]
id = "T-F13"
slug = "api-settings-cli-approval"
title = "The typed client, Settings live, and the CLI login approval with step-up"
goal = "Settings lists your real CLI sessions and lets you revoke one, shows health and the doctor's checks, and an `avel login` code is approved from the web app after you type your password again."
rigor = "full"
refs = ["CR-W30 B, C, D", "E16 (the data layer from the minified contract)", "CR-W29 E2 (each screen's wiring moves it to the oRPC client over contract-mock)", "Step 0 and Step 1 plan, items 6 and 7, tests 8 and 9", "Javaris, Nov 17: build order item 1 and 3; fewer, bigger tickets"]
depends_on = ["T-F12"]
may_change = [
  "apps/web/src/data/**",
  "apps/web/src/auth/**",
  "apps/web/src/routes/cli.approve.tsx",
  "apps/web/src/routeTree.gen.ts",
  "apps/web/control-room/src/pages/settings/**",
  "apps/web/control-room/src/lib/api.js",
  "apps/web/control-room/SOURCE.md",
]
must_not_change = [
  "packages/**",
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/control-room/src/mock/**",
  "apps/web/control-room/contract/**",
  "apps/web/src/routes/__root.tsx",
]
context = [
  { path = "apps/web/src/data/client.ts", why = "today's client over one route group with full schemas; it moves to the minified router and the whole contract" },
  { path = "packages/contract/src/errors.ts", why = "every error code the error map covers" },
  { path = "docs/ui-contracts/cli-approval.md", why = "the approval page, the step-up dialog, their states and copy" },
  { path = "docs/ui-contracts/login.md", why = "section 2's 401 rule (LG-06), finished here now that screens call the API" },
  { path = "apps/web/control-room/src/pages/settings/SettingsPage.jsx", why = "the screen that moves from the sample world to the client" },
  { path = "docs/ui-reference/control-room-handoff/screens.md", why = "Settings' routes and states" },
  { path = "apps/web/e2e/budget.spec.ts", why = "/'s budget, unchanged by this ticket; each other route at most 150 KB (E16)" },
]
verify = [
  "pnpm --filter @avel/web exec vitest run",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm --filter @avel/web exec vite build",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "The client: data/client.ts covers all of contract 1.0.0 through the minified router (CR-W30 D), with the Zod schemas left out of the browser bundle. One error map gives every code in errors.ts a plain sentence. Where screens.md or a UI contract names a state's words, use them. The report lists each code and its sentence",
  "The export reaches the client through one module, control-room/src/lib/api.js, so pages never import fetch or the client directly. Settings is the only page moved off the sample world in this ticket. Every other page keeps its mock JSON",
  "Settings: GET /api/cli/sessions (route 4), DELETE /api/cli/sessions/{sessionId} (route 5, with an Idempotency-Key, its replay answered as the first response), GET /api/health (6), GET /api/doctor (7). States: loading, empty (the export's No CLI sessions), ready, a check failing, and error with the error map's sentence. Refetched when opened (screens.md: nothing polls)",
  "The approval page follows cli-approval.md. Approving calls the step-up endpoint with the password, then route 2 with the grant, as CR-W30 B fixes the carrier. Approvals elsewhere never ask for a password (E15); this page does because route 2 is a credential action. The password is never stored, logged or kept in state after the request",
  "401 from any contract route: the session in __root's context becomes null, and the page goes once to /login?next=…&reason=expired with replace (login.md section 2, LG-06). No loop, and one navigation per burst",
  "Budget: nothing of the client in /'s first load. Copy budget.spec's / figure and the Settings and approval routes' sizes into the report and the PR text as numbers. Over a limit, stop with needs-cr",
  "Against the real API: once the backend's CLI login is on main, run the approval e2e against the real server too (handoff port order: the mock first, then the real API), and say in the report whether it ran. If the real server isn't there yet, the mock run stands",
  "Review, full rigor (G7): Fenn, then the second review against docs/review/security-checklist.md, then Javaris merges. The full-diff rule applies: every file in `git diff main...HEAD --name-only` is in this build's may-change list, this ticket's locked test files, its own dispatch reports in this sprint's folder, or locks.md. Anything else is a P1",
  "Size: more than one 60-minute session. This ticket asks for 90 minutes and 120 turns (limits.json's agent_session). If Javaris keeps 60, split it at the line between Settings and the approval page",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/test/api/**", "apps/web/test/cli-approval/**", "apps/web/e2e/settings-live/**", "apps/web/e2e/cli-approval/**"]
behaviours = [
  "unit: the client's procedure list equals the contract's routes 1 to the last, by number, method and path, and the browser bundle's client chunk holds no Zod schema",
  "unit: every code in packages/contract/src/errors.ts has a sentence in the error map, and none is the raw code or message",
  "e2e: Settings lists the mock's CLI sessions; revoking one removes it, and a replayed revoke changes nothing. Empty and error states render with their copy. Every Settings state passes the WCAG 2.2 AA check (E17)",
  "e2e: Settings shows health and the doctor's checks, with a failing check shown as failing",
  "e2e: approving a device login asks for the password, then approves; a wrong password gets no grant and the code stays pending; an unknown or expired code shows its state; at 390 and 1280, light and night, every state passes the WCAG 2.2 AA check",
  "e2e: route 2 called without a grant is refused (403 STEP_UP_REQUIRED), and the page shows the step-up dialog, not an error",
  "e2e: LG-06, a 401 from a contract route sends you once to /login?next=…&reason=expired, with the expired notice and no second navigation",
  "e2e: no page's HTML, storage or URL holds the password or a grant id after the approval",
]
