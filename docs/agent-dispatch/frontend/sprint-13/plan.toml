# frontend/sprint-13: the sprint's plan. Zero writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Fenn's tests, Fantem's build, Fenn's review.
# Check it:   scripts/render.py --check frontend/sprint-13
# Render it:  scripts/render.py frontend/sprint-13   (after approval), then commit the folder.
#
# Re-planned Nov 18 (Zero's re-plan, approved by Javaris, item 9 of his brief). T-F13 (the CLI login
# approval and Settings live) is withdrawn; CR-43 moves the CLI out of Step 1. This sprint wires the
# first mission's first screens to contract-mock: your approvals (T-F16) and a mission's start
# (T-F17), whose routes are CR-W31 part (a). It also moves CI's end-to-end tests to the production
# build (T-F15), which waited for T-F12 because both change playwright.config.ts. And it builds the
# rest of contract-mock's mission, CR-W31 parts (b) and (c), as T-F23 then T-F24 (Javaris, Nov 18,
# "yes i approve"), so sprint-14's screens (Canon, plan and dispatch, the build, release) run on it.
# Renders when T-F12, T-F14 and T-F22 (CR-W31 part (a)) are merged, and render.py puts builders
# on Opus (Javaris, Nov 18). CR-42: plan and render in one PR; one review round.
# Amended Nov 21 (T-F23 build a1's question on route 63; Zero's ruling): T-F23's tests take
# packages/contract-mock/test/world.test.ts, so Fenn can retire the seed's stub check on route 63 (F2).

lane = "frontend"
sprint = "sprint-13"
step = 1
title = "Your approvals and a mission's start, live on contract-mock"
goals = [
  "What's waiting on you comes from the API, and approving moves the mission on",
  "You add a client, start a project, and see it on its overview",
  "CI's end-to-end tests run against the build you ship",
  "contract-mock streams Canon, events and traces, and serves the rest of the mission's routes",
]
done_when = [
  "Each ticket's states (loading, empty, error with the error map's sentence, offline, not found, ready) render against contract-mock under AVEL_API=mock, and each passes WCAG 2.2 AA at 390 and 1280, light and night (E17)",
  "/ stays at most 235 KB gzipped (CR-W29 decision 6, second amendment); every other route at most 150 KB (E16)",
  "T-F7-05 is back from quarantine and passes 10 runs in a row against the production build",
]
sources = [
  { path = "docs/ui-reference/control-room-handoff/screens.md", why = "every screen: its routes by number, its states and their words" },
  { path = "docs/ui-reference/control-room-handoff/README.md", why = "the rules that aren't obvious: Decisions is home, approvals never ask for a password, no money, nothing polls" },
  { path = "docs/design/API routes.md", why = "each route by number" },
  { path = "docs/ui-contracts/decisions-approval-page.md", why = "the decision card, Undo and the stale state" },
]

[commands]
build = "pnpm build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm --filter @avel/web exec vitest run && pnpm --filter @avel/web exec playwright test"

[analysis]
stack = "As sprint-12. The client is src/data/client.ts over @avel/contract/minified (T-F14); the export reaches it only through control-room/src/lib/api.js; each screen group reads one source in control-room/src/sources/"
layout = "apps/web/control-room/src/sources/{decisions,missions,canon,plan,build,release}.js (T-F14), the pages under control-room/src/pages, each ticket's log in control-room/changes/<ticket id>.md"
conventions = [
  "AGENTS.md; CR-W29 E4; no new dependency; screens never call fetch or the client: their source does",
  "E15: no money except AI cost against its cap; agent, client and Canon text renders as plain text; approvals never ask for a password",
  "A screen ticket switches its own source to the API and changes only that source, its own pages and its changes file. If logic.js, operations.js or another source needs a change, stop with out-of-scope and say what",
]
notes = [
  "The sample world stays for every source this sprint doesn't switch, and for the export's own review switches (?sim=every, ?osa=1)",
  "Run only your ticket's specs while you work; CI runs the whole suite",
]

[[ticket]]
id = "T-F15"
slug = "e2e-production-build"
title = "The end-to-end suite runs against the build you ship"
goal = "CI's end-to-end tests run against the production build, so a lazy page never waits on the dev server's first compile, and the suite gives the same answer every run; T-F7-05 is back from quarantine."
rigor = "standard"
refs = ["F5 and issue #57 (T-F7-05 quarantined Nov 18, #58)", "F6 (end-to-end tests in CI)", "build review item 3.6 (sessions run only their ticket's specs)", "Fenn's P3 t-f9-fenn-01 (loose route titles)"]
depends_on = ["T-F12"]
may_change = [
  "apps/web/playwright.config.ts",
  "apps/web/vite.config.ts",
  ".github/workflows/ci.yml",
  "docs/quarantine.md",
]
must_not_change = [
  "packages/**",
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/src/**",
  "apps/web/control-room/**",
]
context = [
  { path = "apps/web/playwright.config.ts", why = "today's two web servers, both vite dev (with and without AVEL_API=mock); T-F12 added the sign-in setup project" },
  { path = "apps/web/vite.config.ts", why = "the mock middleware is apply: serve, configureServer only; vite preview needs it too" },
  { path = ".github/workflows/ci.yml", why = "the web e2e job" },
  { path = "docs/quarantine.md", why = "T-F7-05's row, removed when it's back" },
]
verify = [
  "pnpm --filter @avel/web exec vite build",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "Both web servers run vite build, then vite preview, under the same AVEL_API values. The mock middleware runs in preview too (configurePreviewServer), never in a deployed build. Local runs may keep vite dev through an env switch the report names; CI always uses the build",
  "Remove T-F7-05's row from docs/quarantine.md once the checker's un-skipped test passes, and close #57 in the PR text (Fixes #57)",
  "The PR changes .github/workflows/ci.yml, so Javaris merges it (CR-36's guardrail exclusion)",
  "Report the suite's time in CI before and after, as numbers",
  "Review: one round (CR-42); the full-diff rule applies as in T-F14",
  "Size: about 60 minutes",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/e2e/control-room/routes.spec.ts", "apps/web/e2e/control-room-screens/routes.ts", "apps/web/e2e/e2e-build/**"]
behaviours = [
  "e2e (behaviour): the server the suite runs against serves the production build: the page loads hashed scripts under /assets/ and never /@vite/client",
  "e2e (behaviour): under AVEL_API=mock, the preview server still answers /api with contract-mock (route 52 returns the mock's rows)",
  "e2e (guard): T-F7-05's test runs again (the quarantine's test.skip removed) and passes with --repeat-each 10 in one run",
  "e2e (guard): t-f9-fenn-01, each project tab and the Library's three pages are told apart by a per-tab marker (aria-current or a data-testid beside the h1), not the mission name alone",
]

[[ticket]]
id = "T-F16"
slug = "decisions-live"
title = "Decisions live: what's waiting on you, approved in one tap"
goal = "Decisions shows what's waiting on you from the API; you approve a checkpoint, a plan, a package, a pass or a release in one tap with Undo for 6 seconds, a card someone else changed says so and refreshes, and no approval asks for your password."
rigor = "full"
refs = ["CR-W31 part (a) (T-F22)", "handoff port order step 3 (Decisions)", "E15", "login.md section 2 (LG-06, the end-to-end check)", "C4: release and pass approval bind the receipt hash"]
depends_on = ["T-F12", "T-F14", "T-F22"]
may_change = [
  "apps/web/control-room/src/sources/decisions.js",
  "apps/web/control-room/src/app/decisions.js",
  "apps/web/control-room/src/pages/decisions/**",
  "apps/web/control-room/changes/T-F16.md",
]
must_not_change = [
  "packages/**",
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/src/**",
  "apps/web/control-room/src/app/logic.js",
  "apps/web/control-room/src/mock/**",
]
context = [
  { path = "apps/web/control-room/src/sources/decisions.js", why = "the source this ticket switches to the API (T-F14)" },
  { path = "apps/web/control-room/src/app/decisions.js", why = "approveCallFor, rejectCallFor and describeCall: each card's contract call" },
  { path = "docs/ui-contracts/decisions-approval-page.md", why = "the card, Undo, the 409 stale state, the 422 allowed moves" },
  { path = "apps/web/e2e/budget.spec.ts", why = "/ at most 235 KB" },
]
verify = [
  "pnpm --filter @avel/web exec vitest run",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm --filter @avel/web exec vite build",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "Reads: route 52 (the 10-kind PendingDecisionDto union), 53 (one proposal) and 104 (the waiting total, alerts and stallAfterMs). Writes, each card's own call: 54 (decide), 40 (approve a checkpoint), 44 (answer a question), 28 (finalize), 114 (confirm the package commit), 29 (pass approval) and 30 (release, with the receipt hash the row names). Every write sends an Idempotency-Key and the row's rowVersion or bound hash",
  "Undo: a tap holds the call for 6 seconds with Undo; Undo sends nothing. A 409 marks the card stale with the error map's sentence and refetches route 52; a 422 shows the allowed moves",
  "Kinds the first mission doesn't raise (factory changes, follow-ups) keep their cards and calls as the export has them, against the mock",
  "Budget: the client now loads on /. Move the sample JSON / imports for Decisions (pending-decisions.json, evidence-details.json) behind a lazy import in the source, so the sample world loads only when a review switch asks for it. Copy budget.spec's / figure into the report and the PR text as a number. Over 235 KB, stop with needs-cr",
  "Review, full rigor (G7): Fenn, then the second review against docs/review/security-checklist.md, then Javaris merges. One review round (CR-42). The full-diff rule: every file in `git diff main...HEAD --name-only` is in this build's may-change list, this ticket's locked test files, its own dispatch reports in this sprint's folder, or locks.md. Anything else is a P1",
  "Size: a full session (#45)",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/test/decisions-live/**", "apps/web/e2e/decisions-live/**"]
behaviours = [
  "e2e (behaviour): Decisions lists route 52's rows from the mock, with route 104's waiting total in the top bar",
  "e2e (behaviour): approving a checkpoint 0.1 card calls route 40 once after 6 seconds, the card leaves, and route 52 no longer lists it; Undo within 6 seconds sends nothing",
  "e2e (behaviour): finalize, package commit, pass approval and release each send their route with an Idempotency-Key and the row's version or hash, and no approval shows a password field",
  "e2e (behaviour): a 409 on approve marks the card stale with the error map's sentence and refetches; a 422 shows the allowed moves",
  "e2e (behaviour): LG-06, a 401 on route 52 sends you once to /login?next=...&reason=expired with the expired notice, and no second navigation",
  "e2e (behaviour): loading, empty (nothing waiting), error (500, offline) render with their words",
  "e2e (guard): every Decisions state passes WCAG 2.2 AA at 390 and 1280, light and night; / stays at most 235 KB; no '$' on the page (E15)",
]

