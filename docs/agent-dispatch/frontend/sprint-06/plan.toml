# frontend/sprint-06: the sprint's plan. Zero writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Fenn's tests, Fantem's build, Fenn's review.
# Check it:   scripts/render.py --check frontend/sprint-06
# Render it:  scripts/render.py frontend/sprint-06   (after approval), then commit the folder.
#
# The shell's third ticket (C2 split of shell-layout.md rev 2): the rail's collapse and the
# Decisions badge. Its own sprint because it changes kit/AppShell.tsx after T-F3 (Javaris,
# Nov 17: no shared sprints).

lane = "frontend"
sprint = "sprint-06"
step = 1
title = "The shell's rail: collapse it and remember it, and see what's waiting"
goals = [
  "On a desk the sidebar folds to an icon rail and stays that way after a reload, and the Decisions entry shows how many are waiting",
]
done_when = [
  "control-room-handoff README, port step 2 (Shell), third part: shell-layout.md rev 2 section 2's collapse and counts, and section 1's data-rail, passing flow-keyboard's ⌘B step",
  "Every width passes the WCAG 2.2 AA check (E17) with the rail open and collapsed, / stays within 150 KB of JavaScript (E16), and nothing moves at hydration",
]
sources = [
  { path = "docs/ui-contracts/shell-layout.md", why = "the shell's UI contract, rev 2: data-rail, the collapse, the badges and the cookies" },
  { path = "docs/design/AVEL Shell Layout brief v1.9.md", why = "the 64px icon rail, the tooltip, the remembered choice, the badge from route 52" },
  { path = "docs/ui-reference/control-room-handoff/README.md", why = "port step 2 and flow-keyboard; focus, motion and targets" },
]

[commands]
build = "pnpm --filter @avel/web exec vite build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm --filter @avel/web exec vitest run && pnpm --filter @avel/web exec playwright test"

[analysis]
stack = "TanStack Start on Vite 8, React 19, Tailwind v4, the oRPC client over @avel/contract, contract-mock in dev and tests. Vitest 5 (node, react-dom/server) and Playwright with axe-core. No jsdom"
layout = "apps/web after T-F1, T-F2, T-F5, T-F6 and T-F3: src/kit (AppShell with the sheet, ScreenHeader, WidgetState, Icon, kit.css), src/modules/system (nav.ts, projects.ts), the sidebar's pages and the Projects group, src/routes/_shell.tsx with / at routes/_shell/index.tsx, src/home (loadHome, HomeView), src/data/client.ts, src/styles. T-F1's to T-F3's locked tests stay on main and must keep passing"
conventions = [
  "AGENTS.md and Build rules E4: strict TypeScript, Biome with no warnings, no console.log",
  "E15: no money, no '$'",
  "shell-layout.md section 0: nothing moves at hydration, every width is a media query, preferences are cookies the server reads, nothing is measured until the user acts",
]
notes = [
  "Still out of the shell: project rows, their badges and avel-project (routes 19 and 8), the pages, sign-in, the live footer (S9), the highlight's glide (S4 needs two routes) and focus mode (waits for Canon, E8)",
]

[[ticket]]
id = "T-F4"
slug = "shell-rail"
title = "The shell's rail: collapse with its button or ⌘B, remembered in avel-rail, and the Decisions badge"
goal = "On a desk the sidebar folds to a 64px icon rail with its button, ⌘B or Ctrl+B, shows each name in a tooltip, and stays folded after a reload; the Decisions entry and tab show how many decisions are waiting."
refs = [
  "shell-layout.md rev 2, section 1 (data-rail on the AppShell element) and section 2 (Collapsed, the counts, _shell's loader and its cookies)",
  "control-room-handoff README, port step 2, flow-keyboard",
]
depends_on = ["T-F3"]
may_change = [
  "apps/web/src/kit/**",
  "apps/web/src/modules/system/**",
  "apps/web/src/routes/**",
  "apps/web/src/routeTree.gen.ts",
]
must_not_change = [
  "apps/web/package.json",
  "pnpm-lock.yaml",
  "apps/web/src/styles/tokens.css",
  "apps/web/src/home/**",
  "apps/web/src/data/**",
  "apps/web/test/foundation.test.ts",
  "apps/web/test/gitignore.test.ts",
  "apps/web/test/home-loader.test.ts",
  "apps/web/test/home-loader-states.test.ts",
  "apps/web/test/home-view.test.ts",
  "apps/web/test/hygiene.test.ts",
  "apps/web/e2e/budget.spec.ts",
  "apps/web/e2e/home.spec.ts",
  "apps/web/e2e/states.spec.ts",
  "apps/web/e2e/support/page.ts",
  "apps/web/e2e/support/ports.ts",
  "apps/web/vitest.config.ts",
  "apps/web/playwright.config.ts",
  "apps/web/test/shell/**",
  "apps/web/e2e/shell/**",
  "apps/web/test/shell-sheet/**",
  "apps/web/e2e/shell-sheet/**",
  "apps/web/test/sidebar-pages/**",
  "apps/web/e2e/sidebar-pages/**",
  "apps/web/test/sidebar-projects/**",
  "apps/web/e2e/sidebar-projects/**",
]
context = [
  { path = "docs/ui-contracts/shell-layout.md", why = "section 1: data-rail=\"collapsed\" on the AppShell element in the server's HTML; section 2: Collapsed (the DL's .lib-rail[data-collapsed] rules, ⌘B and Ctrl+B, the toggle, the 240ms transition only on a toggle, the tooltip from the item's rect), Counts (Decisions: route 52's loaded rows, then + while nextCursor isn't null, labelled '{text} waiting'; no badge for 0, no data or an error), _shell's loader and cookies; section 3: AppShellProps' collapsed and onCollapsedChange; S10" },
  { path = "docs/design/AVEL Shell Layout brief v1.9.md", why = "the 64px icon rail, the tooltip to the right, the remembered choice, the amber count badge" },
  { path = "docs/design/AVEL Enclosure Grid · Design library v1.9.html", why = "the toggle (.lib-rail-toggle: aria-label 'Collapse sidebar' or 'Expand sidebar', aria-expanded, the panel-left icon), .lib-rail[data-collapsed], .lib-rail-tip and .lib-tip, .lib-nav-badge and the tab badge (final cascade) for kit.css, and the panel-left Lucide node" },
  { path = "apps/web/src/kit/AppShell.tsx", why = "AppShell after T-F3, which gains collapsed, onCollapsedChange, the toggle, the tooltip and badges" },
  { path = "apps/web/src/routes/_shell.tsx", why = "the layout route, whose loader gains the avel-rail cookie and route 52" },
  { path = "apps/web/src/home/load-home.ts", why = "loadHome(client): the badge's count and more come from it, unchanged" },
]
verify = [
  "pnpm --filter @avel/web exec vitest run",
  "pnpm --filter @avel/web exec playwright test",
  "pnpm --filter @avel/web exec vite build",
  "pnpm --filter @avel/web exec tsc -p tsconfig.json --noEmit",
  "pnpm typecheck",
  "pnpm lint",
]
notes = [
  "No new dependency. The panel-left icon comes from the DL's Lucide nodes into Icon.tsx, as before. The badge reuses loadHome and createClient as they are: src/home and src/data don't change",
  "The seams the tests use: AppShell gains collapsed: boolean and onCollapsedChange(next: boolean) (section 3), and ShellItem's badge?: { text, label } and the tabs' badge. apps/web/src/modules/system/badge.ts exports decisionsBadge(state: HomeState): { text, label } | undefined: ready gives text '{count}' or '{count}+' with label '{text} waiting'; empty and error give undefined",
  "_shell's loader (ssr: true) reads the avel-rail cookie on the server (collapsed, else open) and awaits route 52 through loadHome. A failure gives no badge and is swallowed: the shell still draws. Route 52 is read by _shell and by / on the same load; that's accepted until the data core's cache",
  "In the server's HTML, the AppShell element has data-rail=\"collapsed\" when avel-rail=collapsed, and the rail draws collapsed then, so a reload paints it folded with nothing moving. The client writes avel-rail on each toggle with path=/; max-age=31536000; samesite=lax",
  "The toggle: beside the brand in the rail (1024px and wider), .lib-rail-toggle with aria-label 'Collapse sidebar' when open and 'Expand sidebar' when collapsed, aria-expanded true when open, and the panel-left icon. ⌘B on macOS and Ctrl+B elsewhere toggle it too, at 1024px and wider, and not while a text field has focus. No other shortcut (S14). The sheet keeps its 'Close navigation' button in the toggle's place",
  "Collapsed: icons only (64px rail), each row's name in .lib-rail-tip to the right, positioned from that row's rect when it's hovered or focused, and gone on leave or blur. The row keeps its accessible name. A project row keeps its dot and shows its label in the tooltip. The 240ms grid transition runs only on a toggle, never on load, and not under prefers-reduced-motion",
  "The Decisions badge on its nav row (.lib-nav-badge) and on its tab: the text from decisionsBadge, the label '{text} waiting' on the nav row, and on the tab the sr-only word 'waiting' after the number (S10). No badge for 0, no data or an error",
  "The tests check what this ticket draws, never the absence of what later tickets add or of routes later tickets add. Count only what this ticket owns. A test pinning their absence would need a test-dispute on each later ticket",
  "If a locked T-F1, T-F2, T-F5, T-F6 or T-F3 test conflicts with shell-layout.md here (for example one that requires no data-rail, or a badge-free row), stop with test-dispute (F2); don't work around it",
]

[ticket.tests]
role = "test-e2e"
paths = ["apps/web/test/shell-rail/**", "apps/web/e2e/shell-rail/**"]
behaviours = [
  "unit: decisionsBadge gives '{count}' and '{count}+' with the label '{text} waiting' for ready, and nothing for empty or error",
  "unit: AppShell in renderToString with collapsed = true has data-rail=\"collapsed\" and the toggle 'Expand sidebar' with aria-expanded=\"false\"; with collapsed = false, no data-rail and 'Collapse sidebar' with aria-expanded=\"true\"",
  "unit: AppShell draws a nav badge's text with its label, and a tab badge with the sr-only 'waiting'; no badge element when an item has none",
  "unit: kit.css, read as text: the collapsed rail at 64px under [data-rail=\"collapsed\"], the transition only under a toggling state and off under prefers-reduced-motion, and no :hover outside @media (hover: hover) and (pointer: fine)",
  "e2e: at 1280x800 with no cookie, the rail is open; the toggle collapses it, writes avel-rail=collapsed, and after a reload the server's HTML has data-rail=\"collapsed\" and the rail's and h1's boxes don't move at hydration",
  "e2e: at 1280x800, Control+B (and Meta+B) toggles the rail and its aria-expanded, but not while focus is in a text field; the key does nothing at 900x800",
  "e2e: collapsed at 1280x800, hovering and focusing the Decisions row shows a tooltip reading 'Decisions' beside it, and leaving or blurring hides it",
  "e2e: under AVEL_API=mock the Decisions row and tab show the world's count in the server's HTML, with the row's accessible text '{count} waiting'; on the dev server with no mock, the shell draws with no badge and the page shows its error state",
  "e2e: WCAG 2.2 AA with no violation at 1280 with the rail open and collapsed, and at 390 with the badge, in light and night, and no '$' in the page's text",
]
