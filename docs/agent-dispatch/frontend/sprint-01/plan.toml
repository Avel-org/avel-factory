# The plan for frontend sprint-01 (Step 1, item 13). Zero writes it; scripts/render.py turns it into
# the dispatch package. Every task doc and prompt comes from here: never edit the rendered files,
# fix this and re-render. Format: docs/agent-dispatch/avel/dispatch-kit.md
#
# 2026-11-06: written against CR-W2 (accepted, D37) and the UI contract
# docs/ui-contracts/decisions-approval-page.md (revision 4 answers Brennan's a3 findings and folds in Axis's S1-3). Brennan reviews the UI contract first; every
# other dispatch waits for that review to merge. Nothing dispatches until escalation 01 (the
# workspace lists apps/*, and who commits pnpm-lock.yaml) is resolved and backend m1 (packages/contract) is merged (decisions.md).
team = "frontend"
sprint = "sprint-01"
lead = "zero"
step = "1"
title = "The minimal approval page on the contract mock, with the thin W0 slice under it"
goals = [
  "apps/web: the TanStack Start app with the design library's tokens, the theme cookie shell and its dependencies (W0)",
  "The data core (oRPC client, Idempotency-Key and X-Request-Id, toUiError, query defaults) and the contract mock for routes 52 to 54 serving CR-W2's rows (W0)",
  "The kit pieces the page needs, ported from the design library: DecisionTag, ReasonDialog, ErrorPanel, WidgetState, Button, Tag, Icon, StatusGlyph, HashChip (W0)",
  "The decisions module at /: what's waiting, approve and reject with a reason bound to proposals.version, and every error and stale state (Step 1 item 13)",
]
# Step 1 item 13 and test 14 are the backend's; these are the frontend's half, from the UI contract's scenarios.
done_when = [
  "The web app builds, typechecks and lints, and its token stylesheet carries every token in the design library's token section with the same value (533 declarations).",
  "On the contract mock, a seeded open proposal shows on / as waiting, with its title, client name, age, evidence, consequence and 'Binds to Version N'; a factory PR shows read-only with its GitHub link; a proposal whose options don't parse shows Locked; an empty list shows 'Nothing needs you.' (UC-11, UC-12).",
  "Approving or rejecting asks for a reason first, then sends route 54 for that proposalId (in the path) exactly the body { version as shown, the row's choice, reason } with one Idempotency-Key, which a retry reuses; the row leaves the list after the 201 (UC-13, UC-14, UC-19, UC-21).",
  "A stale version opens the stale state with the current version and never re-sends; 'Review version N' shows the new version, which can then be decided (UC-15, UC-16, UC-30).",
  "422, 404, 429, 400, 401, 403, 409, network and 5xx, IDEMPOTENCY_KEY_REUSED and IDEMPOTENCY_IN_PROGRESS each show the state the UI contract gives, with the request ID; the list's loading, error, unreadable and paging states too (UC-17 to UC-27).",
  "A response whose X-Contract-Version differs from the version the web was built with shows the reload banner (UC-07, UC-28).",
  "The flow works end to end at 390px and 1280px on the mock, with SSR rows on first paint (UC-29 to UC-31).",
]
sources = [
  "docs/ui-contracts/decisions-approval-page.md",
  "docs/design/CR-W2 Pending decisions.md",
  "docs/agent-dispatch/frontend/sprint-01/decisions.md",
  "docs/design/AVEL Web App — Frontend Map v0.6.md",
  "docs/design/AVEL Enclosure Grid · Design library v1.1.html",
  "docs/design/Step 0 and Step 1 plan.md",
]

[commands]
build = 'pnpm --filter "@avel/web..." build'
typecheck = 'pnpm --filter "@avel/web..." --filter @avel/contract-mock typecheck'
lint = "pnpm lint"
test = "pnpm --filter @avel/web test"

[analysis]
stack = "A pnpm workspace in TypeScript (Biome, Vitest; tsconfig.base.json strict). The backend's packages/contract (@avel/contract: oRPC 1.x contract with Zod 4) is what the web imports; it lands with backend sprint-00 m1. The web is new: TanStack Start (React, Vite, file routes, selective SSR), TanStack Query through oRPC's TanStack Query utils, Tailwind v4 over the design library's tokens, lucide-react icons. Tests: Vitest with Testing Library and jsdom, Playwright end to end, all against packages/contract-mock (Frontend Map v0.6)."
layout = [
  "apps/web/src/routes: thin file routes (__root.tsx is the shell, index.tsx renders the decisions screen)",
  "apps/web/src/modules/decisions: api.ts, decisions.ts, screens/, index.ts, screens.ts",
  "apps/web/src/kit: Enclosure Grid components with data-ui names",
  "apps/web/src/data: the oRPC client, idempotency, toUiError, query defaults, CR-W2's row schema; apps/web/src/lib: time formatting; apps/web/src/router.tsx: getRouter",
  "apps/web/src/styles: tokens.css and the Tailwind theme",
  "apps/web/test (unit, component and screen tests, mirroring src) and apps/web/e2e (Playwright): Fenn's, locked before the builds",
  "packages/contract-mock (@avel/contract-mock): routes 52 to 54 through the contract, fixtures, test controls",
  "packages/contract (@avel/contract): the backend's, read-only here",
]
conventions = [
  "The UI contract (docs/ui-contracts/decisions-approval-page.md) is the spec: names, props, copy and states as it gives them",
  "Every colour, size, radius and duration is a --av-* token; never invent a value (design library v1.1)",
  "Screens never call fetch and never keep server data in state; query options come from the module's api.ts (Frontend Map v0.6, Layers)",
  "A module imports the kit, the data core and other modules only through their index.ts; index.ts exports names only, never screens (Frontend Map v0.6, What every module looks like)",
  "Display text, progress and state come from the server; the web never derives them (Frontend Map v0.6, line 134)",
  "Package names are @avel/web and @avel/contract-mock, after @avel/contract and @avel/db (backend D12)",
]
notes = [
  "The UI contract's scenario IDs (UC-01 to UC-31) name every test. A dispatch that meets something the contract leaves open stops and reports it under Deviations.",
  "packages/contract is the backend's: an API change you need is an escalation in docs/agent-dispatch/frontend/sprint-01/escalations/, written by Zero, never an edit.",
]

