# The plan for frontend sprint-02 (W1 continued: the app shell). Zero writes it; scripts/render.py turns it
# into the dispatch package. Never edit the rendered files: fix this and re-render.
#
# 2026-11-07: written against docs/ui-contracts/app-shell.md (revision 1) and the approval page contract's
# revision 15 (3b4a7c0). Brennan reviews both first; everything else waits for that review to be merged.
# Order (INT: lean, few rounds):
#   R0 Brennan's review
#   R1 Fenn's unit tests, Fenn's end-to-end tests and Nemi's fonts, side by side
#   R2 Fantem's kit, after Fenn's unit tests are locked
#   R3 Leon's shell (system and routes), then Ghost's decisions follow-up, merged after the shell
#   Zero reviews each build as it lands; Leah's check runs once everything is merged.
team = "frontend"
sprint = "sprint-02"
lead = "zero"
step = "1"
title = "The app shell: rail, sheet, tab bar, screen header and focus mode, with every L1 screen in the nav, and the approval page on it"
goals = [
  "Every screen sits in DL's shell: the rail at 1024px and over, the navigation sheet below, the phone tab bar at 760px and under, the screen header, and focus mode (app-shell.md sections 1 and 2)",
  "The nav is complete from day one: each entry in app-shell.md section 3 is a real route, with a stub screen until its wave, and Decisions carries the waiting badge in the server's HTML",
  "The approval page on the shell, with its revision 15: no layout switch at hydration (D16, layout=desk), the dialog through loadReasonDialog, ScreenHeader (app-shell.md section 4)",
  "The size-matched font fallbacks, by one method for both files (app-shell.md section 5)",
]
done_when = [
  "At 1280, 900 and 390 the shell draws as app-shell.md section 1 gives it, and the sheet, the tab bar, focus mode and the skip link behave as SH-03 to SH-05 and SH-20 to SH-23 check.",
  "The nav, tabs, badge, crumb, document title and stub screens are section 3's, on the contract mock (SH-08 to SH-11).",
  "Nothing in the shell or on / moves at hydration (SH-24, UC-32), and layout shift is under 0.02 by app-shell.md section 6's cases.",
  "UC-29 to UC-31 still pass on the shell, and /'s first load is at or under 150 kB gzip of JavaScript (app-shell.md section 6).",
  "Every locked test passes, and axe finds nothing on any route at 1280 and 390.",
]
sources = [
  "docs/ui-contracts/app-shell.md",
  "docs/ui-contracts/decisions-approval-page.md",
  "docs/agent-dispatch/frontend/sprint-02/decisions.md",
  "docs/design/AVEL Web App — Frontend Map v0.6.md",
  "docs/design/AVEL Enclosure Grid · Design library v1.1.html",
]

[commands]
build = 'pnpm --filter "@avel/web..." build'
typecheck = 'pnpm --filter "@avel/web..." --filter @avel/contract-mock typecheck'
lint = "pnpm lint"
test = "pnpm --filter @avel/web test"

[analysis]
stack = "A pnpm workspace in TypeScript (Biome, Vitest; tsconfig.base.json strict). apps/web is TanStack Start (React 19 with the React Compiler, Vite, file routes, selective SSR), TanStack Query through oRPC's TanStack Query utils over @avel/contract (zod/mini), Tailwind v4 over the design library's tokens, lucide-react icons one by one. Tests: Vitest with Testing Library and jsdom, Playwright end to end, all against packages/contract-mock (Frontend Map v0.6)."
layout = [
  "apps/web/src/routes: __root.tsx (Nemi's: theme cookie, font preloads, app.css); index.tsx renders the decisions screen, and moves under the new _shell layout this sprint",
  "apps/web/src/modules/decisions: the approval page (api.ts, decisions.ts, screens/, index.ts, screens.ts, decisions.css); apps/web/src/modules/system: new this sprint, the shell's navigation and the stub screens",
  "apps/web/src/kit: Enclosure Grid components with data-ui names, and kit.css",
  "apps/web/src/data and apps/web/src/lib: the data core (Ghost's); apps/web/src/styles: tokens, fonts and app.css (Nemi's)",
  "apps/web/test and apps/web/e2e: Fenn's, locked before the builds (docs/agent-dispatch/frontend/sprint-01/locks.md holds sprint-01's locks)",
  "packages/contract-mock: the contract mock (Ghost's); packages/contract: the backend's, read-only here",
]
conventions = [
  "The UI contracts are the spec: docs/ui-contracts/app-shell.md for the shell, and docs/ui-contracts/decisions-approval-page.md (revision 15) for the page. Names, props, copy and states as they give them; a † string is the contract's own",
  "Every colour, size, radius and duration is a --av-* token or the design library's own literal for that element, with its source in a comment; never invent a value",
  "Nothing in the shell reads the viewport in JavaScript: every width is a CSS media query on the server's HTML (app-shell.md section 1)",
  "Screens never call fetch and never keep server data in state; a module imports the kit, the data core and other modules only through their index.ts (Frontend Map v0.6)",
  "A file under a lock in locks.md changes only in a commit made with AVEL_LOCK_OVERRIDE set, and only when the task doc says so",
]
notes = [
  "The contracts' scenario IDs (SH-01 to SH-14 and SH-20 to SH-25 here, UC-01 to UC-32 in the approval page contract) name every test. A dispatch that meets something the contract leaves open stops and reports it under Deviations.",
  "packages/contract is the backend's: an API change you need is an escalation in docs/agent-dispatch/frontend/sprint-02/escalations/, written by Zero, never an edit.",
  "/'s first load is 149.30 kB gzip on main before the shell: the target is 150 kB and the hard ceiling 160 kB (app-shell.md section 6). Every build whose diff changes JavaScript that / loads reports /'s first load from its own build, counted as the approval page contract's section 8 counts it.",
]

