# The plan for frontend sprint-02 (W1 continued: the shell layout). Zero writes it; scripts/render.py turns it
# into the dispatch package. Never edit the rendered files: fix this and re-render.
#
# 2026-11-08, reworked for Int's v1.9 brief and procedures.md (d28e78c): docs/ui-contracts/shell-layout.md and
# kit-v1.9.md replace app-shell.md. One spec review, then small rounds, at most 3 dispatches at once
# (dispatch.sh's 3 slots; reviews count). Merge order follows `after`:
#   R0 Brennan reviews both contracts
#   R1 Fenn unit, Fenn e2e, Ghost's mock (routes 19 and 8)
#   R2 Fantem's kit and Nemi's styles; Zero reviews the kit
#   R3 Leon's missions and Ghost's clients (screens only: system writes their routes); Zero reviews each
#   R4 Leon's system (the shell, routes, nav, Settings) and Ghost's decisions follow-up (merged after system);
#      Zero reviews each
#   R5 Leah on main
# The other ten pages (shell-layout.md section 4, marked 03) are sprint-03.
team = "frontend"
sprint = "sprint-02"
lead = "zero"
step = "1"
title = "The shell layout from the design library v1.9: rounded canvas, sidebar with groups, projects and collapse, header, tab bar; All projects, Progress, Clients and Settings; the approval page and kit on v1.9"
goals = [
  "Every screen sits in v1.9's shell: the rounded canvas and 264px sidebar at 1024px and wider (64px collapsed, remembered), the sheet below, the phone tab bar at 760px and narrower, focus mode (shell-layout.md sections 1 to 3)",
  "The nav is built from the routes that exist, in the brief's groups, with the projects from route 19 and their waiting counts from route 52 (section 4)",
  "All projects, Progress, Clients and Settings are real pages: ScreenHeader, content, and an empty state where there can be nothing to show (section 5)",
  "The kit, the approval page and the styles follow v1.9 (kit-v1.9.md)",
]
done_when = [
  "SH-01 to SH-14 pass (unit, no SH-08), and SH-20 to SH-25 pass on the phone, 900 and desk projects.",
  "UC-29 to UC-32 pass on the shell, and the locked tests pass.",
  "Nothing moves at hydration (SH-24), and layout shift is under 0.02 by shell-layout.md section 8.",
  "/ passes procedures rule 7's size check, and axe finds nothing on any built route at 1280 and 390.",
]
sources = [
  "docs/ui-contracts/shell-layout.md",
  "docs/ui-contracts/kit-v1.9.md",
  "docs/ui-contracts/decisions-approval-page.md",
  "docs/design/AVEL Shell Layout brief v1.9.md",
  "docs/design/AVEL Enclosure Grid · Design library v1.9.html",
  "docs/design/AVEL Web App — Frontend Map v0.6.md",
  "docs/agent-dispatch/avel/procedures.md",
  "docs/agent-dispatch/frontend/sprint-02/decisions.md",
]

[commands]
build = 'pnpm --filter "@avel/web..." build'
typecheck = 'pnpm --filter "@avel/web..." --filter @avel/contract-mock typecheck'
lint = "pnpm lint"
test = "pnpm --filter @avel/web test"

[analysis]
stack = "A pnpm workspace in TypeScript (Biome, Vitest; tsconfig.base.json strict). apps/web is TanStack Start (React 19 with the React Compiler, Vite, file routes, selective SSR), TanStack Query through oRPC's TanStack Query utils over @avel/contract (zod/mini), Tailwind v4 over the design library's tokens, lucide-react icons one by one. Tests: Vitest with Testing Library and jsdom, Playwright end to end, all against packages/contract-mock (Frontend Map v0.6)."
layout = [
  "apps/web/src/routes: __root.tsx (theme cookie, font preloads, app.css) and index.tsx (the decisions screen), which moves under the new _shell layout this sprint",
  "apps/web/src/modules/decisions: the approval page; new this sprint: modules/system (the shell's nav model and Settings), modules/missions (route 19, All projects, Progress), modules/clients (route 8, Clients)",
  "apps/web/src/kit: Enclosure Grid components with data-ui names, and kit.css",
  "apps/web/src/data and apps/web/src/lib: the data core (Ghost's); apps/web/src/styles: tokens, fonts and app.css (Nemi's)",
  "apps/web/test and apps/web/e2e: Fenn's (docs/agent-dispatch/frontend/sprint-01/locks.md holds the locks)",
  "packages/contract-mock: the contract mock (Ghost's); packages/contract: the backend's, read-only here",
]
conventions = [
  "The UI contracts are the spec: shell-layout.md and kit-v1.9.md, over the approval page contract. Names, props, copy and states as they give them; a † string is the contract's own",
  "Every value is the design library v1.9's final cascade for that element, or a --av-*/shell token, with the DL class in a comment; never invent a value. DL v1.9 wins over anything earlier",
  "Nothing reads the viewport in JavaScript, and nothing in the shell moves at hydration: widths are media queries, preferences are cookies the server reads",
  "Screens never call fetch and never keep server data in state; a module imports the kit, the data core and other modules only through their index.ts (Frontend Map v0.6)",
  "A file under a lock in locks.md changes only in a commit made with AVEL_LOCK_OVERRIDE set, and only when the task doc says so",
]
notes = [
  "Scenario IDs SH-01 to SH-14 and SH-20 to SH-25, with no SH-08 (shell-layout.md section 9, kit-v1.9.md section 4) and UC-01 to UC-32 (the approval page contract) name every test. A dispatch that meets something the contracts leave open stops and reports it under Deviations.",
  "packages/contract is the backend's. The API gaps are escalations 01 to 03 in docs/agent-dispatch/frontend/sprint-02/escalations/, with the stand-ins the contract gives; never edit the contract.",
  "Procedures rule 1: main stays green. Fail-first tests land as test.fails until their build merges. Rule 7: / must pass the 150 KB size check. Every build that changes /'s JavaScript reports its figure.",
]

