  { path = "docs/design/Backend modules and build plan.md", why = "section 8: auth decisions, the order inside Step 1, Breach's attacks; module table: platform owns Better Auth's tables, cli_sessions, step_up_grants, idempotency_keys; audit owns activity_log" },
  { path = "docs/design/API routes.md", why = "routes 1 to 5 and the rules on every write" },
  { path = "docs/design/Build rules.md", why = "C4 (full rigor), E5 (dependencies), E6 (no secrets), E10 (real Postgres), E12 (table owners), E13 (four tests per route), F2, H6" },
