# backend/sprint-03: the sprint's plan. Axis writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Rigg's tests, Soap's build, Rigg's review.
# Check it:   scripts/render.py --check backend/sprint-03
# Render it:  scripts/render.py backend/sprint-03   (after approval), then commit the folder.
#
# Four tickets, each a full session, in Javaris's approved build order (Nov 17), one builder at a time (B7):
#   T-B11 the web's auth mock and a minified router (CR-W30 A and D; contract)                            ~60 min  standard, contract
#   T-B8  platform hardening and the middleware services (backlog a, b, c, d; Step 1 items 2 and 4)   ~75 min  full
#   T-B9  sign-in: Better Auth, the seed, lockout, and the caller (Step 1 item 5, test 7)                 ~90 min  full, new dependency
#   T-B10 step-up and CLI login: routes 1 to 3 (items 6 and 7; tests 5, 8, 9)                             ~90 min  full
# T-B12 (routes 4 and 5, the CLI session as a caller; tests 2 and 4, the rest of 9) opens sprint-04: render.py refuses
# two tickets in one sprint that share a file, and it would share T-B10's cli/**, audit/** and router.ts.
# Bigger tickets, per Javaris (Nov 17, via OSA): "lets stop merging and commiting small amounts".
#
# Approved by Javaris, Nov 17 ("approve all", via OSA): the plan, items 1 to 4 below, CR-W30, and session limits of
# 120 minutes and 150 turns (#45). T-B11 runs first: CR-W30's A and D don't need the real server.
# As proposed:
# 1. Session limit: T-B9 and T-B10 likely run past scripts/agents/limits.json (60 min, 80 turns).
#    Axis asks for 90 min and 120 turns for this sprint's build sessions. If you say no, each of the two
#    splits in half (B9: auth and lockout / seed and caller; B10: step-up / CLI login).
# 2. Step order (E9): AGENTS.md's Step 1 order puts tests 10 and 11 and spike 2 (DBOS) before auth.
#    Your approved order puts auth, step-up and CLI login first, as Backend modules section 8 ("outside in") did.
#    Approving this plan also approves that change. The one-line AGENTS.md edit is in this plan's PR.
# 3. New dependency (E5): better-auth, MIT licence, in T-B9 only (the lockfile changes only there).
#    AGENTS.md fixes Better Auth as the stack, and nothing in the workspace does email and password sessions.
#    Soap pins an exact version at least two weeks old and reports its installed size.
# 4. One open design point, for T-B10: routes 1 and 3 are called by the CLI before it has a session, but
#    idempotency_keys.principal is a user or credential id (DATABASE.md). Axis proposes the device login's id as
#    the principal for both. Route 3 already answers any replay with 409 TOKEN_REPLAYED and stores nothing.
#    Say yes, or ask for a CR.
# Change after approval (Axis, Nov 18): t-b3-rigg-03 (a defect's body.message is the contract's text) moves from
# T-B8 to T-B9. The fix is in effect-handler.ts, T-B9's file, and T-B8 may not change it. T-B8's own text is left
# as rendered so its task docs don't change mid-ticket; its tests a2 drops that one assertion by Axis's ruling.
# Change after approval (Axis, Nov 18, t-b11-rigg-01): T-B11's Territory gains packages/contract/package.json for one
# ./minified subpath export (4 lines, Axis's A4). The contract's index loads zod and its locale (D58), so the web
# can't take the minified router from it. The lock check holds post-lock commits to the Territory, A4 included.
# T-B8's reading list drops sprint-02/findings/t-b3-rigg-01.md: findings stay in .git/avel/reports, not the repo.
# T-B10's notes say route 3 enforces its 5-second poll interval itself, in platform/cli/** (t-b8-rigg-03).
# T-B9 and T-B10 get one review and no round 2 (Javaris, Nov 18; Build rules G5). T-B9's client IP is the peer address (T-B8 G7 P2).
# Backlog, not in this sprint: T-B12 (sprint-04, first), CR-W30 B and C (after T-B10's step-up), the T-B5 relock P3 and t-b7-rigg-01 (lock-check tests), the contract-test timeout
# (needs a CR and Zero), the declined db flake (CR-40). After T-B11: tests 10 and 11, spike 2 (DBOS), the jobs engine,
# event consumers and the factory repo loader, which closes Step 1.

