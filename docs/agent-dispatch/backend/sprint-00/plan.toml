# The plan for backend sprint-00 (Step 0). The lead writes it; scripts/render.py turns it into
# the dispatch package. Every task doc and prompt comes from here: never edit
# the rendered files, fix this and re-render. Format: docs/agent-dispatch/avel/dispatch-kit.md
#
# 2026-11-06: B1-B9 answered (decisions.md). Waits on Brennan's review of contract.md;
# nothing is dispatched before the slice locks. Sources follow CR-19's order (D3).
team = "backend"
sprint = "sprint-00"
lead = "axis"
step = "0"
title = "The contract written fresh, and the schema rebuilt from the database map"
goals = [
  "A pnpm workspace with TypeScript, Biome, Vitest, scripts/pg-local.sh and CI with a Postgres service",
  "packages/contract: every value list defined once, the DTOs and inputs, the 102 oRPC route definitions, the error map, the event-kind to owning-module map and the completion report schema, with no rep fields",
  "packages/db: the Drizzle schema rebuilt from AVEL Database Map.html (every table, column, default, foreign key, CHECK, index and trigger by name, the six functions rewritten), the accepted CRs applied on top, value lists imported from the contract, and a first migration",
  "The ERD and the OpenAPI document generated, DATABASE.md brought up to the schema, and the drift check in CI",
]
# Step 0 and Step 1 plan, Step 0, "Done when", word for word.
done_when = [
  "The first migration applies to an empty database and reverses cleanly.",
  "A `db` suite against real Postgres covers every CHECK, unique and partial-unique index, exactly-one-parent rule and delete refusal in DATABASE.md, one test per rule (the count is filled in when Rigg writes them).",
  "The CR-13 rules: a second internal client is refused; a client mission on the internal client is refused, and an internal mission on a client is refused; changing a mission's kind after onboarding starts is refused.",
  "The ERD drift check passes: the schema and DATABASE.md agree.",
  "The contract builds and the OpenAPI document generates; the review script passes.",
  "Every value list the schema checks is imported from the contract package, not repeated (a test looks for repeats).",
  "A new event kind with no owning module fails to compile.",
  "**The schema matches the map:** a test reads the map's table, column, foreign-key, CHECK and index lists and compares them with the schema. Anything that differs has to be listed against the CR that changed it.",
  "**Each of the six functions has a test** for the rule it enforces. For example: an update to an immutable table is refused; a frozen plan's detail can't be inserted, updated or deleted; a freeze-once column can't change once set; `updated_at` and `row_version` move on every update; v7 ids sort by time.",
]
sources = [
  "docs/agent-dispatch/backend/sprint-00/contract.md",
  "docs/agent-dispatch/backend/sprint-00/decisions.md",
  "docs/design/Step 0 and Step 1 plan.md",
  "docs/design/AVEL Database Map.html",
  "docs/design/Schema vs DATABASE.md.md",
  "docs/design/Change requests CR-1 to 13.md",
  "docs/design/CR-16 Dispatch package contract.md",
  "docs/design/API routes.md",
  "docs/design/DATABASE.md",
  "docs/design/API and data reference.md",
  "docs/design/Canon onboarding v0.5.md",
  "docs/design/Backend modules and build plan.md",
]

[commands]
build = "pnpm build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm test"

[analysis]
stack = "A new TypeScript monorepo on pnpm workspaces. Biome for lint and format, Vitest for tests, Drizzle ORM and drizzle-kit on Postgres, and oRPC contract definitions with Zod schemas (Frontend Map v0.6, CR-W1). Nothing is built yet: Step 0 is the first code in avel-factory. The old schema is lost; its record is docs/design/AVEL Database Map.html, and Step 0 rebuilds packages/db from it (CR-19)."
layout = [
  "packages/contract: value lists, DTOs and inputs, oRPC routes, the error map, the event-owner map, the completion report schema (src/), and its tests (test/)",
  "packages/db: the Drizzle schema, the table-owner map, drizzle-kit migrations, and the db suite against real Postgres (test/)",
  "tools/docs: the ERD and OpenAPI generators and the DATABASE.md drift check; output in docs/generated/",
  "scripts/pg-local.sh: a local Postgres for tests",
  "docs/design: the design docs this step is written from (read-only)",
]
conventions = [
  "Value lists are text with a CHECK, never Postgres enums, defined once in packages/contract and imported by packages/db (DATABASE.md, Types)",
  "Every foreign key is ON DELETE RESTRICT except Better Auth's own tables, which cascade from users (DATABASE.md, Foreign-key policy)",
  "Primary keys are UUIDv7, money is bigint *_micros, and times are timestamptz *_at (DATABASE.md, Types)",
  "Table, column, CHECK, index and trigger names are the map's, word for word, as contract.md section 6 changes them; never invent a column",
  "Every mutable table has row_version and updated_at (touch_updated_at); immutable tables refuse updates (refuse_update) (Schema vs DATABASE.md.md, Patterns)",
  "Package names are @avel/contract and @avel/db (decisions.md, D12)",
]
notes = [
  "contract.md is the step contract. Its section 7 lists what's still open; a dispatch that meets an open item stops and reports it under Deviations.",
]

