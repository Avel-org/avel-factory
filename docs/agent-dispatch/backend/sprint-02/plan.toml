[[ticket]]
id = "T-B5"
slug = "lock-check-merges"
title = "Lock check: merge commits are checked, the build doc is found by the PR's branch, and an F2 relock line is honoured"
goal = "A builder can't change a locked test or a file outside the ticket inside a merge commit, and a PR is always checked against its own ticket's build doc."
rigor = "standard"
refs = ["Build rules H6 and F2", "T-B0 review findings t-b0-rigg-02 (P2) and t-b0-rigg-03 (P3)", "Javaris, Nov 17: F2 relock in the lock check (option a)"]
may_change = ["tools/repo-checks/src/**"]
must_not_change = [
  "tools/repo-checks/package.json",
  ".github/workflows/locks.yml",
  "scripts/render.py",
]
context = [
  { path = "tools/repo-checks/src/check-locks.ts", why = "the check as T-B0 built it: rev-list --no-merges, and findBuildDoc's first match" },
  { path = "tools/repo-checks/test/helpers.ts", why = "the locked interface (T-B0) the check keeps to, and the scratch-repo helpers" },
  { path = "docs/agent-dispatch/backend/sprint-01/findings/t-b0-rigg-02.md", why = "P2: an 'evil merge' hides a change; the suggested fixes" },
  { path = "docs/agent-dispatch/backend/sprint-01/findings/t-b0-rigg-03.md", why = "P3: the first match across sprints; match by the doc's branch front matter" },
  { path = "scripts/render.py", why = "the build doc's front matter (branch:) and report paths; read only" },
]
verify = [
  "pnpm --filter @avel/repo-checks test",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "P2: a merge commit's own changes must be held to the same rules as any builder commit: compare each merge against its first parent (or the whole range's tree), so a locked test or an out-of-Territory file changed only in a merge result fails and is named. A plain merge of main that brings in main's own changes must still pass",
  "P3: find the build doc whose front matter branch: equals GITHUB_HEAD_REF, not the first file with the ticket's name. Ticket IDs are never reused across sprints today, so this is hardening, not a live bug",
  "F2 relock (Javaris, Nov 17): after a test-dispute changes a locked test, the lead adds a second line for the ticket, `- T-B1: <path>, <path> @ <newsha> (F2 relock)`. The check honours it only if: it was added in a commit that changes nothing but the sprint's locks.md; it lists the same paths as the earlier line, or more; and its sha descends from the earlier line's sha. Then the locked paths are frozen from the new sha on (the checker's fix between the two shas is allowed), while the Territory still applies to every commit after the first lock sha. Any other later line for the ticket still fails the check and names locks.md, as T-B0's add-only rule says. The kit's render.py already accepts the line's format (lead kit PR, Nov 17)",
  "CI can't tell who added a relock line: the reviewer checks that the PR's relock follows a test-dispute the lead decided (F2)",
  "The T-B0 interface in helpers.ts stays: same script, environment and messages",
]

[ticket.tests]
role = "test-unit"
paths = ["tools/repo-checks/test/locks-merges.test.ts"]
behaviours = [
  "a merge commit whose result changes a locked test that neither parent changed fails, and names the file",
  "a merge commit whose result changes a file outside the Territory that neither parent changed fails, and names the file",
  "a merge of main into the ticket branch that only brings in main's own commits passes",
  "the build doc is the one whose branch: front matter matches GITHUB_HEAD_REF, even when another sprint's folder has a doc with the same file name",
  "F2 relock: a checker's commit changing a locked test, then a locks.md-only commit adding '(F2 relock)' at the new tip with the same paths, then a builder commit inside the Territory, passes",
  "F2 relock: a builder commit that changes a locked test after the relock still fails and names the file, and one outside the Territory before the relock still fails",
  "F2 relock: a relock line with fewer paths, one whose sha isn't a descendant of the first lock, or one added in a commit that also changes another file fails and names locks.md",
]

