# backend/sprint-02: the sprint's plan. Axis writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Rigg's tests, Soap's build, Rigg's review.
# Check it:   scripts/render.py --check backend/sprint-02
# Render it:  scripts/render.py backend/sprint-02   (after approval), then commit the folder.
#
# Six tickets, about 5 hours of building, one builder at a time (B7):
#   T-B2 dependencies and @effect/tsgo (CR-39)            ~45 min  standard
#   T-B3 database errors to contract codes (Step 1 item 3)  ~50 min  full (platform/db)
#   T-B4 the Db service, spike 1 check 2 (Step 1 test 6)    ~70 min  full (events and seq, C4)
#   T-B5 lock-check hardening (T-B0 P2, P3; F2 relock)      ~60 min  standard
#   T-B6 the contract's defect code (CR-38)                 ~20 min  standard, contract
#   T-B7 lock check: the tests report after the lock        ~45 min  standard, after T-B5
# T-B6: CR-38 accepted Nov 17, and Zero signed off (I3).
# Spike 1 check 5 (the reaper under TestClock) moved to the jobs and events tests before spike 2 (Javaris, Nov 17).
# If the cycle has to be shorter, T-B5 is the one to move.
# T-B7: added Nov 17 from Zero's input on PR #30 (T-F7 red on H6 after a legitimate F2 cycle); Javaris approved it.

lane = "backend"
sprint = "sprint-02"
step = 1
title = "Step 1, cycle 2: Effect's language service, the Db service with spike 1 check 2, database errors, a harder lock check"
goals = [
  "Effect's language service runs in the editor and in CI on TypeScript 7, so Writing Effect rule 9 holds",
  "A unique, CHECK or foreign-key violation from Postgres comes back as the contract's 409 or 422 with the constraint's name, never as a 500",
  "A state change and its events commit together or not at all, and seq follows commit order (spike 1 check 2)",
  "A builder can't slip a change past the lock check inside a merge commit",
]
done_when = [
  "AGENTS.md, Writing Effect rule 9: Effect's language service runs in the editor and CI",
  "Step 0 and Step 1 plan, Step 1 test 6: fed real Postgres errors through the Db service, a unique violation is 409, a CHECK violation is 422 and a stale rowVersion update is 409",
  "CR-30 section 6, spike 1 check 2: a rolled-back program leaves no event, and Events.append outside a transaction doesn't compile",
  "Build rules H6: the lock check can't be skipped by a merge commit",
]
sources = [
  { path = "docs/design/Step 0 and Step 1 plan.md", why = "Step 1 items 3 (database errors) and 10 (events and seq), and test 6" },
  { path = "docs/design/CR-30 Effect in the server, durable jobs and spans.md", why = "section 2 (the Db service: withTransaction, Tx, Events.append, commitWithEvents) and section 6 (spike 1 check 2)" },
  { path = "docs/design/CR-39 Effect's language service on TypeScript 7.md", why = "the accepted change: @effect/tsgo 0.64.1 replaces @effect/language-service, run in the editor and CI" },
  { path = "docs/design/Build rules.md", why = "C4 (full rigor), E5 (one lockfile change per cycle), E9 (spike 2 before the jobs engine), E10 (real Postgres), F2 (locked tests), H6 (the lock check)" },
]

[commands]
build = "pnpm build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm test"

[analysis]
stack = "Node 22.12+, pnpm 10 workspace, TypeScript 7.0.2, Biome, Vitest 5; Hono 4.13.16, oRPC 1.16.2, Zod 4, Effect 4.1.1 inside packages/server; Drizzle 0.45.4 and node-postgres 8.23.1 in packages/db; Postgres 17"
layout = "packages/contract, packages/contract-mock, packages/db (schema and migrations), packages/server (src/platform: app, effect-handler, errors, ids, logger, request-id, from T-B1), tools/repo-checks (the lock check, T-B0), tools/docs, apps/web"
conventions = [
  "AGENTS.md is the rulebook: API rules (errors, writes) and Writing Effect rules 1 to 10",
  "packages/server/src/platform/errors.ts holds the one table from a tagged error to a contract code; a tag with no row doesn't compile through effectHandler (T-B1)",
  "Real Postgres in tests (E10): scripts/pg-local.sh locally, the postgres service in CI; DATABASE_URL points at it. Each test file makes its own database and migrates it with pnpm --filter @avel/db migrate:up, as packages/db/test/helpers/db.ts does",
  "Exact versions only in package.json (no ^ or ~)",
]
notes = [
  "This sprint starts after sprint-01's T-B0 and T-B1 merged (both on main, Nov 17)",
  "Lock each ticket at the head of its tests dispatch (after the checker's report commit), and run check-locks on the branch before the build starts (T-B0 review, t-b0-rigg-01)",
  "Spike 1 check 5 (the reaper under TestClock) is not in this cycle: Javaris chose option A on Nov 17. A reaper is part of the jobs engine (C4), and E9 puts spike 2 (DBOS) before it, so check 5 joins the jobs and events tests written right before spike 2 and is proved once over whichever engine wins",
  "Backlog, not this cycle: T-B1 review P3s (effectHandler's Promise<any> loses the compile-time DTO check; no lint rule for Writing Effect rule 2; an abort may log a false defect; an OpenAPIHandler per request; any UUID version accepted)",
]

