  { path = "packages/contract/src/errors.ts", why = "the codes to map to: ALREADY_EXISTS (409), DELETE_REFUSED (409), CONSTRAINT_VIOLATION (422), STALE_VERSION (409), each with its details schema" },
  { path = "packages/server/src/platform/errors.ts", why = "the one table from a tagged error to a code (T-B1); new tags get rows here" },
  { path = "packages/server/src/platform/effect-handler.ts", why = "how a tagged failure becomes the ORPCError with its details; read only" },
  { path = "packages/db/src/schema/platform.ts", why = "real constraints to test against: users_email_uq, the CHECKs, the foreign keys, row_version columns" },
  { path = "packages/db/test/helpers/db.ts", why = "how a test makes and migrates its own database" },
]
verify = [
  "pnpm --filter @avel/server test",
  "pnpm --filter @avel/server typecheck",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "errors.ts in platform/db exports one function that turns a thrown node-postgres error into a tagged error: 23505 unique to AlreadyExists, 23514 CHECK to ConstraintViolation, 23503 foreign key to DeleteRefused when a referenced row's delete or update is refused and to ConstraintViolation when the parent is missing. Each carries details { constraint } with the constraint's name from the error. Any other database error stays a defect (Writing Effect rule 3)",
  "Stale rowVersion is not a Postgres error: a versioned update matches no row. errors.ts also exports a helper that turns 'no row updated' into StaleVersion, with STALE_VERSION's details for field rowVersion and the current version",
  "Add each new tag's row to errorTable in platform/errors.ts. Nothing calls the function yet: T-B4 wires it into the Db service",
  "Full rigor: platform/db is a CODEOWNERS path, so Javaris merges it (G7), and the second review follows the security checklist",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/db/**"]
behaviours = [
  "harness: each test file gets its own migrated database (support file in test/db, reused by T-B4's tests)",
  "a real unique violation (a second user with the same email) becomes AlreadyExists, and through effectHandler a 409 ALREADY_EXISTS whose details name users_email_uq",
  "a real CHECK violation becomes ConstraintViolation, and a 422 CONSTRAINT_VIOLATION naming the CHECK",
  "a real foreign-key refusal on delete becomes DeleteRefused, a 409 DELETE_REFUSED; a real missing parent on insert becomes ConstraintViolation, a 422",
  "a versioned update that matches no row becomes StaleVersion, a 409 STALE_VERSION with field rowVersion",
  "any other database error (for example a syntax error) stays a defect: 500, never shown",
]

