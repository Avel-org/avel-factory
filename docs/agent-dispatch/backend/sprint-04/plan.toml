  "Writes (routes 9 and 11) go through T-B8's Idempotency store with the Caller's user id as the principal. Route 11 checks rowVersion: stale is 409. Database violations come back through the Db service's mapping (409 or 422); never a duplicated CHECK as the only guard",
  "The internal client (CR-13) can't be created through route 9: the seed makes it. Route 8 lists it only with ?kind=internal",
  "Activity log (item 8): an audit module (src/audit/) with one call that records who, what, on which target and why, in the same transaction as the change. Each write leaves exactly one row, and a failed write leaves none",
  "Routing: platform/router.ts composes the health router and routes 8 to 11; main.ts passes it to createApp. app.ts doesn't change",
  "E13: each route gets its happy path with the DTO checked, the error body with requestId, the idempotent replay for writes, and the stale rowVersion for route 11",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/clients/**"]
behaviours = [
  "route 9 creates a client whose output has exactly ClientDto's fields and no internal column, checked against the contract (test 2)",
  "route 9 replays: the same key and body return the first response and make one client; another body is 409 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first runs is 409 IDEMPOTENCY_IN_PROGRESS (test 4)",
  "routes 10 and 11: an unknown client is 404 with the contract's body and the request's requestId (test 3)",
  "route 11 edits a client; a stale rowVersion is 409; a value the database's CHECK refuses is 422 (test 6)",
  "route 8 pages clients and leaves out the internal client unless ?kind=internal; route 9 can't create an internal client",
  "every route without a session is 401 with the contract's body",
  "each write (routes 9 and 11) leaves exactly one activity_log row naming the operator, the action and the client, and a refused write leaves none (test 13)",
]

# ---------------------------------------------------------------------------------------------
[[ticket]]
id = "T-B15"
slug = "factory-repo-webhook"
title = "The factory repo loader and the GitHub webhook: factory.yaml by commit, merges as factory versions, alerts on a merge the App didn't make"
goal = "A factory-repo PR merged by the factory's GitHub App shows up as a selectable factory version, a merge by anyone else raises an alert and can't be pinned, and the service reads factory.yaml at any merged commit the App made."
rigor = "full"
refs = [
  "Step 0 and Step 1 plan, Step 1 items 1 (the webhook) and 11 (the factory repo), test 12; the rate limits section (webhook, 60 a minute)",
  "Design v0.6 Main, Factory as code",
  "AGENTS.md, Architecture rules (the webhook: raw-body signature, deduplicated on X-GitHub-Delivery)",
  "Build rules E8 (factory.yaml is parsed by the first step that reads a section of it)",
]
depends_on = ["T-B9"]
may_change = [
  "packages/server/src/platform/webhooks/**",
  "packages/server/src/platform/factory-repo/**",
  "packages/server/src/knowledge/**",
  "packages/server/src/platform/app.ts",
]
must_not_change = [
  "packages/server/package.json",
  "pnpm-lock.yaml",
  "packages/server/src/platform/effect-handler.ts",
  "packages/server/src/platform/db/**",
  "packages/server/src/platform/rate-limit.ts",
  "packages/server/src/platform/auth/**",
  "packages/server/src/main.ts",
  "packages/db/**",
  "packages/contract/**",
]
context = [
  { path = "docs/design/Design v0.6 Main.md", why = "Factory as code: what factory.yaml holds, merges only by the factory's GitHub App, the webhook checks who merged, a merge by anyone else raises an alert and freezes finalize, every merged commit listed in factory_versions" },
  { path = "packages/db/src/schema/knowledge.ts", why = "factory_versions: sha, merged_at, approved_by, merged_by_app, summary, pr_number" },
  { path = "packages/db/src/schema/platform.ts", why = "webhook_deliveries: one row per X-GitHub-Delivery" },
  { path = "packages/contract/src/events.ts", why = "system.alert.raised, written by platform" },
  { path = "packages/server/src/platform/app.ts", why = "where POST /api/webhooks/github mounts, outside the contract, keeping X-Request-Id and X-Contract-Version" },
  { path = "packages/server/src/platform/rate-limit.ts", why = "T-B8's limiter: the webhook name, 60 a minute; read only" },
]
verify = [
  "pnpm --filter @avel/server test",
  "pnpm --filter @avel/server typecheck",
  "pnpm --filter @avel/server check:effect",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "The webhook (item 1): POST /api/webhooks/github, outside the contract, in app.ts. It checks X-Hub-Signature-256 over the raw body with a constant-time compare against GITHUB_WEBHOOK_SECRET from Config (Redacted; never logged). A bad or missing signature is 401 and writes nothing. It's rate-limited at 60 a minute through T-B8's webhook limit, and deduplicated on X-GitHub-Delivery through webhook_deliveries, in the same transaction as what the delivery does",
  "A merged pull request on the factory repo's main (the repo and the factory App's identity from Config) adds one factory_versions row, with merged_by_app true only when the App made the merge. A merge by anyone else is stored with merged_by_app false and raises system.alert.raised in the same transaction. Other events and other repos are acknowledged and ignored. approved_by is the operator's user id (one operator)",
  "The loader (item 11), a platform utility with no table, in platform/factory-repo/: reads factory.yaml at a given SHA from a local mirror of the factory repo (its path from Config), fetching the mirror with a timeout when the SHA is missing (Writing Effect rule 5). It answers only for a SHA that has a factory_versions row with merged_by_app true; any other SHA is refused. Git runs as a child process with a timeout; no git library",
  "factory.yaml isn't parsed here: the loader returns the file's text at a merged SHA. Its shape isn't written down yet, and each section is parsed by the step that first reads it (Step 6 packages, Step 8 budgets; B9, E8). No new dependency. If something in Step 1 needs a section read, stop with needs-cr",
  "Tests use a local bare repo and recorded webhook payloads, signed in the test with a throwaway secret. No test calls GitHub (Step 1 plan, risks; E10)",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/factory-repo/**"]
behaviours = [
  "a delivery with a bad or missing X-Hub-Signature-256 is 401 and writes nothing",
  "a signed merge of a factory-repo PR by the factory App adds one factory_versions row with merged_by_app true, and the loader reads factory.yaml at that SHA (test 12)",
  "a merge by anyone else adds a row with merged_by_app false and one system.alert.raised event in the same transaction, and the loader refuses that SHA (test 12)",
  "a commit on an unmerged branch has no effect: no factory_versions row, and the loader refuses its SHA (test 12)",
  "a replayed X-GitHub-Delivery is acknowledged and ignored: no second row and no second event (test 12)",
  "the 61st delivery in a minute is 429 with the contract's body and a requestId",
  "a merged SHA with no factory.yaml at the repo root is refused with a typed error naming the SHA",
  "a mirror missing the SHA is fetched once, and a fetch that hangs ends within its timeout (TestClock) as a typed error",
]
