  { path = "docs/design/API routes.md", why = "routes 8 to 11 (the internal client only with ?kind=internal) and the rules on every write" },
  { path = "packages/db/src/schema", why = "clients (kind, the one internal client, CR-13) and activity_log" },
  { path = "docs/design/DATABASE.md", why = "clients and activity_log: who, what, on which target and why" },
  { path = "packages/server/src/platform/idempotency.ts", why = "T-B8's store: every write takes an Idempotency-Key; read only" },
