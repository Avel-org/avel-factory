# backend/sprint-06: the sprint's plan. Axis writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Rigg's tests, Soap's build, Rigg's review.
# Check it:   scripts/render.py --check backend/sprint-06
# Render it:  scripts/render.py backend/sprint-06   (after approval, in its own sprint-folder PR once sprint-05 has merged, CR-42 item 2)
#
# Sprint-06 is the first sprint after Step 1. Javaris, Nov 20: "we need to hurry up and start to build out the endpoints,
# schema, logic, and bring these pages and concepts to life". It runs two chains at once, one Soap session each (CR-45
# decision 5, B7): Step 2 on the critical path (Backend modules and build plan, section 1: 0 > 1 > 2 > 4 > 8 > 9a > 9b),
# and the routes the frontend's first-mission screens read (CR-W31's route table, now on contract-mock), built for real.
#
# Six tickets, each a full session of product code (Javaris, Nov 18: bigger tickets, fewer PRs):
#   Chain A, Step 2 (no room host needed):
#     T-B21 per-attempt credentials, revoked when the attempt ends and by the reaper after a restart  ~120 min  full
#     T-B22 the model proxy, the meter of record: per-request reservations and the $4 attempt cap      ~150 min  full  (after T-B21)
#     T-B23 the mission repo over HTTP, with per-attempt git credentials                                ~120 min  full  (after T-B21)
#   Chain B, the first-mission routes:
#     T-B24 the top bar and Decisions: routes 104, 52 and 53                                            ~120 min  standard
#     T-B25 missions: create a draft, list them, open one (routes 19, 20, 21)                           ~120 min  standard (after T-B24)
#     T-B26 the live streams: events (63), traces (64) and an attempt's steps (109)                     ~120 min  full  (after T-B25)
#
# What waits on what, and why (only where the code needs it):
#   - T-B22 and T-B23 verify T-B21's tokens, so they wait for it. T-B23 also changes server.ts, as T-B21 does.
#   - T-B22 runs as its own process (Design v0.6 Main: the model proxy is a separate service on the host, and the only
#     holder of the model key), so it changes neither server.ts nor app.ts, and T-B22 and T-B23 share no file.
#   - T-B25's needsYouCount and displayState reuse T-B24's pending-decisions query. T-B26 follows T-B25 only because
#     every route ticket wires itself into router.ts (and maps its errors in errors.ts); with one builder on chain B,
#     that costs no time.
#
# Which tickets can build at the same time (no shared file, neither waits on the other; render.py --check holds it):
#   - T-B21 beside T-B24: the sprint's first pair.
#   - T-B22 or T-B23 beside T-B25 or T-B26: each Step 2 ticket beside each route ticket.
#   - T-B22 beside T-B23, when chain B has no build running.
#   At most two Soap sessions at once (B7). Rigg writes T-B24's tests while T-B21's are locked and building, and so on
#   down both chains, one checker session at a time.
#
# Not in this sprint, and why:
#   - The egress proxy (Step 2). The sixth ticket slot went to the routes; it needs T-B21's proxy credential, and it
#     heads sprint-07. See decision 4.
#   - The upload parser (Step 2). It runs in the sandbox (CR-34: type sniffing, archive unpacking and malware scans in
#     the sandboxed parser) and needs PDF and DOCX parsing packages (Port inventory: avel-server's document parsing),
#     so it waits for the room host and a dependency request (E5). See decisions 3 and 4.
#   - Route 54 (decide a proposal). No step has built a proposal kind's effect yet (E8); it comes with the first one.
#   - Route 52's factory_change rows. Open factory PRs live on GitHub, not in a table (packages/contract dto/factory.ts),
#     and reading them needs the factory App's credentials; they come with routes 72 and 73.
#   - The CLI (Javaris, Nov 18: no CLI work). T-B23 serves attempts only; the operator's avel link pushes to
#     operator/<mission> come with the CLI.
#   - No new dependency in any ticket (E5): the proxy calls the vendor with fetch, the git endpoint runs the host's git,
#     and tokens use node:crypto.
#
# Decisions for Javaris:
# 1. Steps beside Step 2 (E9). E9 says no ticket from a later step starts until the current step closes. The build plan
#    (section 1) lets Steps 3, 5, 6 and 7 run beside the critical path once their inputs exist. Chain B is Step 5 work
#    (T-B24's status read is the avel watch header and the top bar; T-B26 is Step 5's live and trace streams) and the
#    start of Step 7 (T-B25: a mission is a draft before Canon's first question). T-B22 also brings Step 8's
#    per-request reservations and $4 cap into Step 2's proxy, as Javaris asked, so no request is ever metered without
#    its ceiling. Approve this for sprint-06. Axis drafts CR-47 to reword E9 (the critical path in order; off-path steps
#    beside it once their inputs exist), so it isn't asked again. Axis recommends both.
# 2. Starting before Step 1 closes (B8). Sprint-05 still has T-B18 (built and green; a fresh review, then the merge) and
#    T-B20. Rigg can write T-B21's and T-B24's tests while T-B20 runs: their test paths (test/credentials, test/decisions,
#    test/status) don't meet T-B20's. T-B24's build can start then too, since no part of it reads T-B18's or T-B20's code.
#    T-B21's build waits for T-B18 to merge, because it builds on T-B18's consumers. Approve, or keep B8 as written
#    (sprint-06 starts after sprint-05's last merge). Axis recommends approving.
# 3. The room host (CR-22, the Sandbox doc). No ticket in sprint-06 needs it. Sprint-07 does: rooms (createRoom, exec,
#    syncRepo, destroy), the isolation suite, the upload parser, the offline package cache and runner-image builds. The
#    choice is Docker with gVisor on a host we run (this machine for development and CI first, the dedicated US host
#    before a client mission, as the Sandbox doc says) or MIOSA rooms (CR-22: internal and template missions only until
#    MIOSA publishes egress controls and a SOC 2). Axis recommends Docker with gVisor now, behind the compute interface,
#    with MIOSA as a later adapter. Decide before sprint-07 is planned. (After Nov 17's out-of-memory crashes, rooms on
#    this machine need memory limits from the start.)
# 4. Deferring the egress proxy and the upload parser, as above: the egress proxy heads sprint-07, and the parser follows
#    decision 3 with its dependency request. The other choice is to swap the egress proxy in for T-B24 and leave the top
#    bar and Decisions on the mock a sprint longer. Axis recommends the plan as written.
# 5. CR-48 (Axis drafts it; T-B22 needs it accepted before its build starts, E12). DATABASE.md's Ownership section says
#    metering writes the reserved_micros and spent_micros columns. The proxy's per-request reservation must also move
#    attempts.cost_micros (an attempt's settled cost; attempts names it cost, not spent) in the same transaction, so
#    attempts_cap_ck can enforce the $4 cap. CR-48 names the exception exactly: reserved_micros and spent_micros on
#    missions and module_runs, and reserved_micros and cost_micros on attempts. It touches DATABASE.md (Ownership) and
#    the comment in packages/db/src/owners.ts; no table, column or CHECK changes. Axis recommends accepting it.
# 6. .env.example. T-B22 adds the proxy process's settings (its port, the vendor's base URL, ANTHROPIC_API_KEY, read
#    only by the proxy) and T-B23 adds the mission repos' folder. .env.example is outside every agent's Territory, so
#    Javaris adds them; each build report lists them by name, never a value.

