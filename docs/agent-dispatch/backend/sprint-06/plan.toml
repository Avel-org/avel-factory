  "route 64 streams an attempt's traces after Last-Event-ID as AgentTraceDto, and as AgentStepDto with view=steps; a session's traces stream the same way; neither or both ids is the contract's error",
  "route 109 pages an attempt's steps oldest first after ?after=, valid against the contract; an unknown attempt answers the contract's error with requestId",
  "routes 63, 64 and 109 without a session are 401 with the contract's body and requestId",
]
