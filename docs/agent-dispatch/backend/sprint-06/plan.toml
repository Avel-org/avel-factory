[analysis]
stack = "Node 22.12+, pnpm 10 workspace, TypeScript 7.0.2 (erasableSyntaxOnly), Biome, Vitest 5; Hono 4.13.16, oRPC 1.16.2, Zod 4, Effect 4.1.1 inside packages/server; Drizzle 0.45.4 and node-postgres 8.23.1; Postgres 17; Better Auth 1.7.16"
