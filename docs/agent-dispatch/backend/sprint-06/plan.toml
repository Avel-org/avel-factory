  { path = "packages/contract/src/routes/events.ts", why = "routes 63 and 64: their inputs and eventIterator outputs" },
  { path = "packages/contract/src/dto/events-and-traces.ts", why = "EventDto (a union over every kind with its payload schema), EventStreamInput, AgentTraceDto and TraceStreamInput" },
  { path = "packages/contract/src/dto/dispatches.ts", why = "AgentStepDto: view=steps and route 109" },
  { path = "packages/server/src/platform/db/events.ts", why = "how events are written and their seq taken at commit; read only" },
  { path = "packages/db/src/schema/events.ts", why = "events (seq, mission_id, kind, payload, at) and agent_traces (trace_seq, attempt_id, session_id, kind, body), partitioned by week" },
  { path = "docs/design/Jobs and workers.md", why = "consumers read events in seq order; the stream is a reader in the same order" },
]
verify = [
