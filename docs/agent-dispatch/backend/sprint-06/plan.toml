[[ticket]]
id = "T-B22"
slug = "model-proxy"
title = "The model proxy, the meter of record: the only model key, a reservation before each request, and the $4 attempt cap"
goal = "Every model call goes through one proxy that holds the only key, reserves the request's maximum cost against the attempt's $4 cap and the module and mission budgets before sending, refuses what they can't cover, and records exactly what each call cost."
rigor = "full"
refs = [
  "Design v0.6 Main, Build order step 2 (the model proxy: key and meter) and step 8 (the proxy's per-request reservations and the $4 attempt cap), brought forward together (decision 1)",
  "Design v0.6 Main, Cost control: budgets in dollars enforced at the model proxy; reserve before spending; capped and budget_parked",
  "Sandbox doc: the model key stays on the host; the proxy adds it, allows only the messages endpoint and requires the dispatch's token",
  "CR-22 item 3: ANTHROPIC_BASE_URL points at the proxy and ANTHROPIC_AUTH_TOKEN is the attempt's dispatch token",
  "Port inventory: token usage and prices with changes (split 5-minute and 1-hour cache writes; the proxy is the meter of record)",
  "CR-48 (decision 5): metering writes attempts.cost_micros as well as the reserved and spent columns",
]
depends_on = ["T-B21"]
may_change = [
  "packages/server/src/metering/**",
]
must_not_change = [
  "packages/server/package.json",
  "pnpm-lock.yaml",
  "packages/server/src/server.ts",
  "packages/server/src/main.ts",
  "packages/server/src/platform/**",
  "packages/server/src/compute/**",
  "packages/db/**",
  "packages/contract/**",
]
context = [
  { path = "docs/design/Design v0.6 Main.md", why = "Cost control: the price table, the cache-write split, reserve before spending, the per-request ceiling, capped against budget_parked, and the 80% warning (not in this ticket)" },
  { path = "docs/design/DATABASE.md", why = "Cost and time: budget_reservations (kind expected or request, one per proxy call, a retried request can't reserve twice, the reaper releases held rows) and price_table; Ownership" },
  { path = "packages/db/src/schema/metering.ts", why = "budget_reservations and price_table, and their CHECKs (settled never above reserved)" },
  { path = "packages/db/src/schema/runner.ts", why = "attempts: cap_micros, reserved_micros, cost_micros and attempts_cap_ck, which refuses a reservation past the cap" },
  { path = "packages/db/src/schema/factory.ts", why = "missions and module_runs: budget_micros, reserved_micros, spent_micros and the CHECKs that refuse an overspend" },
  { path = "packages/server/src/compute/credentials/index.ts", why = "T-B21's verify: a dispatch token (an attempt) or a service token (Canon's session); read only" },
  { path = "docs/design/CR-22 Rooms on MIOSA and room hooks.md", why = "items 3 and the --max-budget-usd note: what the harness in a room sends, and that the proxy stays the meter of record" },
]
verify = [
  "pnpm --filter @avel/server test",
  "pnpm --filter @avel/server typecheck",
  "pnpm --filter @avel/server check:effect",
  "git diff --exit-code main -- packages/server/package.json pnpm-lock.yaml",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "Build only after CR-48 is accepted (decision 5). If it isn't, stop with blocked",
  "The proxy is its own Hono app and its own process (Design v0.6 Main: the model proxy and the egress proxy are separate services on the host): startModelProxy(env) in packages/server/src/metering/proxy/, with its own entry file beside it, its own port and its own pools in one Scope (Writing Effect rule 6). The main service never reads the model key: the key is Config.Redacted, read only by startModelProxy, which refuses to start without it, naming the variable and never the value",
  "Callers: a room's harness with its attempt's dispatch token, and Canon with a session's service token (T-B21's verify). It allows only POST /v1/messages; anything else, and any request without a valid token, is refused before any vendor call. It strips the caller's credentials and adds the factory's key. The vendor is a layer over fetch with a timeout (rule 5); tests provide a fake vendor layer (E10)",
  "Reserve before sending, in one transaction: a budget_reservations row of kind request for the attempt (or the session) with its request_id, and the same amount added to the attempt's reserved_micros, its module run's and its mission's (a session's: the mission's only). The amount is the request's maximum cost: its input tokens priced at the highest of the input and cache-write prices, plus max_tokens at the output price, from the price_table row valid now (Clock) for the vendor and model. Input is counted before sending through the vendor layer's token count, with no tokenizer package (E5). A request with no valid price is refused",
  "The database enforces the ceilings (attempts_cap_ck and the module and mission CHECKs). A refusal from the attempt's CHECK is the cap (the attempt will end capped); one from the module's or the mission's is the budget (budget_parked). Map each by constraint name, never by re-checking in code alone (AGENTS.md: the database enforces its rules). Answer the harness in the vendor's error shape with the reason, and send nothing. Ending the attempt is the runner's (Step 4): this ticket writes no attempts.outcome (E8, E12)",
  "Settle once the vendor's stream ends: price the usage it reported (input, output, cache reads, cache writes at 5 minutes and at 1 hour, each from price_table), set settled_micros, move the attempt's reserved into cost_micros and the module's and mission's reserved into spent_micros, and append metering.spend.updated (usage.recorded), in one transaction. The response streams through to the caller as it arrives; output is never clamped",
  "Never undercount: if the stream fails, times out or the caller aborts before the vendor's final usage, settle what the vendor reported so far if that's all it will report, and otherwise keep the full reservation as spent. The reservation is a resource with acquireRelease, so an interrupted request never leaves a held row. A retry of the reservation write with the same request_id reserves once (the unique index)",
  "Housekeeping in the proxy's process: a reaper job kind releases held reservations of ended attempts and ended onboarding sessions (DATABASE.md: the reaper releases held rows), at startup and on its schedule",
  "Money stays in micro-dollars, as integers. No money goes on a web-facing route or event beyond AI cost against its cap (AGENTS.md). The key, a token or a prompt's text never appears in a log line, a row or an event",
  "List the proxy's settings by name in the report (its port, the vendor's base URL, ANTHROPIC_API_KEY, DATABASE_URL): Javaris adds them to .env.example",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/metering/**"]
behaviours = [
  "a request with a running attempt's dispatch token reaches the fake vendor with the factory's key and without the caller's token, and its streamed reply reaches the caller unchanged",
  "after the reply, the reservation is settled at the usage's price from price_table (input, output, cache read, 5-minute and 1-hour cache writes each at their own price), and the attempt's cost_micros and the module's and mission's spent_micros rise by exactly that amount, with one metering.spend.updated event in the same transaction and nothing left reserved",
  "a request to any path but POST /v1/messages, or with a missing, revoked, expired or non-dispatch, non-service token, is refused and the fake vendor sees no call",
  "a request whose maximum cost the attempt's $4 cap can't cover is refused with the cap's reason and never sent; one the module's or the mission's budget can't cover is refused with the budget's reason and never sent; the two reasons differ",
  "20 concurrent requests on one attempt never take reserved plus cost past its cap, and concurrent requests across a module's attempts never take it past its budget; every request that reached the vendor had its reservation first",
  "a request for a model with no price_table row valid at the TestClock's now is refused and never sent",
  "a reply that fails or is aborted before the vendor's final usage leaves no held reservation and settles no less than the usage the vendor reported",
  "a Canon request with a session's service token reserves and settles against the mission's budget only, with the session's id and no attempt",
  "the reaper releases the held reservations of an ended attempt and of an ended onboarding session, and leaves a running attempt's",
  "startModelProxy refuses to start without ANTHROPIC_API_KEY, naming the variable and never a value; startServer starts without it; no log line or row holds the key or a token",
]

# ---------------------------------------------------------------------------------------------
[[ticket]]
id = "T-B23"
slug = "mission-repo-git"
title = "The mission repo over HTTP: a room clones with its attempt's git credential and pushes only its own attempt branch"
goal = "A room can clone and fetch its mission's repo over HTTP with its attempt's git credential, and a push to anything but that attempt's own branch is refused with nothing changed."
rigor = "full"
refs = [
  "Design v0.6 Main, Build order step 2: the mission repo over HTTP with per-attempt git credentials (read the mission's branches, push only the attempt's own branch); done when a push to any branch but the attempt's own is refused",
  "Sandbox doc: Git (clones over HTTP with no shared files, pushes only its own branch with a per-room credential; the mission repo is never mounted)",
  "Port inventory: Worktree provider, sources, snapshot (the attempt's own branch mission/<id>/<module>/<role>-a<n>)",
  "AGENTS.md, Architecture rules: Hono routes outside the contract include /git/missions/{missionId}.git",
]
depends_on = ["T-B21"]
may_change = [
  "packages/server/src/compute/git/**",
  "packages/server/src/platform/app.ts",
  "packages/server/src/server.ts",
]
must_not_change = [
  "packages/server/package.json",
  "pnpm-lock.yaml",
  "packages/server/src/compute/credentials/**",
  "packages/server/src/platform/router.ts",
  "packages/server/src/platform/errors.ts",
  "packages/server/src/main.ts",
  "packages/server/test/entry/start.test.ts",
  "packages/db/**",
  "packages/contract/**",
]
context = [
  { path = "docs/design/Sandbox - Docker now, boat or MIOSA next.md", why = "the Git row and Moving off Docker: why the repo is reached over HTTP with a credential that works only for its own branch" },
  { path = "packages/server/src/compute/credentials/index.ts", why = "T-B21's verify for kind git, whose scope is the attempt's own branch; read only" },
  { path = "packages/server/src/platform/app.ts", why = "createApp: where the Hono routes outside the contract are mounted, as the webhook is" },
  { path = "packages/server/src/platform/webhooks/github.ts", why = "the precedent for a Hono route outside oRPC: reading a raw body with a limit, and answering the contract's error body with the requestId" },
  { path = "packages/server/src/server.ts", why = "startServer's settings and Scope: the mission repos' folder comes from Config here" },
]
verify = [
  "pnpm --filter @avel/server test",
  "pnpm --filter @avel/server typecheck",
  "pnpm --filter @avel/server check:effect",
  "pnpm --filter @avel/server exec vitest run test/entry/start.test.ts",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "Git's smart HTTP protocol at /git/missions/{missionId}.git, served by the host's git (git http-backend, or upload-pack and receive-pack run directly): git is a host tool, not a package (E5). Every git process has a timeout and is ended with its scope (Writing Effect rules 5 and 6)",
  "Each mission's repo is a bare repo at <folder>/<missionId>.git, the folder from Config (startServer reads it; say its name in the report for .env.example). The path comes only from a missionId that parses as a UUID; anything else is 404. Without the setting the server has no git endpoint, as the webhook works today. Creating a mission's repo isn't in this ticket (E8): tests make their own bare repos",
  "Auth is HTTP Basic with the attempt's git credential as the password, checked with T-B21's verify for kind git, on every request. Missing or refused is 401 with a WWW-Authenticate header so git asks; a credential for another mission's repo is 404, so it learns nothing. Other kinds (dispatch, proxy, service) never pass",
  "Read: clone and fetch see the mission's branches. Push: every ref update in a receive-pack request must be an update or create of exactly the credential's own branch (refs/heads/mission/<missionId>/<moduleRef>/<role>-a<n>). A request naming any other ref, a tag, or a delete is refused whole before any ref moves (read the commands before handing the pack to git, or a pre-receive check given the allowed ref), and the repo's refs are unchanged",
  "A refusal git can show (a rejected ref) names the rule, never a token. Errors outside git's protocol answer the contract's error body with the requestId, as the webhook does; errors.ts doesn't change",
  "Request bodies have a size limit, checked before buffering (the webhook's precedent). Logs name the credential's id and the mission, never the token",
  "The operator's CLI-session access (avel link, pushes to operator/<mission>) is Step 5's and waits for the CLI (Javaris, Nov 18); don't build it (E8)",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/git/**"]
guards = [
  "packages/server/test/entry/start.test.ts passes, and startServer without the mission repos' setting serves no /git route",
]
behaviours = [
  "git clone of /git/missions/{missionId}.git with the attempt's git credential, from startServer on a free port, gets the mission's branches",
  "a push of new commits to the attempt's own branch lands, and the bare repo's ref moves to them",
  "a push to main, to another attempt's branch, to operator/<missionId>, of a tag, or deleting the own branch is refused, and every ref in the bare repo is unchanged; a push that updates the own branch and another ref together is refused whole",
  "a clone without a credential is 401 with WWW-Authenticate; with a revoked or expired git credential it's 401; with a dispatch or proxy credential it's 401; with another mission's git credential it's 404",
  "a mission id that isn't a UUID, or one with no repo, is 404, and no path outside the repos' folder is touched",
  "no log line written during these tests holds a credential's token",
]

