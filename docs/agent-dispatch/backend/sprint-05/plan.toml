# backend/sprint-05: the sprint's plan. Axis writes it; Javaris approves it (Build rules B1).
# Each [[ticket]] renders into three task docs: Rigg's tests, Soap's build, Rigg's review.
# Check it:   scripts/render.py --check backend/sprint-05
# Render it:  scripts/render.py backend/sprint-05   (after approval, in its own sprint-folder PR once sprint-04 has merged, CR-42 item 2)
#
# Sprint-05 closes Step 1. Spike 2 is decided: DBOS failed CR-30 checks 1, 2, 6 and 8, and held check 5 only in part
# (T-B13's build report, 52b7fe5). Under CR-30 section 6 that means build A, the hand-built engine. T-B13's PR closes
# unmerged, and its locked tests move into T-B17 unchanged, as sprint-04 promised ("nothing is written twice").
#
# Four tickets (one per module, about a full session each, as Javaris asked on Nov 18):
#   T-B17 the hand-built jobs engine under T-B13's relocked tests, with CR-44's partition key   ~150 min  full, schema (CR-44)
#   T-B18 event consumers: the rest of Step 1 item 10 and test 11 (after T-B17)                  ~90 min   full
#   T-B19 platform follow-ups: the P2s from T-B14, T-B15 and T-B16's reviews                     ~120 min  full
#   T-B20 Step 1's done-when tests and report (C5) (after T-B17, T-B18 and T-B19)                ~60 min   full
#
# Order and parallel builds:
#   - T-B17 and T-B19 share no file (builder or test paths), so they could build at the same time if Javaris allows
#     two builders at once (decision 2). Otherwise T-B17 goes first: it's on the critical path to Step 2.
#   - T-B18 is chained after T-B17 (both change platform/jobs/**). T-B20 is chained after all three.
#   - Rigg writes T-B19's tests while Soap builds T-B17, and T-B18's while Soap builds T-B19 (B7).
#   - T-B19 starts from a main that has T-B15 (#66), T-B16 and PR #68 merged: it changes their files.
#
# How T-B17's branch gets T-B13's tests without DBOS (no DBOS code, no dependency, no lockfile change):
#   - The tests dispatch cuts t/B17-jobs-engine from main as usual. Rigg then copies the tests by path only, from the
#     T-B13 relock: git checkout 330b6ec -- packages/server/test/jobs packages/server/test/platform-hardening/pool-timeouts.test.ts
#     330b6ec holds the tests commit 989cc3f plus the upheld dispute fix 9155427 (createSaved makes its table if
#     missing and empties it). A checkout by path brings nothing from src/, package.json or pnpm-lock.yaml.
#   - Rigg checks `git diff 330b6ec -- packages/server/test/jobs packages/server/test/platform-hardening` is empty for
#     the copied files, adds only the CR-44 test (partition-index.test.ts), and commits. Axis locks the whole set
#     (lock from a detached worktree, then fast-forward the t/* branch).
#   - Soap's build copies Soap's engine-neutral interface by path too: git show 330b6ec:packages/server/src/platform/jobs/jobs.ts.
#     index.ts is rewritten to export JobsLive from the hand-built engine; nothing under platform/jobs/dbos/ comes over.
#   - Verify proves it: `git diff main -- packages/server/package.json pnpm-lock.yaml` is empty, and no file imports @dbos-inc.
#
# Not in this sprint:
#   - t-b16-rigg-01 (P1, the real server didn't start on operator.ts's parameter property) is hotfixed outside the sprint
#     in PR #68, with erasableSyntaxOnly and the start-up smoke test packages/server/test/entry/start.test.ts.
#   - t-b16-rigg-04 (P3, sign-out during a database failure answers 200 but the session stays live; Better Auth's
#     behaviour), t-b15-rigg-04 and t-b15-rigg-05 (P3s), and t-b14-rigg-04 (P3) go to the backlog.
#   - Starting workers or consumers in the running server: no Step 1 job kind or consumer exists yet (E8). The first
#     step that adds a job kind starts its worker in server.ts.
#
# CR-44 (a partition key on jobs) is accepted (Javaris, Nov 19, via OSA: "Accept CR-44"), and committed with this plan.
#
# Decisions for Javaris:
# 1. CR-W31 part (a). Sprint-04's header said part (a) heads sprint-05. Eight minutes later the same evening, Javaris
#    approved T-F22 (frontend sprint-12): the frontend lane builds part (a) on Axis's three conditions, and roster.json
#    on main gives the frontend packages/contract-mock/src/** and test/** for it. A backend ticket for it would build
#    the same thing twice and share T-F22's files. Axis's part is condition 3: Axis reads part (a)'s state module for
#    fidelity before T-F22 merges, as a check and not a G7 review. Axis puts that read at the head of this sprint's lead
#    work, so the frontend isn't waiting on it, and plans no ticket. Approve that, or say the backend builds part (a)
#    instead. Then T-F22 is withdrawn, and a T-B21 takes its routes and its tests.
# 2. Two builders at once (B7). T-B17 and T-B19 share no file, so render.py's overlap check passes with both live.
#    Allow them to build in parallel (two Soap sessions, about 2.5 hours sooner to Step 1 done), or keep one builder at
#    a time (T-B17, then T-B19, T-B18, T-B20). Axis recommends parallel for this pair only: their territories don't
#    meet, and each is full rigor with its own review.
# 3. T-B19's size. It carries eight P2s across auth, the webhook, idempotency, onboarding and the server's shutdown, as
#    one full-rigor ticket (Javaris, Nov 18: bigger tickets, fewer PRs). The other choice is to split the webhook's
#    three (t-b15-rigg-01 to 03) into their own ticket, with a smaller diff for Zero's G7 review. Axis recommends one.
# 4. .env.example. T-B19 adds GITHUB_WEBHOOK_SECRET and the factory repo's settings to the running server's Config.
#    .env.example is outside every agent's Territory, so Javaris adds them, with T-B16's four (AVEL_OPERATOR_EMAIL,
#    AVEL_OPERATOR_PASSWORD, AVEL_AUTH_SECRET, AVEL_WEB_ORIGIN). The build report lists each by name.

lane = "backend"
sprint = "sprint-05"
step = 1
title = "Step 1, cycle 5: the jobs engine, event consumers, the review follow-ups, and Step 1 done"
goals = [
  "A job survives a killed or frozen worker, retries on the planned backoff and ends dead after 5 tries, on our own engine and tables",
  "Jobs in one mission run one at a time, and the database refuses a second claim in the same mission",
  "A consumer acts on every committed event once, in order, and picks up where it left off after a crash or a restart",
  "The running server serves the webhook, answers every sign-in failure with the contract's body, and shuts down without a stuck pool",
  "Every Step 1 done-when test has a passing test behind it, and the report says so",
]
done_when = [
  "Step 0 and Step 1 plan, Step 1 test 10 (jobs), held by T-B13's locked tests over the hand-built engine (CR-30 option A)",
  "Step 1 test 11 (events): seq order equals commit order with no gaps a reader can miss; a rolled-back transaction leaves no event and no job; two copies of one consumer never both act on an event",
  "CR-44: at most one claimed job per partition key, enforced by the database",
  "Step 1 test 3 (errors) and test 12 (factory repo) hold in the running server, not only in createApp",
  "C5: Step 1's done-when report maps each of tests 1 to 13 (2, 4 and 13 as CR-43 restates them) to a passing test",
]
sources = [
  { path = "docs/design/Step 0 and Step 1 plan.md", why = "Step 1 items 1, 5, 8, 9, 10, 11; tests 1 to 13 and what CR-31 and CR-43 removed or moved" },
  { path = "docs/design/CR-30 Effect in the server, durable jobs and spans.md", why = "section 3 option A (the hand-built engine) and section 6 (spike 2's verdict: build A)" },
  { path = "docs/design/CR-44 A partition key on jobs.md", why = "accepted Nov 19: the partition_key column, its partial unique index, and the docs it touches" },
  { path = "docs/design/CR-43 Step 1 without the CLI.md", why = "tests 2, 4 and 13 on the clients routes; step-up and CLI login leave Step 1" },
  { path = "docs/design/Jobs and workers.md", why = "claims, check-ins, the reaper, the backoff, one live job per key, consumers and their cursors" },
  { path = "docs/design/Build rules.md", why = "C4, C5, E3, E5, E7, E8, E10, E12, F2, F4, G5, G7, H6, I3" },
]

[commands]
build = "pnpm build"
typecheck = "pnpm typecheck"
lint = "pnpm lint"
test = "pnpm test"

[analysis]
stack = "Node 22.12+, pnpm 10 workspace, TypeScript 7.0.2 (erasableSyntaxOnly from #68), Biome, Vitest 5; Hono 4.13.16, oRPC 1.16.2, Zod 4, Effect 4.1.1 inside packages/server; Drizzle 0.45.4 and node-postgres 8.23.1; Postgres 17; Better Auth 1.7.16"
layout = "packages/contract, packages/db (schema, migrations 0000 to 0003, the done-when db suite), packages/server (src/platform: app, router, effect-handler, errors, ids, logger, idempotency, rate-limit, auth, webhooks, factory-repo, db; src/onboarding, src/audit, src/knowledge; src/server.ts and src/main.ts from T-B16)"
conventions = [
  "AGENTS.md is the rulebook: Architecture rules (durable work, the database enforces its rules), API rules and Writing Effect rules 1 to 10",
  "Db.withTransaction gives a program Tx and maps database violations to tagged errors; Events.append needs Tx, and Db.commitWithEvents takes seq under the advisory lock as the last statement",
  "packages/server/src/platform/errors.ts holds the one table from a tagged error to a contract code",
  "Time comes from Clock, timings are Schedules, and tests drive them with TestClock; no wall-clock sleeps (F4)",
  "Tests run against real Postgres from scripts/pg-local.sh; test/db/support/database.ts makes a migrated database per file",
  "Source files use only erasable TypeScript syntax (no parameter properties or enums): Node runs src/main.ts with type stripping (#68)",
]
notes = [
  "Review (G5): one review, no round 2. Only a P0 or P1 sends a PR back. Every P2 goes to a later ticket or the backlog, named in the PR text",
  "All four tickets are full rigor (C4: jobs, claims, the reaper and events; sign-in and the webhook's signature). Javaris merges, and Zero's second review follows the security checklist (G7)",
  "Lock from a detached worktree, then fast-forward the t/* branch; merge main into a ticket branch before its build starts",
]

