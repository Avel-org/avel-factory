  { path = "docs/design/Jobs and workers.md", why = "Event consumers: what a consumer reacts to, its cursor and its claim number" },
  { path = "packages/server/src/platform/jobs/jobs.ts", why = "T-B17's Jobs interface: startConsumer and ConsumedEvent" },
  { path = "packages/db/src/schema/platform.ts", why = "consumer_cursors: one row per consumer, its last seq and its claim number" },
  { path = "packages/server/src/platform/db/db.ts", why = "commitWithEvents takes seq under the advisory lock as the last statement; why a reader can't miss a gap; read only" },
  { path = "packages/server/test/jobs/consumers.test.ts", why = "T-B13-10, which T-B17 already passes; these tests go beyond it and must not repeat it; read only" },
]
verify = [
  "pnpm --filter @avel/server test",
  "pnpm --filter @avel/server typecheck",
  "pnpm --filter @avel/server check:effect",
  "pnpm build && pnpm typecheck && pnpm lint && pnpm test",
]
notes = [
  "A consumer is a claimed job (item 10): one claim per consumer name, with its own claim_no and expiry, checked in and reaped like any job. A copy whose claim was taken over can't move the cursor: the compare-and-swap is on the cursor's seq and the claim number together",
  "The handler's act and the cursor's move commit in one transaction when the handler writes through Tx, so an event is acted on once. A handler that fails leaves the cursor where it was; the same event is retried on T-B17's backoff and never skipped. Say in the report what happens after the 5th failure (dead, and the consumer stops) and how the operator would see it; if the design doesn't say, stop with needs-cr rather than choose (E3)",
  "A consumer that enqueues a follow-up job does it in the same transaction as its cursor move, so a crash leaves both or neither",
  "Under concurrent writers, including one that rolls back, the consumer sees every committed seq once, in order, with none skipped and none repeated",
  "No consumer kind is registered in the running server: Step 1 has none (E8). Keep T-B13's tests passing unchanged",
]

[ticket.tests]
role = "test-unit"
paths = ["packages/server/test/consumers/**"]
behaviours = [
  "a consumer stopped after acting on event n and started again (a new copy, same name) resumes at n + 1 from consumer_cursors, and acts on nothing twice",
  "a consumer copy killed mid-handle has its claim expire and taken over within a minute (TestClock); the new copy handles that event once, and the dead copy's late cursor move is refused",
  "a handler that fails leaves the cursor unchanged; the same event is retried after 10 s (TestClock) and the events after it aren't acted on first",
  "a handler that writes through Tx and enqueues a follow-up job commits both with the cursor move; a failure in the same transaction leaves no write, no job and the cursor where it was",
  "with 20 concurrent writer transactions, some rolled back, a consumer started before them acts on exactly the committed events, once each, in seq order (test 11)",
  "two consumers with different names each see every event, and each keeps its own cursor",
]

