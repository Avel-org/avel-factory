document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ge holds 4.8:1; night uses the light accent with dark text. Running indicators move to ink so\n   blue only ever means \"needs you\" or \"the action\". */\n:root, [data-theme=\"light\"] {\n  --av-needs: var(--color-btn-primary-top);\n  --av-needs-hover: color-mix(in oklab, var(--color-btn-primary-top), #000 10%);\n  --av-on-needs: var(--color-text-on-solid);\n  --av-needs-text: var(--color-accent-text);\n  --av-needs-tint: var(--color-accent-soft);\n  --av-needs-line: var(--color-accent-line);\n}\n[data-theme=\"night\"] {\n  --av-needs: var(--color-accent);\n  --av-needs-hover: color-mix(in oklab, var(--color-accent), #fff 10%);\n  --av-on-needs: var(--color-app-page);\n  --av-needs-text: var(--color-accent-text);\n  --av-needs-tint: var(--color-accent-soft);\n  --av-needs-line: var(--color-accent-line);\n}\n.cr-mini-gates i[data-st=\"running\"], .cr-ladder-steps i[data-st=\"now\"], .cr-slotbar i[data-on] { background: var(--av-ink); }\n.cr-meter .cr-bar-track i { background: var(--av-muted); }\n.cr-meter[data-warn] .cr-bar-track i { background: var(--av-needs); }\n.cr-gate[data-st=\"running\"] { background: var(--av-float); color: var(--av-ink); }\n\n/* Library kinds inline in the Factory tab row */\n.cr-mast-subs { display: inline-flex; align-items: center; gap: 2px; margin: 0 8px 0 -2px; padding: 0 6px; height: 28px; align-self: center; border-radius: var(--radius-control); background: var(--av-inset-deep); box-shadow: inset 0 0 0 1px var(--av-hairline); }\n.cr-mast-sub { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; color: var(--av-muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; text-decoration: none; }\n@media (hover: hover) and (pointer: fine) { .cr-mast-sub:hover { color: var(--av-ink); text-decoration: none; } }\n.cr-mast-sub[aria-current] { background: var(--av-chip); color: var(--av-ink); box-shadow: var(--av-shadow-raised); }\n@media (pointer: coarse) { .cr-mast-sub { height: 36px; } .cr-mas 02Fdiv>\n                    <\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"ov-d\">\n                      <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ov-d\">Dependencies<\u002Fh2><span class=\"cr-panel-meta\">M5 starts when M3 and M4 land<\u002Fspan><\u002Fheader>\n                      <div class=\"cr-deps\" data-ui=\"DependencyMap\">\n                        <sc-for list=\"{{ ov.depCols }}\" as=\"col\">\n                          <div class=\"cr-deps-col\"><span class=\"cr-deps-k\">{{ col.label }}<\u002Fspan><sc-for list=\"{{ col.nodes }}\" as=\"nd\"><span class=\"cr-deps-node\" data-state=\"{{ nd.state }}\">{{ nd.glyphEl }}<b>{{ nd.ref }}<\u002Fb><small>{{ nd.note }}<\u002Fsmall><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsection>\n                  <\u002Fdiv>\n                  <aside class=\"cr-dash-rail\" aria-label=\"Project context\">\n                    <section class=\"lib-card cr-panel cr-pad\" aria-labelledby=\"ov-b\">\n                      <h2 class=\"cr-panel-title\" id=\"ov-b\">Mission budget<\u002Fh2>\n                      <div class=\"cr-big-pct\"><b>{{ ov.budgetPct }}%<\u002Fb><span>used of the mission cap<\u002Fspan><\u002Fdiv>\n                      <span class=\"cr-bar-track cr-bar-lg\" data-warn=\"{{ ov.budgetWarn }}\"><i style=\"width: {{ ov.budgetPct }}%\"><\u002Fi><\u002Fspan>\n                      <p class=\"cr-hint\">{{ ov.budgetNote }} Amounts are on Business.<\u002Fp>\n                    <\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"ov-l\">\n                      <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ov-l\">Integration lane<\u002Fh2><a class=\"wl-link\" href=\"{{ ov.gatesHref }}\">Gates<\u002Fa><\u002Fheader>\n                      <div class=\"cr-lane\"><sc-for list=\"{{ ov.lane }}\" as=\"ln\"><div class=\"cr-lane-cell\" data-k=\"{{ ln.k }}\"><b>{{ ln.v }}<\u002Fb><span>{{ ln.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                      <sc-for list=\"{{ ov.commits }}\" as=\"cm\"><div class=\"cr-mini-row\">{{ cm.glyphEl }}<span class=\"cr-mini-row-name\"><code class=\"cr-sha\">{{ cm.commit }}<\u002Fcode> {{ cm.module }}<sc-if value=\"{{ cm.note }}\"> · {{ cm.note }}<\u002Fsc-if><\u002Fspan><span class=\"cr-mini-row-state\">{{ cm.when }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                    <\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"ov-f\">\n                      <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ov-f\">Open findings<\u002Fh2><a class=\"wl-link\" href=\"{{ ov.findingsHref }}\">Findings<\u002Fa><\u002Fheader>\n                      <sc-for list=\"{{ ov.findings }}\" as=\"fd\"><a class=\"cr-mini-row\" href=\"{{ ov.findingsHref }}\"><span class=\"av-tag\" data-ui=\"Tag\" data-tone=\"stopped\">{{ fd.glyphEl }}{{ fd.kind }}<\u002Fspan><span class=\"cr-mini-row-name\"><b>{{ fd.ref }}<\u002Fb> {{ fd.title }}<\u002Fspan><span class=\"cr-mini-row-state\"><code>{{ fd.route }}<\u002Fcode><\u002Fspan><\u002Fa><\u002Fsc-for>\n                    <\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"ov-dl\">\n                      <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ov-dl\">Deliveries<\u002Fh2><\u002Fheader>\n                      <p class=\"cr-panel-empty\">None yet. Gate 5 issues the receipt when every module has landed.<\u002Fp>\n                    <\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"ov-a\">\n                      <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ov-a\">Recent activity<\u002Fh2><a class=\"wl-link\" href=\"#/activity\">Activity log<\u002Fa><\u002Fheader>\n                      <ol class=\"cr-act\"><sc-for list=\"{{ ov.activity }}\" as=\"ac\"><li><span class=\"cr-act-when\">{{ ac.when }}<\u002Fspan><span class=\"cr-act-main\"><b>{{ ac.actor }}<\u002Fb> {{ ac.action }}<small>{{ ac.reason }}<\u002Fsmall><\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol>\n                    <\u002Fsection>\n                  <\u002Faside>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.live }}\">\n              <div class=\"cr-live\" data-ui=\"LiveRack\" data-page=\"{{ pg.id }}\" data-view=\"{{ lv.view }}\">\n                <div class=\"cr-live-main\">\n                                <sc-if value=\"{{ lv.full }}\"><div class=\"scr-state-bar\" data-state=\"staleVersion\" role=\"status\">{{ lv.fullGlyph }}<span class=\"cr-state-bar-text\"><b>All 6 slots in use.<\u002Fb> {{ lv.nextText }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                <sc-for list=\"{{ lv.parked }}\" as=\"pk\">\n                  <div class=\"cr-parked\" role=\"status\">{{ pk.glyph }}<span class=\"cr-parked-main\"><b>{{ pk.module }} parked<\u002Fb> · {{ pk.project }}<\u002Fspan><a class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"primary\" href=\"#/\">Review {{ pk.ref }}<\u002Fa><\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ lv.viewCanvas }}\">\n                  <section class=\"lib-card cr-panel cv\" aria-label=\"Agent terminals\" data-ui=\"LiveCanvas\" data-layout=\"{{ lv.cv.layout }}\">\n                    <header class=\"cv-bar\">\n                      <b class=\"cv-bar-brand\">MIOSA<\u002Fb>\n                      <div class=\"cv-meters\" data-ui=\"PlanMeters\"><sc-for list=\"{{ lv.cv.meters }}\" as=\"mt\"><span class=\"cv-meter\"><span class=\"cv-meter-k\">{{ mt.label }}<\u002Fspan><span class=\"cr-bar-track\" aria-hidden=\"true\"><i style=\"width: {{ mt.pct }}%\"><\u002Fi><\u002Fspan><span class=\"cv-meter-n\"><b>{{ mt.n }}<\u002Fb> of {{ mt.max }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                      <div class=\"cv-bar-ctl\">\n                        <div class=\"ro-seg\" role=\"group\" aria-label=\"Layout\"><sc-for list=\"{{ lv.cv.layouts }}\" as=\"lo\"><button type=\"button\" aria-pressed=\"{{ lo.on }}\" sc-camel-on-click=\"{{ lo.pick }}\">{{ lo.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                        <button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"secondary\" aria-pressed=\"{{ lv.cv.eventsOn }}\" sc-camel-on-click=\"{{ lv.cv.toggleEvents }}\">Events<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fheader>\n                    <div class=\"cv-body\">\n                      <div class=\"cv-ground\">\n                        <sc-for list=\"{{ lv.cv.wins }}\" as=\"wn\">\n                          <article class=\"cv-win\" data-st=\"{{ wn.st }}\" data-split=\"{{ wn.split }}\" aria-label=\"{{ wn.label }}\">\n                            <header class=\"cv-win-head\">\n                              <span class=\"ro-tile\" data-kind=\"builds\" aria-hidden=\"true\">{{ wn.mono }}<\u002Fspan>\n                              <span class=\"cv-win-id\"><b>{{ wn.name }}<\u002Fb><small>{{ wn.title }}<\u002Fsmall><\u002Fspan>\n                              <sc-if value=\"{{ wn.parked }}\"><span class=\"ro-st\" data-st=\"parked\"><i aria-hidden=\"true\"><\u002Fi>Parked<\u002Fspan><\u002Fsc-if>\n                              <sc-if value=\"{{ wn.hasTabs }}\"><div class=\"ro-seg\" role=\"group\" aria-label=\"Show\"><sc-for list=\"{{ wn.tabs }}\" as=\"tb\"><button type=\"button\" aria-pressed=\"{{ tb.on }}\" sc-camel-on-click=\"{{ tb.pick }}\">{{ tb.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n                              <sc-if value=\"{{ wn.canExpand }}\"><button type=\"button\" class=\"cv-icon\" aria-label=\"Expand {{ wn.name }}\" title=\"Expand\" sc-camel-on-click=\"{{ wn.expand }}\">{{ ic.expand14 }}<\u002Fbutton><\u002Fsc-if>\n                            <\u002Fheader>\n                            <div class=\"cv-meta\"><sc-for list=\"{{ wn.meta }}\" as=\"me\"><span class=\"{{ me.cls }}\">{{ me.text }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                            <div class=\"cv-panes\">\n                              <sc-if value=\"{{ wn.term }}\">\n                                <div class=\"cv-term\" role=\"log\" aria-live=\"off\" aria-label=\"Terminal\" data-dim=\"{{ wn.parked }}\" sc-camel-on-mouse-enter=\"{{ wn.hold }}\" sc-camel-on-mouse-leave=\"{{ wn.release }}\">\n                                  <sc-for list=\"{{ wn.lines }}\" as=\"tl\"><div class=\"cv-line\" data-tone=\"{{ tl.tone }}\" data-last=\"{{ tl.last }}\">{{ tl.text }}<\u002Fdiv><\u002Fsc-for>\n                                  <sc-if value=\"{{ wn.held }}\"><span class=\"cv-held\">Paused while you hover<\u002Fspan><\u002Fsc-if>\n                                <\u002Fdiv>\n                              <\u002Fsc-if>\n                              <sc-if value=\"{{ wn.desk }}\">\n                                <div class=\"cv-desk\"><span class=\"cv-desk-k\">Desktop stream<\u002Fspan><span>The computer screen for {{ wn.name }} shows here once the MIOSA desktop stream is connected. It uses 1 of 5 computers<\u002Fspan><\u002Fdiv>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                            <sc-if value=\"{{ wn.parked }}\"><div class=\"cv-stopped\"><p>{{ wn.reason }}<\u002Fp><span>Sandbox closed. Nothing runs until you decide<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                            <footer class=\"cv-win-foot\">\n                              <sc-if value=\"{{ wn.running }}\">\n                                <span class=\"cr-bar\" data-warn=\"{{ wn.warn }}\"><span class=\"cr-bar-track\"><i style=\"width: {{ wn.timePct }}%\"><\u002Fi><\u002Fspan><small>{{ wn.timeLabel }}<\u002Fsmall><\u002Fspan>\n                                <span class=\"cv-beat\">Last event {{ wn.beat }}<\u002Fspan>\n                                <button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"secondary\" sc-camel-on-click=\"{{ wn.stop }}\">Stop<\u002Fbutton>\n                              <\u002Fsc-if>\n                              <sc-if value=\"{{ wn.parked }}\"><span class=\"cv-beat\">Waiting on you<\u002Fspan><a class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"primary\" href=\"#/\">Open decision<\u002Fa><\u002Fsc-if>\n                            <\u002Ffooter>\n                          <\u002Farticle>\n                        <\u002Fsc-for>\n                        <sc-for list=\"{{ lv.cv.ghosts }}\" as=\"gh\"><div class=\"cv-ghost\"><b>Slot {{ gh.n }} free<\u002Fb><span>{{ gh.note }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                        <sc-if value=\"{{ lv.cv.none }}\"><p class=\"cv-none\">No sandboxes running. A window opens here when a room starts<\u002Fp><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ lv.cv.hasStrip }}\">\n                        <aside class=\"cv-strip\" aria-label=\"Other windows\">\n                          <sc-for list=\"{{ lv.cv.thumbs }}\" as=\"th\"><button type=\"button\" class=\"cv-thumb\" data-st=\"{{ th.st }}\" sc-camel-on-click=\"{{ th.pick }}\"><span class=\"cv-thumb-id\"><b>{{ th.name }}<\u002Fb><span class=\"ro-st\" data-st=\"{{ th.st }}\"><i aria-hidden=\"true\"><\u002Fi>{{ th.stLabel }}<\u002Fspan><\u002Fspan><small>{{ th.title }}<\u002Fsmall><span class=\"cv-thumb-line\">{{ th.line }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n                          <span class=\"cv-strip-free\">{{ lv.cv.freeLabel }}<\u002Fspan>\n                        <\u002Faside>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ lv.cv.events }}\">\n                        <aside class=\"cv-drawer\" aria-label=\"Events\" data-ui=\"EventsDrawer\">\n                          <header><b>Events<\u002Fb><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"ghost\" sc-camel-on-click=\"{{ lv.cv.toggleEvents }}\">Close<\u002Fbutton><\u002Fheader>\n                          <ol><sc-for list=\"{{ lv.events }}\" as=\"ev\"><li><span class=\"cv-ev-t\">{{ ev.time }}<\u002Fspan><span class=\"cr-pdot\" style=\"--dot: {{ ev.dot }}\" aria-hidden=\"true\"><\u002Fspan><span>{{ ev.text }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol>\n                        <\u002Faside>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsection>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lv.viewRooms }}\">\n                <section class=\"cr-rooms\" aria-labelledby=\"lv-rooms\" data-ui=\"Rooms\">\n                  <header class=\"cr-sect-head cr-rooms-head\">\n                    <h2 class=\"cr-sect-title\" id=\"lv-rooms\">Rooms<\u002Fh2><span class=\"cr-sect-count\">{{ lv.inUse }}<\u002Fspan>\n                    <span class=\"cr-slotbar cr-slotbar-inline\" role=\"img\" aria-label=\"{{ lv.rackLabel }}\"><sc-for list=\"{{ lv.bars }}\" as=\"b\"><i data-on=\"{{ b.on }}\" data-warn=\"{{ b.warn }}\"><\u002Fi><\u002Fsc-for><\u002Fspan>\n                                      <\u002Fheader>\n                  <div class=\"cr-room-list\" role=\"list\">\n                    <sc-for list=\"{{ lv.rooms }}\" as=\"rm\">\n                      <article class=\"cr-wroom\" role=\"listitem\" data-warn=\"{{ rm.warn }}\" data-stall=\"{{ rm.stall }}\" aria-label=\"{{ rm.aria }}\" data-ui=\"RoomCard\">\n                        <div class=\"cr-wroom-id\">\n                          <span class=\"cr-slot-n\">Slot {{ rm.slot }}<\u002Fspan>\n                          <a class=\"cr-wroom-proj\" href=\"{{ rm.projHref }}\"><span class=\"cr-pdot\" data-pulse=\"true\" style=\"--dot: {{ rm.dot }}\" aria-hidden=\"true\"><\u002Fspan>{{ rm.project }}<\u002Fa>\n                          <div class=\"cr-wroom-mod\"><b>{{ rm.module }}<\u002Fb> {{ rm.role }}<\u002Fdiv>\n                                                    <div class=\"cr-ladder\" aria-label=\"{{ rm.ladderLabel }}\"><span class=\"cr-ladder-steps\" aria-hidden=\"true\"><sc-for list=\"{{ rm.ladder }}\" as=\"ls\"><i data-st=\"{{ ls.st }}\"><\u002Fi><\u002Fsc-for><\u002Fspan><small>{{ rm.attempt }}<\u002Fsmall><\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"cr-wroom-term\">\n                          <div class=\"cr-cli\" data-open=\"{{ rm.termOpen }}\" data-ui=\"RoomTerminal\">\n                            <div class=\"cr-cli-bar\"><span class=\"cr-cli-dots\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan><span class=\"cr-cli-title\">{{ rm.module }} · {{ rm.role }} · attempt {{ rm.attemptShort }}<\u002Fspan><span class=\"cr-cli-live\"><span class=\"cr-pdot\" data-pulse=\"true\" style=\"--dot: var(--cr-pass)\" aria-hidden=\"true\"><\u002Fspan>live<\u002Fspan><\u002Fdiv>\n                            <pre class=\"cr-cli-body\" aria-label=\"Terminal, last lines\"><sc-for list=\"{{ rm.lines }}\" as=\"tl\"><span class=\"cr-cli-line\" data-k=\"{{ tl.k }}\">{{ tl.text }}<\u002Fspan><\u002Fsc-for><\u002Fpre>\n                          <\u002Fdiv>\n                                                  <\u002Fdiv>\n                        <div class=\"cr-wroom-gauges\">\n                          <button type=\"button\" class=\"cr-icon-btn cr-stop-x\" data-ui=\"IconButton\" title=\"Stop room\" aria-label=\"Stop {{ rm.module }}\" sc-camel-on-click=\"{{ rm.askStop }}\" aria-expanded=\"{{ rm.stopOpenStr }}\">{{ ic.square14 }}<\u002Fbutton>\n                                                    <div class=\"cr-gauge\" data-warn=\"{{ rm.timeWarn }}\"><span class=\"cr-gauge-k\">Time<\u002Fspan><span class=\"cr-gauge-v\">{{ rm.timeLabel }}<\u002Fspan><span class=\"cr-bar-track\"><i style=\"width: {{ rm.timePct }}%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n                          <div class=\"cr-gauge-last\" data-stall=\"{{ rm.stall }}\">{{ rm.lastGlyph }}{{ rm.last }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ rm.stopOpen }}\">\n                          <div class=\"cr-stop\" role=\"group\" aria-label=\"Stop this room\">\n                            <label class=\"cr-dc-reason\"><span>Reason <small>overrides are logged with your reason<\u002Fsmall><\u002Fspan><textarea rows=\"2\" value=\"{{ rm.stopReason }}\" sc-camel-on-change=\"{{ rm.onStopReason }}\" placeholder=\"Why stop this attempt?\"><\u002Ftextarea><\u002Flabel>\n                            <div class=\"cr-dc-btns\"><span class=\"cr-stop-note\">The attempt ends now and counts as a failed rung on the retry ladder.<\u002Fspan><button type=\"button\" class=\"av-btn\" data-size=\"sm\" data-variant=\"ghost\" sc-camel-on-click=\"{{ rm.cancelStop }}\">Keep running<\u002Fbutton><button type=\"button\" class=\"av-btn\" data-size=\"sm\" data-variant=\"primary\" disabled=\"{{ rm.stopDisabled }}\" sc-camel-on-click=\"{{ rm.confirmStop }}\">Stop {{ rm.module }}<\u002Fbutton><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Farticle>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ lv.freeN }}\">\n                      <div class=\"cr-free\" role=\"listitem\">\n                        <span class=\"cr-free-k\">{{ lv.freeLabel }}<\u002Fspan>\n                        <span class=\"cr-free-slots\"><sc-for list=\"{{ lv.free }}\" as=\"fr\"><span class=\"cr-free-slot\">{{ fr.n }}<\u002Fspan><\u002Fsc-for><\u002Fspan>\n                                              <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsection>\n                <\u002Fsc-if>\n                <section class=\"lib-card cr-panel\" aria-labelledby=\"lv-q\">\n                  <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"lv-q\">Next in line<\u002Fh2><span class=\"cr-panel-meta\">{{ lv.queueMeta }}<\u002Fspan><\u002Fheader>\n                  <sc-for list=\"{{ lv.queue }}\" as=\"qu\"><div class=\"cr-mini-row\"><span class=\"cr-pdot\" style=\"--dot: {{ qu.dot }}\" aria-hidden=\"true\"><\u002Fspan><span class=\"cr-mini-row-name\"><b>{{ qu.module }}<\u002Fb> {{ qu.project }}<\u002Fspan><span class=\"cr-mini-row-state\">Waiting on {{ qu.waitingOn }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <\u002Fsection>\n                <\u002Fdiv>\n                <sc-if value=\"{{ lv.showRiver }}\">\n                <div class=\"cr-live-side\">\n                <section class=\"lib-card cr-panel cr-river-panel\" aria-labelledby=\"lv-r\" data-ui=\"EventRiver\">\n                  <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"lv-r\">Event river<\u002Fh2><button type=\"button\" class=\"av-btn\" data-size=\"sm\" data-variant=\"secondary\" sc-camel-on-click=\"{{ lv.togglePause }}\">{{ lv.pauseIcon }}{{ lv.pauseLabel }}<\u002Fbutton><\u002Fheader>\n                  <div class=\"cr-river-filters\">\n                    <div class=\"av-chips\" role=\"radiogroup\" aria-label=\"Project\"><sc-for list=\"{{ lv.projChips }}\" as=\"pc\"><button type=\"button\" role=\"radio\" class=\"av-chip\" aria-checked=\"{{ pc.checked }}\" sc-camel-on-click=\"{{ pc.pick }}\"><sc-if value=\"{{ pc.dot }}\"><span class=\"cr-pdot\" style=\"--dot: {{ pc.dot }}\" aria-hidden=\"true\"><\u002Fspan><\u002Fsc-if>{{ pc.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                                      <\u002Fdiv>\n                  <ol class=\"cr-river-list\" sc-camel-on-scroll=\"{{ onRiverScroll }}\">\n                    <sc-for list=\"{{ lv.events }}\" as=\"ev\"><sc-if value=\"{{ ev.day }}\"><li class=\"cr-ev-day\" role=\"presentation\">{{ ev.day }}<\u002Fli><\u002Fsc-if><li class=\"cr-ev\" data-link=\"{{ ev.linked }}\"><time class=\"cr-ev-t\">{{ ev.time }}<\u002Ftime><span class=\"cr-pdot\" style=\"--dot: {{ ev.dot }}\" aria-hidden=\"true\"><\u002Fspan><span class=\"cr-ev-k\">{{ ev.kind }}<\u002Fspan><sc-if value=\"{{ ev.href }}\"><a class=\"cr-ev-text\" href=\"{{ ev.href }}\">{{ ev.text }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ ev.plain }}\"><span class=\"cr-ev-text\">{{ ev.text }}<\u002Fspan><\u002Fsc-if><\u002Fli><\u002Fsc-for>\n                    <sc-if value=\"{{ lv.noEvents }}\"><li class=\"cr-panel-empty\">No events match these filters.<\u002Fli><\u002Fsc-if>\n                  <\u002Fol>\n                <\u002Fsection>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.libSkills }}\">\n              <div class=\"sk\" data-ui=\"SkillLibrary\">\n                <sc-if value=\"{{ lib.sk.index }}\">\n                  <div class=\"sk-entry\">\n                    <button type=\"button\" class=\"sk-card\" sc-camel-on-click=\"{{ lib.sk.write }}\">{{ lib.sk.writeEl }}<b>Write a skill<\u002Fb><span>Start a SKILL.md from blank. Saving opens a factory PR<\u002Fspan><\u002Fbutton>\n                    <button type=\"button\" class=\"sk-card\" sc-camel-on-click=\"{{ lib.sk.discover }}\">{{ lib.sk.discoverEl }}<b>Discover<\u002Fb><span>Browse skills from outside sources. Imports arrive as drafts<\u002Fspan><\u002Fbutton>\n                  <\u002Fdiv>\n                  <input class=\"ro-search sk-search\" type=\"search\" aria-label=\"Filter skills\" placeholder=\"Filter skills\" value=\"{{ lib.sk.q }}\" sc-camel-on-change=\"{{ lib.sk.onQ }}\">\n                  <sc-for list=\"{{ lib.sk.sections }}\" as=\"sc\">\n                    <section class=\"sk-sect\" aria-label=\"{{ sc.label }}\">\n                      <header class=\"sk-sect-h\"><h2>{{ sc.label }}<\u002Fh2><span class=\"sk-count\">{{ sc.count }}<\u002Fspan><p>{{ sc.meaning }}<\u002Fp><\u002Fheader>\n                      <ul class=\"sk-rows\"><sc-for list=\"{{ sc.rows }}\" as=\"sr\"><li><button type=\"button\" class=\"sk-row               <p class=\"sk-desc\">{{ lib.sk.doc.desc }}<\u002Fp>\n                  <div class=\"sk-pin\"><span class=\"sk-pin-k\">Pinned<\u002Fspan><code>{{ lib.sk.doc.pin }}<\u002Fcode><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ lib.sk.doc.copyPin }}\">Copy<\u002Fbutton><\u002Fdiv>\n                  <section class=\"sk-sec\"><h3>Facts<\u002Fh3><dl class=\"ro-facts\"><dt>Type<\u002Fdt><dd>{{ lib.sk.doc.type }}<\u002Fdd><dt>Delivered<\u002Fdt><dd>{{ lib.sk.doc.delivered }}<\u002Fdd><dt>Status<\u002Fdt><dd>{{ lib.sk.doc.statusLabel }}<\u002Fdd><dt>Updated<\u002Fdt><dd>{{ lib.sk.doc.updated }}<\u002Fdd><\u002Fdl><\u002Fsection>\n                  <section class=\"sk-sec\"><div class=\"sk-sec-h\"><h3>Carried by<\u002Fh3><a class=\"ro-link\" href=\"#/roster\">Change in Agents<\u002Fa><\u002Fdiv>\n                    <sc-if value=\"{{ lib.sk.doc.carried.length }}\"><div class=\"sk-chips\"><sc-for list=\"{{ lib.sk.doc.carried }}\" as=\"cb\"><a class=\"sk-chip\" href=\"#/roster\">{{ cb.label }}<\u002Fa><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n                    <sc-if value=\"{{ lib.sk.doc.noCarry }}\"><p class=\"sk-note\">No agent carries it yet<\u002Fp><\u002Fsc-if>\n                  <\u002Fsection>\n                  <section class=\"sk-sec\"><div class=\"sk-sec-h\"><h3>SKILL.md<\u002Fh3><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ lib.sk.doc.copyMd }}\">Copy<\u002Fbutton><\u002Fdiv>\n                    <div class=\"sk-code\" data-ui=\"CodeView\"><sc-for list=\"{{ lib.sk.doc.md }}\" as=\"ml\"><div><i aria-hidden=\"true\">{{ ml.n }}<\u002Fi><span>{{ ml.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fsection>\n                  <section class=\"sk-sec\"><h3>Versions<\u002Fh3><ol class=\"cr-vlist\"><sc-for list=\"{{ lib.sk.doc.history }}\" as=\"hv\"><li><code class=\"cr-sha\">{{ hv.v }}<\u002Fcode><span>{{ hv.note }}<\u002Fspan><small>{{ hv.when }}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Fol><\u002Fsection>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.libTemplates }}\">\n              <div class=\"tp\" data-ui=\"Templates\">\n                <sc-if value=\"{{ lib.tp.index }}\">\n                  <div class=\"tp-bar\">\n                    <div class=\"ro-seg\" role=\"group\" aria-label=\"Scope\"><sc-for list=\"{{ lib.tp.scopes }}\" as=\"so\"><button type=\"button\" aria-pressed=\"{{ so.on }}\" sc-camel-on-click=\"{{ so.pick }}\">{{ so.label }}<span class=\"tp-n\">{{ so.count }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                    <input class=\"ro-search\" type=\"search\" aria-label=\"Search templates by name, slug or scope\" placeholder=\"Search templates\" value=\"{{ lib.tp.q }}\" sc-camel-on-change=\"{{ lib.tp.onQ }}\">\n                    <div class=\"ro-seg tp-view\" role=\"group\" aria-label=\"View\"><sc-for list=\"{{ lib.tp.views }}\" as=\"vo\"><button type=\"button\" aria-pressed=\"{{ vo.on }}\" sc-camel-on-click=\"{{ vo.pick }}\">{{ vo.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ lib.tp.board }}\">\n                    <ul class=\"tp-grid\"><sc-for list=\"{{ lib.tp.cards }}\" as=\"tc\"><li>\n                      <article class=\"tp-card\" aria-label=\"{{ tc.title }}\">\n                        <div class=\"tp-cover\" data-scope=\"{{ tc.scopeId }}\"><span class=\"tp-chip\">{{ tc.scope }}<\u002Fspan><span class=\"tp-chip\">{{ tc.start }}<\u002Fspan><span class=\"tp-commit ro-mono\" title=\"{{ tc.commitFull }}\">{{ tc.commit }}<\u002Fspan><\u002Fdiv>\n                        <div class=\"tp-body\">\n                          <div class=\"tp-id\"><span class=\"sk-mark\" aria-hidden=\"true\">{{ tc.tileEl }}<\u002Fspan><span class=\"tp-id-t\"><h2><button type=\"button\" class=\"tp-title\" sc-camel-on-click=\"{{ tc.open }}\">{{ tc.title }}<\u002Fbutton><\u002Fh2><span class=\"ro-mono\">{{ tc.slug }}<\u002Fspan><\u002Fspan><sc-if value=\"{{ tc.status }}\"><span class=\"av-tag\" data-ui=\"Tag\" data-tone=\"pending\">{{ tc.status }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                          <p>{{ tc.desc }}<\u002Fp>\n                          <dl class=\"tp-run\"><dt>Playbook<\u002Fdt><dd>{{ tc.playbook }}<\u002Fdd><dt>Team<\u002Fdt><dd>{{ tc.team }}<\u002Fdd><\u002Fdl>\n                        <\u002Fdiv>\n                        <footer class=\"tp-foot\"><span>{{ tc.missions }}<\u002Fspan><span>Updated {{ tc.updated }}<\u002Fspan><\u002Ffooter>\n                      <\u002Farticle>\n                    <\u002Fli><\u002Fsc-for><\u002Ful>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ lib.tp.table }}\">\n                    <section class=\"lib-card cr-panel tp-table\" aria-label=\"Templates\"><div class=\"tp-tr tp-th\"><span>Template<\u002Fspan><span>Scope<\u002Fspan><span>Starts as<\u002Fspan><span>Projects<\u002Fspan><span>Commit<\u002Fspan><\u002Fdiv>\n                      <sc-for list=\"{{ lib.tp.cards }}\" as=\"tc\"><button type=\"button\" class=\"tp-tr\" sc-camel-on-click=\"{{ tc.open }}\"><span><b>{{ tc.title }}<\u002Fb><small class=\"ro-mono\">{{ tc.slug }}<\u002Fsmall><\u002Fspan><span>{{ tc.scope }}<\u002Fspan><span>{{ tc.start }}<\u002Fspan><span>{{ tc.missionN }}<\u002Fspan><span class=\"ro-mono\">{{ tc.commit }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fsection>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ lib.tp.none }}\"><p class=\"cv-none\">No templates match. <button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ lib.tp.reset }}\">Clear filters<\u002Fbutton><\u002Fp><\u002Fsc-if>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lib.tp.det }}\">\n                  <nav class=\"sk-trail\" aria-label=\"Trail\"><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ lib.tp.back }}\">Templates<\u002Fbutton><span aria-hidden=\"true\">›<\u002Fspan><span>{{ lib.tp.det.title }}<\u002Fspan><\u002Fnav>\n                  <div class=\"tp-cover tp-strip\" data-scope=\"{{ lib.tp.det.scopeId }}\"><span class=\"tp-chip\">{{ lib.tp.det.scope }}<\u002Fspan><span class=\"tp-chip\">{{ lib.tp.det.start }}<\u002Fspan><p>{{ lib.tp.det.sentence }}<\u002Fp><span class=\"tp-commit ro-mono\" title=\"{{ lib.tp.det.commitFull }}\">{{ lib.tp.det.commit }}<\u002Fspan><\u002Fdiv>\n                  <div class=\"tp-det\">\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"tp-man\"><header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"tp-man\">Manifest<\u002Fh2><span class=\"cr-panel-meta ro-mono\">.avel/template.json<\u002Fspan><\u002Fheader>\n                      <dl class=\"ro-facts tp-facts\"><sc-for list=\"{{ lib.tp.det.facts }}\" as=\"fa\"><dt>{{ fa.k }}<\u002Fdt><dd class=\"{{ fa.cls }}\">{{ fa.v }}<\u002Fdd><\u002Fsc-for><\u002Fdl><\u002Fsection>\n                    <section class=\"lib-card cr-panel\" aria-labelledby=\"tp-built\"><header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"tp-built\">Built from it<\u002Fh2><span class=\"cr-panel-meta\">{{ lib.tp.det.missionN }}<\u002Fspan><\u002Fheader>\n                      <ul class=\"tp-built\"><sc-for list=\"{{ lib.tp.det.missions }}\" as=\"bm\"><li><a href=\"{{ bm.href }}\">{{ bm.name }}<\u002Fa><span>{{ bm.state }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful>\n                      <sc-if value=\"{{ lib.tp.det.noMissions }}\"><p class=\"cr-panel-empty\">No project built from it yet<\u002Fp><\u002Fsc-if><\u002Fsection>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.libTable }}\">\n              <div class=\"cr-dash\" data-ui=\"Library\">\n                <div class=\"cr-dash-main\">\n                  <section class=\"lib-card cr-panel\" aria-labelledby=\"lb-h\">\n                    <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"lb-h\">{{ lib.kindLabel }}<\u002Fh2><span class=\"cr-panel-meta cr-grow\">{{ lib.meta }}<\u002Fspan><button type=\"button\" class=\"av-btn\" data-size=\"sm\" data-variant=\"secondary\" sc-camel-on-click=\"{{ runDoctor }}\">{{ ic.plus14 }}{{ lib.newLabel }}<\u002Fbutton><\u002Fheader>\n                    <div class=\"cr-lt\" role=\"table\" aria-labelledby=\"lb-h\">\n                      <div class=\"cr-lt-row cr-lt-headrow\" role=\"row\"><span role=\"columnheader\">Name<\u002Fspan><span role=\"columnheader\">Version<\u002Fspan><span role=\"columnheader\">Status<\u002Fspan><span role=\"columnheader\">Used by<\u002Fspan><span role=\"columnheader\">Updated<\u002Fspan><\u002Fdiv>\n                      <sc-for list=\"{{ lib.rows }}\" as=\"lr\">\n                        <button type=\"button\" class=\"cr-lt-row\" role=\"row\" data-sel=\"{{ lr.sel }}\" aria-pressed=\"{{ lr.sel }}\" sc-camel-on-click=\"{{ lr.pick }}\">\n                          <span role=\"cell\" class=\"cr-lt-name\"><b>{{ lr.name }}<\u002Fb><small>{{ lr.desc }}<\u002Fsmall><\u002Fspan>\n                          <span role=\"cell\" class=\"cr-sha\">{{ lr.version }}<\u002Fspan>\n                          <span role=\"cell\"><span class=\"av-tag\" data-ui=\"Tag\" data-tone=\"{{ lr.statusTone }}\">{{ lr.status }}<\u002Fspan><\u002Fspan>\n                          <span role=\"cell\" class=\"cr-lt-used\">{{ lr.usedBy }}<\u002Fspan>\n                          <span role=\"cell\" class=\"cr-lt-upd\">{{ lr.updated }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsection>\n                <\u002Fdiv>\n                <aside class=\"cr-dash-rail\" aria-label=\"Selected item\">\n                  <sc-if value=\"{{ lib.sel }}\">\n                    <section class=\"lib-card cr-panel cr-pad\" aria-labelledby=\"lb-sel\">\n                      <div class=\"cr-sel-head\"><h2 class=\"cr-panel-title\" id=\"lb-sel\">{{ lib.sel.name }}<\u002Fh2><span class=\"cr-sha\">v{{ lib.sel.version }}<\u002Fspan><\u002Fdiv>\n                      <p class=\"cr-sel-desc\">{{ lib.sel.desc }}<\u002Fp>\n                      <div class=\"cr-sel-k\">Used by<\u002Fdiv>\n                      <div class=\"cr-sel-chips\"><sc-for list=\"{{ lib.sel.usedBy }}\" as=\"u\"><span class=\"av-tag\" data-ui=\"Tag\">{{ u.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                      <div class=\"cr-sel-k\">Versions<\u002Fdiv>\n                      <ol class=\"cr-vlist\"><sc-for list=\"{{ lib.sel.history }}\" as=\"hv\"><li><code class=\"cr-sha\">{{ hv.v }}<\u002Fcode><span>{{ hv.note }}<\u002Fspan><small>{{ hv.when }}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Fol>\n                      <sc-if value=\"{{ lib.sel.pr }}\"><a class=\"cr-sel-pr\" href=\"{{ lib.sel.prHref }}\">{{ ic.pr14 }}Change in factory PR #{{ lib.sel.pr }}<\u002Fa><\u002Fsc-if>\n                      <button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-variant=\"primary\" sc-camel-on-click=\"{{ runDoctor }}\">{{ ic.pr14 }}Propose a change<\u002Fbutton>\n                    <\u002Fsection>\n                  <\u002Fsc-if>\n                  <section class=\"lib-card cr-panel cr-pad\" aria-labelledby=\"lb-how\">\n                    <h2 class=\"cr-panel-title\" id=\"lb-how\">How a change ships<\u002Fh2>\n                    <ol class=\"cr-steps cr-steps-sm\"><li class=\"cr-step\"><span class=\"cr-step-dot\" aria-hidden=\"true\"><\u002Fspan><span class=\"cr-step-name\">You propose a change<\u002Fspan><span class=\"cr-step-what\">It opens a factory PR<\u002Fspan><\u002Fli><li class=\"cr-step\"><span class=\"cr-step-dot\" aria-hidden=\"true\"><\u002Fspan><span class=\"cr-step-name\">The PR merges<\u002Fspan><span class=\"cr-step-what\">A new factory version is cut<\u002Fspan><\u002Fli><li class=\"cr-step\"><span class=\"cr-step-dot\" aria-hidden=\"true\"><\u002Fspan><span class=\"cr-step-name\">New projects pin it<\u002Fspan><span class=\"cr-step-what\">Running projects keep the version they started on<\u002Fspan><\u002Fli><\u002Fol>\n                  <\u002Fsection>\n                <\u002Faside>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.roster }}\">\n              <div class=\"ro\" data-ui=\"AgentRoster\">\n                <sc-if value=\"{{ ro.filed }}\"><div class=\"ro-banner\" role=\"status\">{{ ic.pr14 }}<span><b>PR #{{ ro.filed }} opened<\u002Fb> · waiting for you in Decisions<\u002Fspan><a class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"primary\" href=\"#/\">Open Decisions<\u002Fa><\u002Fdiv><\u002Fsc-if>\n                <sc-if value=\"{{ ro.openPr }}\"><div class=\"ro-banner\" role=\"status\">{{ ic.pr14 }}<span><b>PR #{{ ro.openPr.number }} is open<\u002Fb> · {{ ro.openPr.title }}<\u002Fspan><a class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"secondary\" href=\"#/\">Review in Decisions<\u002Fa><\u002Fdiv><\u002Fsc-if>\n\n                <div class=\"ro-top\">\n                  <p class=\"ro-sum\"><b>16 agents<\u002Fb> in 5 teams<span aria-hidden=\"true\">·<\u002Fspan><span class=\"ro-mono\">{{ ro.version }}<\u002Fspan><span aria-hidden=\"true\">·<\u002Fspan>last changed by PR #{{ ro.lastPr }} on {{ ro.lastAt }}<\u002Fp>\n                  <sc-if value=\"{{ ro.viewing }}\"><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-variant=\"primary\" sc-camel-on-click=\"{{ ro.startEdit }}\">Change the roster<\u002Fbutton><\u002Fsc-if>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ ro.draft }}\">\n                  <div class=\"ro-draft\" role=\"status\" data-err=\"{{ ro.draft.err }}\" data-ui=\"DraftBar\">\n                    <span class=\"ro-draft-t\"><b>Draft on {{ ro.version }}<\u002Fb> · {{ ro.draft.text }}<sc-if value=\"{{ ro.draft.err }}\"><span class=\"ro-draft-err\">{{ ro.draft.err }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                    <button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"ghost\" sc-camel-on-click=\"{{ ro.discard }}\">Discard<\u002Fbutton>\n                    <button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"primary\" sc-camel-on-click=\"{{ ro.toReview }}\" disabled=\"{{ ro.draft.blocked }}\">Review changes<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ ro.review }}\">\n                  <section class=\"lib-card cr-panel ro-review\" aria-labelledby=\"ro-rv\" data-ui=\"RosterReview\">\n                    <header class=\"cr-panel-head\"><h2 class=\"cr-panel-title\" id=\"ro-rv\">{{ ro.review.title }}<\u002Fh2><span class=\"cr-panel-meta\">{{ ro.review.meta }}<\u002Fspan><\u002Fheader>\n                    <sc-if value=\"{{ ro.review.stale }}\">\n                      <div class=\"ro-stale\"><p><b>The roster changed since you opened it.<\u002Fb> PR #{{ ro.review.newerPr }} landed {{ ro.review.newerV }}. Your draft is kept. Check the newer change, then reapply.<\u002Fp>\n                        <ul class=\"ro-diff\"><sc-for list=\"{{ ro.review.newer }}\" as=\"nl\"><li><b>{{ ro.review.newerV }}<\u002Fb><span class=\"ro-diff-new\">{{ nl.text }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <ul class=\"ro-diff\"><sc-for list=\"{{ ro.review.changes }}\" as=\"ch\"><li><b>{{ ch.what }}<\u002Fb><span class=\"ro-diff-old\">− {{ ch.from }}<\u002Fspan><span class=\"ro-diff-new\">+ {{ ch.to }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful>\n                    <div class=\"ro-inflight\"><h3>In-flight projects keep the version they started on<\u002Fh3>\n                      <ul><sc-for list=\"{{ ro.review.inflight }}\" as=\"fl\"><li><span>{{ fl.mission }}<\u002Fspan><span class=\"ro-muted\">{{ fl.state }}<\u002Fspan><span class=\"ro-mono\">{{ fl.version }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n                    <footer class=\"ro-review-foot\"><span class=\"ro-review-warn\">{{ ro.review.warn }}<\u002Fspan><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-variant=\"secondary\" sc-camel-on-click=\"{{ ro.review.back }}\" disabled=\"{{ ro.review.busy }}\">Back to editing<\u002Fbutton><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-variant=\"primary\" sc-camel-on-click=\"{{ ro.review.file }}\" disabled=\"{{ ro.review.busy }}\">{{ ro.review.fileLabel }}<\u002Fbutton><\u002Ffooter>\n                  <\u002Fsection>\n                <\u002Fsc-if>\n\n                <section class=\"lib-card cr-panel ro-canvas\" aria-label=\"Team canvas\" data-ui=\"RosterCanvas\">\n                  <div class=\"ro-bar\">\n                    <div class=\"ro-who\" data-ui=\"WhoGetsThis\">\n                      <span class=\"ro-who-k\">Who gets this?<\u002Fspan>\n                      <sc-raw-select class=\"av-select ro-select\" aria-label=\"Work kind\" value=\"{{ ro.lk.kind }}\" sc-camel-on-change=\"{{ ro.lk.onKind }}\"><sc-for list=\"{{ ro.lk.kinds }}\" as=\"op\"><option value=\"{{ op.v }}\">{{ op.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                      <sc-raw-select class=\"av-select ro-select\" aria-label=\"Role\" value=\"{{ ro.lk.role }}\" sc-camel-on-change=\"{{ ro.lk.onRole }}\"><sc-for list=\"{{ ro.lk.roles }}\" as=\"op\"><option value=\"{{ op.v }}\">{{ op.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ ro.lk.shown }}\"><p class=\"ro-answer\" role=\"status\"><sc-if value=\"{{ ro.lk.na }}\">{{ ro.lk.na }}<\u002Fsc-if><sc-if value=\"{{ ro.lk.ok }}\"><b>{{ ro.lk.who }}<\u002Fb> {{ ro.lk.verb }}<span aria-hidden=\"true\">·<\u002Fspan><b>{{ ro.lk.rev }}<\u002Fb> reviews<span aria-hidden=\"true\">·<\u002Fspan><b>{{ ro.lk.ruler }}<\u002Fb> rules disputes<\u002Fsc-if><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ ro.lk.clear }}\">Clear<\u002Fbutton><\u002Fp><\u002Fsc-if>\n                  <div class=\"ro-stage\" data-open=\"{{ ro.hasSel }}\">\n                    <div class=\"ro-ground\">\n                      <div class=\"ro-lanes\">\n                        {{ ro.edgesEl }}\n                        <sc-for list=\"{{ ro.lanes }}\" as=\"ln\">\n                          <div class=\"ro-lane\">\n                            <h3 class=\"ro-lane-h\"><span>{{ ln.label }}<\u002Fspan><small>{{ ln.note }}<\u002Fsmall><\u002Fh3>\n                            <sc-for list=\"{{ ln.agents }}\" as=\"nd\">\n                              <button type=\"button\" class=\"ro-node\" data-agent=\"{{ nd.name }}\" data-kind=\"{{ nd.kind }}\" data-st=\"{{ nd.st }}\" data-rel=\"{{ nd.rel }}\" data-dim=\"{{ nd.dim }}\" data-ping=\"{{ nd.ping }}\" data-changed=\"{{ nd.changed }}\" aria-pressed=\"{{ nd.sel }}\" sc-camel-on-click=\"{{ nd.pick }}\">\n                                <span class=\"ro-node-head\"><span class=\"ro-tile\" data-kind=\"{{ nd.kind }}\" aria-hidden=\"true\">{{ nd.mono }}<\u002Fspan><span class=\"ro-node-id\"><b>{{ nd.name }}<\u002Fb><small>{{ nd.kindWord }}<\u002Fsmall><\u002Fspan><span class=\"ro-st\" data-st=\"{{ nd.st }}\"><i aria-hidden=\"true\"><\u002Fi>{{ nd.stLabel }}<\u002Fspan><\u002Fspan>\n                                <sc-if value=\"{{ nd.rel }}\"><span class=\"ro-rel\">{{ nd.rel }}<\u002Fspan><\u002Fsc-if>\n                                <span class=\"ro-slots\"><sc-for list=\"{{ nd.slots }}\" as=\"sl\"><span class=\"ro-slot\">{{ sl.label }}<\u002Fspan><\u002Fsc-for><\u002Fspan>\n                                \n                                <sc-if value=\"{{ nd.line }}\"><span class=\"ro-line\"><span aria-hidden=\"true\">›<\u002Fspan>{{ nd.line }}<\u002Fspan><\u002Fsc-if>\n                              <\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n        <\u002Fsc-if>\n                        <sc-if value=\"{{ ro.det.editing }}\">\n                          <div class=\"ro-edit\">\n                            <label class=\"ro-field\"><span>Model<\u002Fspan><sc-raw-select class=\"av-select ro-select\" value=\"{{ ro.det.model }}\" sc-camel-on-change=\"{{ ro.det.onModel }}\"><sc-for list=\"{{ ro.det.modelOpts }}\" as=\"op\"><option value=\"{{ op.v }}\">{{ op.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n                            <div class=\"ro-field\"><span>Effort<\u002Fspan><div class=\"ro-seg\" role=\"group\" aria-label=\"Effort\"><sc-for list=\"{{ ro.det.effOpts }}\" as=\"eo\"><button type=\"button\" aria-pressed=\"{{ eo.on }}\" sc-camel-on-click=\"{{ eo.pick }}\">{{ eo.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n                            <sc-for list=\"{{ ro.det.kinds }}\" as=\"kd\">\n                              <label class=\"ro-field\" data-err=\"{{ kd.err }}\"><span><span class=\"ro-mono\">{{ kd.kind }}<\u002Fspan> goes to<\u002Fspan><sc-raw-select class=\"av-select ro-select\" aria-invalid=\"{{ kd.invalid }}\" value=\"{{ kd.value }}\" sc-camel-on-change=\"{{ kd.onPick }}\"><sc-for list=\"{{ kd.opts }}\" as=\"op\"><option value=\"{{ op.v }}\">{{ op.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><sc-if value=\"{{ kd.err }}\"><small class=\"ro-field-err\">{{ kd.err }}<\u002Fsmall><\u002Fsc-if><\u002Flabel>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <div class=\"ro-skills\" data-ui=\"AgentSkills\">\n                          <div class=\"ro-skills-h\"><b>Skills<\u002Fb><span>{{ ro.det.skillCount }}<\u002Fspan><a class=\"ro-link\" href=\"#/library/skills\">Open Library<\u002Fa><\u002Fdiv>\n                          <ul class=\"ro-skill-list\"><sc-for list=\"{{ ro.det.skillRows }}\" as=\"sk\"><li data-new=\"{{ sk.isNew }}\"><span class=\"ro-mono\">{{ sk.name }}<\u002Fspan><small>{{ sk.meta }}<\u002Fsmall><sc-if value=\"{{ ro.det.editing }}\"><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ sk.detach }}\">Detach<\u002Fbutton><\u002Fsc-if><\u002Fli><\u002Fsc-for><\u002Ful>\n                          <sc-if value=\"{{ ro.det.noSkills }}\"><p class=\"ro-skill-none\">No skills attached<\u002Fp><\u002Fsc-if>\n                          <sc-if value=\"{{ ro.det.reading }}\"><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-size=\"sm\" data-variant=\"secondary\" sc-camel-on-click=\"{{ ro.det.addSkill }}\">Add a skill<\u002Fbutton><\u002Fsc-if>\n                          <sc-if value=\"{{ ro.det.editing }}\">\n                            <h4 class=\"ro-ref-h\">Add from Library<\u002Fh4>\n                            <ul class=\"ro-skill-list\"><sc-for list=\"{{ ro.det.skillAvail }}\" as=\"sk\"><li><span class=\"ro-mono\">{{ sk.name }}<\u002Fspan><small>{{ sk.meta }}<\u002Fsmall><button type=\"button\" class=\"ro-link\" sc-camel-on-click=\"{{ sk.attach }}\" disabled=\"{{ sk.off }}\">Attach<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <dl class=\"ro-facts\"><dt>Prompt<\u002Fdt><dd class=\"ro-mono\">{{ ro.det.prompt }}<\u002Fdd><dt>Reviewed by<\u002Fdt><dd>{{ ro.det.reviewedBy }}<\u002Fdd><dt>Disputes go to<\u002Fdt><dd>{{ ro.det.ruler }}<\u002Fdd><\u002Fdl>\n                        <sc-if value=\"{{ ro.det.neverBuilds }}\"><span class=\"ro-never\">Never builds<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ ro.det.pr }}\"><a class=\"ro-link\" href=\"#/\">{{ ro.det.pr }}<\u002Fa><\u002Fsc-if>\n                      <\u002Faside>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <footer class=\"ro-foot\"><span class=\"ro-ticker\" aria-live=\"off\"><i aria-hidden=\"true\"><\u002Fi><b>{{ ro.tick.who }}<\u002Fb> {{ ro.tick.text }}<span class=\"ro-muted\">{{ ro.tick.age }}<\u002Fspan><\u002Fspan><span class=\"ro-legend\"><span data-k=\"rev\">reviews<\u002Fspan><span data-k=\"rule\">rules disputes<\u002Fspan><\u002Fspan><\u002Ffooter>\n                <\u002Fsection>\n\n                <section class=\"lib-card cr-panel ro-ref\" aria-label=\"Reference\" data-ui=\"RosterReference\">\n                  <button type=\"button\" class=\"ro-ref-row\" aria-expanded=\"{{ ro.ref.map.open }}\" sc-camel-on-click=\"{{ ro.ref.map.toggle }}\"><b>Slot map<\u002Fb><span>Which agent takes each work kind and role, and who settles disputes<\u002Fspan><i aria-hidden=\"true\">{{ ro.ref.map.sign }}<\u002Fi><\u002Fbutton>\n                  <sc-if value=\"{{ ro.ref.map.on }}\"><div class=\"ro-ref-body\"><div class=\"ro-maps\"><sc-for list=\"{{ ro.maps }}\" as=\"mp\"><div><h3 class=\"ro-ref-h\">{{ mp.title }}<\u002Fh3><ul class=\"ro-map\"><sc-for list=\"{{ mp.rows }}\" as=\"mr\"><li><span class=\"ro-mono\">{{ mr.k }}<\u002Fspan><span>{{ mr.v }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n                  <button type=\"button\" class=\"ro-ref-row\" aria-expanded=\"{{ ro.ref.flow.open }}\" sc-camel-on-click=\"{{ ro.ref.flow.toggle }}\"><b>How work moves<\u002Fb><span>Contracts to Gate 5, and what limits parallel work<\u002Fspan><i aria-hidden=\"true\">{{ ro.ref.flow.sign }}<\u002Fi><\u002Fbutton>\n                  <sc-if value=\"{{ ro.ref.flow.on }}\"><div class=\"ro-ref-body\">\n                    <ol class=\"ro-flow\"><sc-for list=\"{{ ro.flow }}\" as=\"fs\"><li data-here=\"{{ fs.here }}\" data-live=\"{{ fs.live }}\"><span class=\"ro-flow-n\">{{ fs.n }}<\u002Fspan><b>{{ fs.title }}<\u002Fb><span>{{ fs.who }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol>\n                    <ul class=\"ro-limits\"><li><b>Slots<\u002Fb>6 rooms at once<\u002Fli><li><b>Dependencies<\u002Fb>a module waits for what it needs<\u002Fli><li><b>Locks<\u002Fb>tests are locked before the build<\u002Fli><li><b>Territories<\u002Fb>no shared files<\u002Fli><li><b>Integration<\u002Fb>one module at a time<\u002Fli><\u002Ful>\n                  <\u002Fdiv><\u002Fsc-if>\n                  <button type=\"button\" class=\"ro-ref-row\" aria-expanded=\"{{ ro.ref.rules.open }}\" sc-camel-on-click=\"{{ ro.ref.rules.toggle }}\"><b>Rules<\u002Fb><span>Six rules every slot follows<\u002Fspan><i aria-hidden=\"true\">{{ ro.ref.rules.sign }}<\u002Fi><\u002Fbutton>\n                  <sc-if value=\"{{ ro.ref.rules.on }}\"><div class=\"ro-ref-body\"><ul class=\"ro-rules\">\n                    <li><h3>Code assigns agents, never a model<\u002Fh3><p>Work goes to the agent for its work kind and role<\u002Fp><\u002Fli>\n                    <li><h3>No work grades itself<\u002Fh3><p>A builder never tests or reviews the kinds it builds<\u002Fp><\u002Fli>\n                    <li><h3>Contracts come first<\u002Fh3><p>Zero and Axis write the contract before anyone builds<\u002Fp><\u002Fli>\n                    <li><h3>Contract changes have a path<\u002Fh3><p>Additive changes go through the lead and Brennan. Breaking ones come to you as a proposal<\u002Fp><\u002Fli>\n                    <li><h3>Every finding cites evidence<\u002Fh3><p>A file, a line, a failing test or a trace<\u002Fp><\u002Fli>\n                    <li><h3>An agent is a setup<\u002Fh3><p>A model, role skills, a prompt and an effort level<\u002Fp><\u002Fli>\n                  <\u002Ful><\u002Fdiv><\u002Fsc-if>\n                  <button type=\"button\" class=\"ro-ref-row\" aria-expanded=\"{{ ro.ref.open.open }}\" sc-camel-on-click=\"{{ ro.ref.open.toggle }}\"><b>Still to decide<\u002Fb><span>{{ ro.openCount }} open items<\u002Fspan><i aria-hidden=\"true\">{{ ro.ref.open.sign }}<\u002Fi><\u002Fbutton>\n                  <sc-if value=\"{{ ro.ref.open.on }}\"><ul class=\"ro-open\"><sc-for list=\"{{ ro.open }}\" as=\"oi\"><li><span>{{ oi.text }}<\u002Fspan><a class=\"ro-link\" href=\"#/\">Decide<\u002Fa><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsc-if>\n                <\u002Fsection>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.generic }}\">\n              <div class=\"cr-stage\">\n                <div class=\"av-state\" data-ui=\"WidgetState\" data-state=\"empty\">\n                  <span class=\"av-state-icon\">{{ es.iconEl }}<\u002Fspan>\n                  <h2 class=\"av-state-title\">{{ es.title }}<\u002Fh2>\n                  <p class=\"av-state-msg\">{{ es.msg }}<\u002Fp>\n                  <sc-if value=\"{{ es.hasActions }}\"><div class=\"av-state-actions\"><sc-for list=\"{{ es.actions }}\" as=\"a\"><button type=\"button\" class=\"av-btn\" data-ui=\"Button\" data-variant=\"{{ a.variant }}\" sc-camel-on-click=\"{{ a.onClick }}\">{{ a.iconEl }}{{ a.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ L.filtered }}\">\n              <div class=\"av-filters\" role=\"search\" data-ui=\"FilterBar\">\n                <label class=\"av-filter-search\">{{ ic.search14 }}<input type=\"search\" placeholder=\"Search projects\" aria-label=\"Search projects\"><\u002Flabel>\n                <div role=\"radiogroup\" aria-label=\"State\" class=\"av-chips\">\n                  <button type=\"button\" role=\"radio\" aria-checked=\"false\" class=\"av-chip\">All<\u002Fbutton>\n                  <button type=\"button\" role=\"radio\" aria-checked=\"false\" class=\"av-chip\">Running<\u002Fbutton>\n                  <button type=\"button\" role=\"radio\" aria-checked=\"false\" class=\"av-chip\">Onboarding<\u002Fbutton>\n                  <button type=\"button\" role=\"radio\" aria-checked=\"true\" class=\"av-chip\">Awaiting release<\u002Fbutton>\n                  <button type=\"button\" role=\"radio\" aria-checked=\"false\" class=\"av-chip\">Delivered<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-raw-select class= v class=\"cr-dock-row\">\n          <span class=\"cr-dock-k\">Event stream<\u002Fspan>\n          <div role=\"radiogroup\" aria-label=\"Event stream\" class=\"lib-seg\"><sc-for list=\"{{ dockStream }}\" as=\"s\"><button type=\"button\" role=\"radio\" class=\"lib-seg-btn\" aria-checked=\"{{ s.checked }}\" sc-camel-on-click=\"{{ s.pick }}\">{{ s.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" role=\"switch\" class=\"cr-switch\" data-ui=\"Switch\" aria-checked=\"{{ specExpanded }}\" sc-camel-on-click=\"{{ toggleSpec }}\"><span class=\"cr-switch-track\" aria-hidden=\"true\"><\u002Fspan>Show behind this screen<\u002Fbutton>\n        <button type=\"button\" role=\"switch\" class=\"cr-switch\" data-ui=\"Switch\" aria-checked=\"{{ gapsChecked }}\" sc-camel-on-click=\"{{ toggleGaps }}\"><span class=\"cr-switch-track\" aria-hidden=\"true\"><\u002Fspan>Outline fields not in the contract<\u002Fbutton>\n        <sc-if value=\"{{ notFrame }}\">\n          <div class=\"cr-dock-row\">\n            <span class=\"cr-dock-k\">Preview at<\u002Fspan>\n            <div class=\"cr-dock-chips\"><sc-for list=\"{{ dockVp }}\" as=\"v\"><button type=\"button\" class=\"av-chip\" sc-camel-on-click=\"{{ v.pick }}\">{{ v.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button type=\"button\" class=\"cr-dock-toggle\" aria-expanded=\"{{ dockExpanded }}\" sc-camel-on-click=\"{{ toggleDock }}\">{{ ic.sliders14 }}Prototype<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vp }}\">\n  <div class=\"cr-vp\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Viewport preview\">\n    <div class=\"cr-vp-bar\">\n      <span>{{ vp.label }}, {{ vp.w }} px<\u002Fspan>\n      <div class=\"cr-dock-chips\"><sc-for list=\"{{ dockVp }}\" as=\"v\"><button type=\"button\" class=\"av-chip\" aria-checked=\"{{ v.checked }}\" sc-camel-on-click=\"{{ v.pick }}\">{{ v.shor
