<style>
/* Layout idea: a drafting-table map. Domains are labelled zones on a pannable sheet; one table is lit at a
   time with its parents and children, and its full spec opens in a side sheet (a bottom sheet on phones). */
:root {
  --paper: #f4f5f1;
  --sheet: #ffffff;
  --ink: #17201c;
  --ink-2: #57625c;
  --rule: #d9ddd5;
  --accent: #1f6f5c;
  --accent-2: #b4532a;
  --accent-wash: rgba(31, 111, 92, 0.10);
  --warn: #a8641a;
  --bad: #b23a3a;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --sheet: #1a201d; --ink: #e6ebe7; --ink-2: #9aa79f; --rule: #2e3732;
    --accent: #5cc7a8; --accent-2: #e8885e; --accent-wash: rgba(92, 199, 168, 0.14);
    --warn: #e0a85a; --bad: #ef7a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --sheet: #1a201d; --ink: #e6ebe7; --ink-2: #9aa79f; --rule: #2e3732;
  --accent: #5cc7a8; --accent-2: #e8885e; --accent-wash: rgba(92, 199, 168, 0.14);
  --warn: #e0a85a; --bad: #ef7a7a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-body); display: grid;
  grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px;
  border-bottom: 1px solid var(--rule); background: var(--sheet); }
h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px;
  font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper); color: var(--ink); width: 200px; }
button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule);
  background: var(--sheet); color: var(--ink); cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible, .card:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr; }
#stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; }
.zone rect { fill: var(--sheet); stroke: var(--rule); }
.zone text.zl { font: 600 13px var(--font-body); fill: var(--ink-2); letter-spacing: 0.02em; text-transform: uppercase; }
.card rect { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.card text { font: 500 12.5px var(--font-mono); fill: var(--ink); }
.card text.meta { font: 400 10.5px var(--font-body); fill: var(--ink-2); }
.card { cursor: pointer; }
.card:hover rect { stroke: var(--accent); }
.card.dim { opacity: 0.22; }
.card.sel rect { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 2; }
.card.parent rect { stroke: var(--accent); stroke-width: 1.5; }
.card.child rect { stroke: var(--accent-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.card.hit rect { stroke: var(--warn); stroke-width: 2; }
.card.spine rect { stroke: var(--accent); stroke-width: 1.5; }
.edge { fill: none; stroke-width: 1.4; }
.edge.out { stroke: var(--accent); }
.edge.in { stroke: var(--accent-2); stroke-dasharray: 5 4; }
.edge.faint { stroke: var(--ink-2); opacity: 0.18; stroke-width: 0.8; }
.edge.spine { stroke: var(--accent); stroke-width: 2.2; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend i.in { border-top: 2px dashed var(--accent-2); }
.hint { position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--ink-2); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
aside#panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 46vw); background: var(--sheet);
  border-left: 1px solid var(--rule); overflow: auto; padding: 18px 20px 40px; transform: translateX(102%);
  transition: transform 0.18s ease; }
aside#panel.open { transform: none; }
@media (prefers-reduced-motion: reduce) { aside#panel { transition: none; } }
@media (max-width: 760px) {
  aside#panel { width: 100%; top: auto; height: 62%; border-left: 0; border-top: 1px solid var(--rule);
    border-radius: 14px 14px 0 0; transform: translateY(104%); }
  input[type="search"] { width: 150px; }
  .legend, .hint { display: none; }
}
.ph { display: flex; align-items: start; gap: 10px; }
.ph h2 { font: 600 18px var(--font-mono); margin: 0; word-break: break-word; flex: 1; }
.ph button { flex: none; }
.dom { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 8px; }
.desc { margin: 0 0 14px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); }
.chip.ok { border-color: var(--accent); color: var(--accent); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); margin: 20px 0 8px;
  border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
h3 .n { font-variant-numeric: tabular-nums; font-weight: 400; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 4px 6px; border-bottom: 1px solid var(--rule); }
td { padding: 5px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.m, code { font-family: var(--font-mono); font-size: 12px; }
.req { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--accent-wash); color: var(--accent); white-space: nowrap; }
.opt { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px dashed var(--rule); color: var(--ink-2); white-space: nowrap; }
.key { font-size: 10.5px; font-weight: 600; color: var(--accent-2); margin-left: 4px; }
a.tl { color: var(--accent); text-decoration: none; font-family: var(--font-mono); cursor: pointer; }
a.tl:hover { text-decoration: underline; }
.rule { padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--paper); margin: 6px 0; border-radius: 0 6px 6px 0; }
.rule .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); display: block; margin-bottom: 2px; }
.sql { font-family: var(--font-mono); font-size: 12px; background: var(--paper); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 8px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
.sql .nm { display: block; color: var(--ink-2); font-size: 11px; margin-bottom: 2px; }
.del { font-weight: 600; font-size: 11px; }
.del.RESTRICT { color: var(--accent); } .del.CASCADE { color: var(--bad); } .del.NO.ACTION { color: var(--warn); }
.empty { color: var(--ink-2); font-size: 12.5px; }
.foot { margin-top: 24px; font-size: 11.5px; color: var(--ink-2); }
</style>
</head>

const byName = new Map(ERD.tables.map(t => [t.name, t]));
const children = new Map(ERD.tables.map(t => [t.name, []]));
for (const t of ERD.tables) for (const fk of t.foreignKeys) children.get(fk.parent)?.push({ child: t.name, fk });

// ---------- header stats ----------
const s = ERD.stats;
document.getElementById("stats").innerHTML =
  `<span><b>${s.tables}</b> tables</span><span><b>${s.foreignKeys}</b> links</span><span><b>${s.checks}</b> checks</span>` +
  `<span><b>${s.uniques}</b> one-at-a-time rules</span><span><b>${s.indexes}</b> indexes</span>`;

// ---------- layout: domains as zones in a 3-column masonry, tables as cards inside ----------
const CW = 196, CH = 40, GX = 12, GY = 10, PAD = 16, HEAD = 34, ZG = 28;
const order = ERD.domains.map(d => d.name);
for (const t of ERD.tables) if (!order.includes(t.domain)) order.push(t.domain);
const zones = order.map(name => ({ name, tables: ERD.tables.filter(t => t.domain === name) })).filter(z => z.tables.length);
const COLS = 3, colH = Array.from({ length: COLS }, () => 0);
const pos = new Map();
for (const z of zones) {
  const per = z.tables.length > 8 ? 3 : 2;
  const rows = Math.ceil(z.tables.length / per);
  z.w = PAD * 2 + per * CW + (per - 1) * GX; z.h = HEAD + PAD + rows * CH + (rows - 1) * GY;
  z.per = per;
}
// place widest zones first in the shortest column
const colX = [0, 0, 0];
const colW = Math.max(...zones.map(z => z.w));
for (let i = 0; i < COLS; i++) colX[i] = i * (colW + ZG);
for (const z of zones) {
  let c = 0; for (let i = 1; i < COLS; i++) if (colH[i] < colH[c]) c = i;
  z.x = colX[c]; z.y = colH[c]; colH[c] += z.h + ZG;
  z.tables.forEach((t, i) => {
    const cx = z.x + PAD + (i % z.per) * (CW + GX), cy = z.y + HEAD + Math.floor(i / z.per) * (CH + GY);
    pos.set(t.name, { x: cx, y: cy });
  });
}
const W = COLS * colW + (COLS - 1) * ZG, H = Math.max(...colH);

// ---------- draw ----------
const vp = document.getElementById("vp");
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent?.appendChild(n); return n; };
const edgeLayer = el("g", {}, null);
for (const z of zones) {
  const g = el("g", { class: "zone" }, vp);
  el("rect", { x: z.x, y: z.y, width: z.w, height: z.h, rx: 10 }, g);
  const tx = el("text", { x: z.x + PAD, y: z.y + 22, class: "zl" }, g); tx.textContent = z.name;
}
vp.appendChild(edgeLayer);
const cardEl = new Map();
for (const t of ERD.tables) {
  const p = pos.get(t.name);
  const g = el("g", { class: "card", tabindex: 0, role: "button", "aria-label": t.name, transform: `translate(${p.x},${p.y})` }, vp);
  el("rect", { width: CW, height: CH, rx: 6 }, g);
  const a = el("text", { x: 10, y: 17 }, g); a.textContent = t.name.length > 24 ? t.name.slice(0, 23) + "…" : t.name;
  const fkOut = t.foreignKeys.length, fkIn = children.get(t.name).length;
  const b = el("text", { x: 10, y: 32, class: "meta" }, g);
  b.textContent = `${t.columns.length} cols · ${fkOut} out · ${fkIn} in · ${t.checks.length} checks`;
  g.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) select(t.name); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(t.name); } });
  cardEl.set(t.name, g);
}
function edgePath(from, to) {
  const a = pos.get(from), b = pos.get(to);
  const ax = a.x + CW / 2, ay = a.y + CH / 2, bx = b.x + CW / 2, by = b.y + CH / 2;
  const sx = bx >= ax ? a.x + CW : a.x, tx = bx >= ax ? b.x : b.x + CW;
  if (Math.abs(bx - ax) < CW) { // same column: arc out to the side
    const side = a.x + CW, bend = 46 + Math.min(120, Math.abs(by - ay) / 6);
    return `M${side} ${ay} C${side + bend} ${ay} ${b.x + CW + bend} ${by} ${b.x + CW} ${by}`;
  }
  const mx = (sx + tx) / 2;
  return `M${sx} ${ay} C${mx} ${ay} ${mx} ${by} ${tx} ${by}`;
}
function drawEdges(list) {
  edgeLayer.replaceChildren();
  for (const e of list) el("path", { d: edgePath(e.from, e.to), class: "edge " + e.cls }, edgeLayer);
}

// ---------- pan and zoom (mouse, wheel, touch pinch) ----------
const stage = document.getElementById("stage"), svg = document.getElementById("map");
let view = { x: 0, y: 0, k: 1 }, moved = false;
const apply = () => vp.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
function fit() {
  const r = stage.getBoundingClientRect(); const m = 24;
  const k = Math.min((r.width - 2 * m) / W, (r.height - 2 * m) / H);
  view = { k, x: (r.width - W * k) / 2, y: m }; apply();
}
function zoomAt(cx, cy, f) {
  const k = Math.min(3, Math.max(0.15, view.k * f)); const r = k / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; apply();
}
stage.addEventListener("wheel", ev => { ev.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * 0.0015)); }, { passive: false });
const pts = new Map(); let last = null, pinch = null;
stage.addEventListener("pointerdown", ev => { pts.set(ev.pointerId, ev); moved = false;
  if (pts.size === 1) last = { x: ev.clientX, y: ev.clientY };
  if (pts.size === 2) { const [p, q] = [...pts.values()]; pinch = Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY); } });
stage.addEventListener("pointermove", ev => { if (!pts.has(ev.pointerId)) return; pts.set(ev.pointerId, ev);
  if (pts.size === 2) { const [p, q] = [...pts.values()]; const d = Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY);
    const r = stage.getBoundingClientRect(); zoomAt((p.clientX + q.clientX) / 2 - r.left, (p.clientY + q.clientY) / 2 - r.top, d / pinch); pinch = d; moved = true; return; }
  if (last) { const dx = ev.clientX - last.x, dy = ev.clientY - last.y; if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; stage.classList.add("dragging"); }
    if (moved && !stage.hasPointerCapture(ev.pointerId)) stage.setPointerCapture(ev.pointerId);
    view.x += dx; view.y += dy; last = { x: ev.clientX, y: ev.clientY }; apply(); } });
const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { last = null; stage.classList.remove("dragging"); } };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
svg.addEventListener("click", () => { if (!moved) clearSel(); });
document.getElementById("fitBtn").addEventListener("click", fit);
window.addEventListener("resize", fit);

// ---------- selection ----------
let selected = null, showAll = false, showSpine = false;
function classes(fn) { for (const [n, g] of cardEl) { g.classList.remove("sel", "parent", "child", "dim", "hit", "spine"); fn(n, g); } }
function baseEdges() {
  if (showSpine) { const l = []; for (let i = 0; i < SPINE.length - 1; i++) if (pos.has(SPINE[i]) && pos.has(SPINE[i + 1])) l.push({ from: SPINE[i + 1], to: SPINE[i], cls: "spine" }); return l; }
  if (showAll) return ERD.tables.flatMap(t => t.foreignKeys.filter(f => pos.has(f.parent) && f.parent !== t.name).map(f => ({ from: t.name, to: f.parent, cls: "faint" })));
  return [];
}
function clearSel() {
  selected = null; document.getElementById("panel").classList.remove("open");
  classes((n, g) => { if (showSpine) g.classList.add(SPINE.includes(n) ? "spine" : "dim"); });
  drawEdges(baseEdges()); if (location.hash) history.replaceState(null, "", " ");
}
function select(name) {
  const t = byName.get(name); if (!t) return; selected = name;
  const parents = new Set(t.foreignKeys.map(f => f.parent)), kids = new Set(children.get(name).map(c => c.child));
  classes((n, g) => g.classList.add(n === name ? "sel" : parents.has(n) ? "parent" : kids.has(n) ? "child" : "dim"));
  const edges = [...baseEdges().filter(e => e.cls === "faint"),
    ...[...parents].filter(p => p !== name).map(p => ({ from: name, to: p, cls: "out" })),
    ...[...kids].filter(c => c !== name).map(c => ({ from: c, to: name, cls: "in" }))];
  drawEdges(edges); renderPanel(t); reveal(name);
  if (location.hash !== "#" + name.replace(/_/g, "-")) history.replaceState(null, "", "#" + name.replace(/_/g, "-"));
}
document.getElementById("allBtn").addEventListener("click", e => { showAll = !showAll; e.currentTarget.setAttribute("aria-pressed", showAll); selected ? select(selected) : clearSel(); });
document.getElementById("spineBtn").addEventListener("click", e => { showSpine = !showSpine; e.currentTarget.setAttribute("aria-pressed", showSpine); selected ? select(selected) : clearSel(); });

// Keep the chosen table in view beside the open panel (right on desktop, below on phones).
function reveal(name) {
  const r = stage.getBoundingClientRect(), panel = document.getElementById("panel");
  const side = panel.offsetTop === 0; // layout position, ignoring the slide-in transform
  const visW = side ? panel.offsetLeft : r.width, visH = side ? r.height : panel.offsetTop;
  if (r.width < 760 && view.k < 0.75) view.k = 0.75; // phones: zoom in far enough to read names
  const p = pos.get(name), cx = view.x + (p.x + CW / 2) * view.k, cy = view.y + (p.y + CH / 2) * view.k;
  if (r.width < 760 || cx < 40 || cx > visW - 40) view.x += visW / 2 - cx;
  if (r.width < 760 || cy < 40 || cy > visH - 40) view.y += visH / 2 - cy;
  apply();
}

// ---------- search ----------
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { selected ? select(selected) : clearSel(); return; }
  classes((n, g) => { const t = byName.get(n); const hit = n.includes(q) || t.columns.some(c => c.name.includes(q));
    g.classList.add(hit ? "hit" : "dim"); });
});
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return; const q = e.target.value.trim().toLowerCase();
  const t = ERD.tables.find(t => t.name === q) || ERD.tables.find(t => t.name.includes(q)) || ERD.tables.find(t => t.columns.some(c => c.name.includes(q)));
  if (t) select(t.name);
});

// ---------- detail panel ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
function prettySql(def) {
  let s = String(def)
    .replace(/::[a-z_ ]+(\[\])?(?![a-z_])/gi, "")
    .replace(/(\w+) = ANY \(ARRAY\[([^\]]*)\]\)/g, "$1 in ($2)")
    .replace(/\(ARRAY\[([^\]]*)\]\)/g, "($1)");
  for (let i = 0; i < 4; i++) { const t = s.trim(); if (t.startsWith("(") && balanced(t.slice(1, -1)) && t.endsWith(")")) s = t.slice(1, -1); }
  return s.trim();
}
function balanced(x) { let d = 0; for (const c of x) { if (c === "(") d++; if (c === ")") { d--; if (d < 0) return false; } } return d === 0; }
const link = n => `<a class="tl" data-t="${esc(n)}">${esc(n)}</a>`;
const cols = a => (Array.isArray(a) ? a : String(a).replace(/[{}]/g, "").split(",")).join(", ");
function idxCols(def) { const m = String(def || "").match(/USING \w+ \((.*?)\)(?: WHERE|$)/); return m ? m[1] : ""; }
function renderPanel(t) {
  const kids = children.get(t.name);
  const supports = t.uniques.filter(u => u.cols && u.cols.includes("id") && u.cols.length > 1);
  const realUniques = t.uniques.filter(u => !supports.includes(u));
  const rulesByKind = k => t.rules.filter(r => r.kind === k);
  const sec = (title, n, body) => `<h3>${title} <span class="n">${n === null ? "" : "(" + n + ")"}</span></h3>${body}`;
  const html = [];
  html.push(`<div class="ph"><h2>${esc(t.name)}</h2><button id="closeP" aria-label="Close">Close</button></div>`);
  html.push(`<div class="dom">${esc(t.domain)}${t.partitioned ? " · partitioned by week" : ""}</div>`);
  if (t.description) html.push(`<p class="desc">${md(t.description)}</p>`);
  html.push(`<div class="chips"><span class="chip">${t.columns.length} columns</span><span class="chip ok">${t.foreignKeys.length} links out</span>` +
    `<span class="chip">${kids.length} links in</span><span class="chip warn">${t.checks.length} checks</span><span class="chip">${realUniques.length} one-at-a-time</span></div>`);
  html.push(sec("Columns", t.columns.length, `<div class="tw"><table><thead><tr><th>Column</th><th>Type</th><th></th><th>Default</th></tr></thead><tbody>` +
    t.columns.map(c => `<tr><td class="m">${esc(c.name)}${c.pk ? '<span class="key">PK</span>' : ""}${c.fk ? '<span class="key">FK</span>' : ""}</td>` +
      `<td class="m">${esc(c.type)}</td><td>${c.required ? '<span class="req">required</span>' : '<span class="opt">optional</span>'}</td>` +
      `<td class="m">${esc((c.default || "").replace(/::[a-z_ ]+/gi, ""))}</td></tr>`).join("") + `</tbody></table></div>`));
  html.push(sec("Points to", t.foreignKeys.length, t.foreignKeys.length ? `<div class="tw"><table><thead><tr><th>Columns</th><th>Parent</th><th>On delete</th></tr></thead><tbody>` +
    t.foreignKeys.map(f => `<tr><td class="m">${esc(cols(f.cols))}</td><td>${link(f.parent)} <span class="m">(${esc(cols(f.parentCols))})</span></td>` +
      `<td><span class="del ${esc(f.onDelete)}">${esc(f.onDelete)}</span>${f.deferred ? " · checked at commit" : ""}</td></tr>`).join("") + `</tbody></table></div>` : `<p class="empty">No parents.</p>`));
  html.push(sec("Pointed at by", kids.length, kids.length ? `<div class="tw"><table><thead><tr><th>Child</th><th>Through</th><th>On delete</th></tr></thead><tbody>` +
    kids.map(k => `<tr><td>${link(k.child)}</td><td class="m">${esc(cols(k.fk.cols))}</td><td><span class="del ${esc(k.fk.onDelete)}">${esc(k.fk.onDelete)}</span></td></tr>`).join("") + `</tbody></table></div>` : `<p class="empty">Nothing points here.</p>`));
  const plain = [...rulesByKind("state"), ...rulesByKind("parent")];
  html.push(sec("Rules in plain words", plain.length, plain.length ? plain.map(r => `<div class="rule"><span class="k">${r.kind === "parent" ? "Exactly one parent" : "Required once something has happened"}</span>${md(r.text)}</div>`).join("") : `<p class="empty">No state rules beyond required columns and value lists.</p>`));
  html.push(sec("Checks in the database", t.checks.length, t.checks.length ? t.checks.map(c => `<div class="sql"><span class="nm">${esc(c.name)}</span>${esc(prettySql(c.def))}</div>`).join("") : `<p class="empty">No checks.</p>`));
  const uRules = rulesByKind("unique");
  html.push(sec("Only one at a time", realUniques.length, (uRules.length ? uRules.map(r => `<div class="rule"><span class="k">Why</span>${md(r.text)}</div>`).join("") : "") +
    (realUniques.length ? realUniques.map(u => `<div class="sql"><span class="nm">${esc(u.name)}</span>unique (${esc(u.cols ? cols(u.cols) : idxCols(u.def))})${u.where ? " where " + esc(prettySql(u.where)) : ""}</div>`).join("") : `<p class="empty">None.</p>`) +
    (supports.length ? `<p class="empty">Plus ${supports.length} key${supports.length > 1 ? "s" : ""} that composite links point at: ${supports.map(u => "(" + esc(cols(u.cols)) + ")").join(", ")}.</p>` : "")));
  const iRules = rulesByKind("index");
  html.push(sec("Indexes", t.indexes.length, (iRules.length ? iRules.map(r => `<div class="rule"><span class="k">Busy query</span>${md(r.text)}</div>`).join("") : "") +
    (t.indexes.length ? `<div class="tw"><table><thead><tr><th>Index</th><th>On</th></tr></thead><tbody>` +
      t.indexes.map(i => `<tr><td class="m">${esc(i.name)}</td><td class="m">${esc(idxCols("USING " + i.def) || i.def)}${i.where ? " where " + esc(prettySql(i.where)) : ""}</td></tr>`).join("") + `</tbody></table></div>` : `<p class="empty">None besides keys.</p>`)));
  if (t.triggers.length) html.push(sec("Triggers", t.triggers.length, t.triggers.map(tr => `<div class="sql"><span class="nm">${esc(tr.name)}</span>${esc(tr.def.replace(/^CREATE TRIGGER \S+ /, ""))}</div>`).join("")));
  html.push(`<p class="foot">Read from the database after applying ${esc(ERD.source.migrations.join(", "))}; descriptions and plain-words rules from ${esc(ERD.source.doc)}. Generated ${esc(ERD.generatedAt.slice(0, 16).replace("T", " "))} UTC.</p>`);
  const p = document.getElementById("panel"); p.innerHTML = html.join(""); p.classList.add("open"); p.scrollTop = 0;
  p.querySelector("#closeP").addEventListener("click", clearSel);
  p.querySelectorAll("a.tl").forEach(a => a.addEventListener("click", () => select(a.dataset.t)));
}

// ---------- start ----------
const startHash = location.hash;
const fromHash = (h = location.hash) => { const n = h.slice(1).replace(/-/g, "_"); if (byName.has(n)) select(n); };
fit(); clearSel(); fromHash(startHash);
window.addEventListener("hashchange", () => fromHash());
</script>
</body>
</html>
