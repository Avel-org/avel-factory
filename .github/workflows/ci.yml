# The main CI: the same four commands as local (pnpm build, typecheck, lint and
# test), against a real Postgres service. The image, user, password and database
# match scripts/pg-local.sh, so a test that passes locally sees the same server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avel
          POSTGRES_PASSWORD: avel
          POSTGRES_DB: avel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U avel -d avel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://avel:avel@127.0.0.1:5432/avel
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache (A11): build and typecheck results for packages whose inputs didn't
      # change are restored, not redone. Keyed on the lockfile and the commit, falling back to the
      # lockfile's newest cache. A remote cache needs a token, which Javaris may set up later.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @avel/server run check:effect
      - run: pnpm lint
      - run: pnpm test

  # CR-45 decision 1: on a pull request, the web's end-to-end tests run only when the web, the
  # contract, the mock, the lockfile or the workflows change. Pushes to main always run them.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if echo "$files" | grep -q -E '^(apps/web/|packages/contract/|packages/contract-mock/|pnpm-lock\.yaml$|\.github/workflows/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # The web's end-to-end tests (Build rules H4, H5, F6). A red test makes the job red; the
  # screenshots, videos and traces are kept on every run. Skipped (which counts as passing) when
  # nothing the web depends on changed (CR-45 decision 1).
  e2e:
    name: web e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @avel/web exec playwright install --with-deps chromium
      - run: pnpm --filter @avel/web exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-test-results
          path: apps/web/test-results
